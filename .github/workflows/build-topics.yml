name: Build the topic pages

# /kosher/ and /en/kosher/ are one panel of the site at an address of its own
# (Yossi, 28.11: the site is one page, so a search engine knew one address
# only and could not show "kosher food in Cervinia" to anyone searching for
# it). Each is the site itself opened on that panel with nothing around it,
# made from index.html by tools/build_topics.py - so only index.html is ever
# edited, and this makes the pages after every change to it.

on:
  push:
    branches: [main]
    paths: ['index.html', 'tools/build_en.py', 'tools/build_topics.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-topics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Make the topic pages from index.html
        run: python3 tools/build_topics.py
      - name: Commit them if they changed
        run: |
          git add -A kosher en/kosher
          if git diff --cached --quiet; then echo "topic pages already up to date"; exit 0; fi
          git config user.name "cervinia-bot"
          git config user.email "cervinia-bot@users.noreply.github.com"
          git commit -m "topics: the topic pages, made from index.html"
          for i in 1 2 3; do
            git pull --rebase --autostash && python3 tools/build_topics.py && git add -A kosher en/kosher \
              && (git diff --cached --quiet || git commit -m "topics: the topic pages, made from index.html") \
              && git push && exit 0
            sleep 5
          done
          exit 1

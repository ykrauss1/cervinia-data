# =====================================================================
#  CerviniaLive — the daily flight snapshot
#
#  Deliberately a workflow of its own rather than a step inside
#  update.yml. The scraper runs every half hour and is the thing the
#  whole site depends on; a flight job that hangs on a slow provider
#  must not be able to delay it or mark its run red.
#
#  Install: add this as .github/workflows/flights.yml
# =====================================================================
name: Daily flight prices

on:
  schedule:
    # 04:23 UTC — before Israel wakes, and off the hour, where every other
    # cron on GitHub queues up and waits.
    - cron: "23 4 * * *"
  workflow_dispatch:        # so the first run can be started by hand

permissions:
  contents: write

concurrency:
  group: cervinia-flights
  cancel-in-progress: false

jobs:
  flights:
    runs-on: ubuntu-latest
    # Twenty-five calendar calls plus three pricing calls - the live runs
    # came in at 96 and 137 seconds. Thirty minutes leaves room for the
    # retries without ever hanging the runner all day.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the price calendar and the headline offers
        run: node fetch-flights.mjs

      - name: Commit the snapshot
        run: |
          set -e
          git config user.name  "cervinia-bot"
          git config user.email "cervinia-bot@users.noreply.github.com"

          # `git add` BEFORE asking whether anything changed. git diff looks
          # only at tracked files, so on the first run - when the file is
          # brand new and untracked - it answered "nothing changed", and the
          # run wrote a perfectly good snapshot and then threw it away.
          git add data/flights.json

          if git diff --cached --quiet -- data/flights.json; then
            echo "prices unchanged — nothing to commit"
            exit 0
          fi

          git commit -m "flights: daily price snapshot"

          # Rebase rather than merge, and autostash so a run that leaves
          # anything else behind in the tree cannot stall the push. A plain
          # `git stash` is the wrong tool here: it exits 0 with nothing to
          # save, and the `pop` that follows then exits 1 on an empty stash
          # and fails the job.
          git pull --rebase --autostash
          git push

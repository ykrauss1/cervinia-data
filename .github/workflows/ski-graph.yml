# =====================================================================
#  CerviniaLive — raw data for the ski router
#
#  Run by hand (Actions → "Ski router data" → Run workflow). Downloads the
#  pistes, lifts and mountain railways of one ski area from OpenStreetMap,
#  with the heights of their ends, into data/ski-raw-AREA.json. It does not
#  touch the site: the graph the site reads is built from this file by
#  tools/build_ski_graph.py and committed with the code that uses it.
#
#  Another resort = another run with its own name and box.
# =====================================================================
name: Ski router data

on:
  workflow_dispatch:
    inputs:
      area:
        description: 'Short name of the ski area'
        default: 'cervinia'
      bbox:
        description: 'south west north east'
        default: '45.86 7.58 46.04 7.83'

permissions:
  contents: write

concurrency:
  group: cervinia-ski-graph
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download pistes, lifts and heights
        env:
          AREA: ${{ inputs.area }}
          BBOX: ${{ inputs.bbox }}
        run: python3 tools/fetch_ski_osm.py "$AREA" $BBOX

      - name: Commit the raw data
        env:
          AREA: ${{ inputs.area }}
        run: |
          set -e
          git config user.name  "cervinia-bot"
          git config user.email "cervinia-bot@users.noreply.github.com"
          f="data/ski-raw-$AREA.json"
          git add "$f"
          if git diff --cached --quiet -- "$f"; then
            echo "unchanged — nothing to commit"; exit 0
          fi
          git commit -m "ski router: raw OSM data for $AREA"
          git pull --rebase --autostash
          git push

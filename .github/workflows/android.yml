name: Android app

# Builds the Play app (android/) into a signed .aab, kept as an artifact of
# the run for uploading to Play Console. Run by hand: Actions → Android app →
# Run workflow.
#
# The signing key and its passwords live only in this repository's secrets:
#   KEYSTORE_B64       the upload key (signing.keystore from PWABuilder), base64
#   KEYSTORE_PASSWORD  its password
#   KEY_PASSWORD       the key's password (in PWABuilder's file: "key password")

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: The signing key, from the secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::The KEYSTORE_B64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build the bundle
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: cervinialive
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: cervinialive-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # The bundle also goes to the android-builds branch, one file a build,
      # so it can be fetched with git (artifact downloads need a browser
      # sign-in). Never main: the site does not carry builds.
      - name: Keep the bundle on the android-builds branch
        run: |
          set -e
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          V=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          mkdir -p "$RUNNER_TEMP/b" && cp "$AAB" "$RUNNER_TEMP/b/cervinialive-$V.aab"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin android-builds >/dev/null; then
            git fetch origin android-builds && git checkout android-builds
          else
            git checkout --orphan android-builds && git rm -rqf .
          fi
          cp "$RUNNER_TEMP/b/"*.aab .
          git add *.aab
          git commit -m "Android bundle $V (run ${{ github.run_id }})"
          git push origin android-builds

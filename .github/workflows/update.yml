name: Update Cervinia Data

on:
  schedule:
    - cron: "0 * * * *"   # כל שעה עגולה
  workflow_dispatch:       # אפשר גם להריץ ידנית מה־UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node scrape.js

      - name: Commit updated data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/data.json
          git commit -m "Update data.json from Cervinia" || echo "No changes to commit"

      - name: Push changes
        run: git push

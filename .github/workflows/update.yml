name: Run Scraper

on:
  schedule:
    # Not "*/30", which fires at :00 and :30 - the two busiest minutes on
    # GitHub's scheduler, where runs are routinely delayed and sometimes
    # dropped outright. Same cadence, moved off the crowd.
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A hung Puppeteer used to sit there until GitHub killed the job six hours
    # later. Ten minutes is four times what a good run needs.
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ------------------------------------------------------------------
      #  Chromium's libraries
      #
      #  The runner is Ubuntu 26.04 now, and the 64-bit time_t transition
      #  renamed a whole family of packages: libasound2, libatk1.0-0,
      #  libatk-bridge2.0-0, libcups2, libglib2.0-0 and libgtk-3-0 each
      #  became <name>t64. The old names did not disappear - they survive as
      #  VIRTUAL packages with no installation candidate, which is the trap:
      #
      #    E: Package 'libasound2' has no installation candidate
      #
      #  So "does apt know this name" is the wrong question; it answers yes
      #  for a virtual package. "apt-cache show" exits 0 for them, which is
      #  how an earlier version of this step picked libasound2 over
      #  libasound2t64 and killed the job. The right question is whether the
      #  name has a real installation CANDIDATE, which is what apt-cache
      #  policy reports - and that is what is asked below, plain name first,
      #  then the t64 twin.
      #
      #  Nothing here is fatal either. A missing library that Chromium
      #  actually needs shows up as a loud Puppeteer launch error one step
      #  later; a missing library it does not need should never have been
      #  able to stop a scraper run in the first place.
      # ------------------------------------------------------------------
      - name: Install Chromium dependencies
        run: |
          set -uo pipefail
          sudo apt-get update || true

          has_candidate() {
            apt-cache policy "$1" 2>/dev/null \
              | sed -n 's/^ *Candidate: *//p' | head -1 | grep -qv '^(none)$'
          }
          pick() {
            for cand in "$1" "${1}t64"; do
              if has_candidate "$cand"; then echo "$cand"; return 0; fi
            done
            return 1
          }

          want="ca-certificates fonts-liberation
                libasound2 libatk-bridge2.0-0 libatk1.0-0 libcairo2 libcups2
                libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libglib2.0-0
                libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0
                libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1
                libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1
                libxtst6"

          pkgs=""
          for p in $want; do
            if chosen="$(pick "$p")"; then
              pkgs="$pkgs $chosen"
              [ "$chosen" = "$p" ] || echo "note: using $chosen in place of $p"
            else
              echo "note: skipping $p - no installation candidate on this image"
            fi
          done
          echo "installing:$pkgs"

          # One go if it works; otherwise one at a time, so a single awkward
          # name cannot take the whole run down with it.
          if ! sudo apt-get install -y --no-install-recommends $pkgs; then
            echo "::warning::batch install failed - retrying package by package"
            for p in $pkgs; do
              sudo apt-get install -y --no-install-recommends "$p" \
                || echo "::warning::could not install $p - continuing"
            done
          fi

      - name: Install Node dependencies
        run: npm install

      - name: Run scraper
        run: node scrape.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ------------------------------------------------------------------
      #  Committing the reading
      #
      #  The old version ran "git stash --include-untracked" and then
      #  "git stash pop". Those two are not a pair: when there is nothing to
      #  stash, stash exits 0 having saved nothing, and pop then exits 1 with
      #  "No stash entries found" - a red run caused purely by the data not
      #  having changed. Verified, not assumed: stash exit=0, pop exit=1.
      #
      #  Rather than pair them correctly, the whole dance goes. "pull --rebase
      #  --autostash" sets the working tree aside, rebases onto the remote and
      #  puts it back, in one flag that cannot leave a half-applied stash
      #  behind. The checkout is fresh, so there were never local commits to
      #  replay in the first place.
      # ------------------------------------------------------------------
      - name: Commit data.json to repo
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain data/data.json)" ]; then
            echo "data.json unchanged - nothing to commit."
            exit 0
          fi

          git pull --rebase --autostash origin main

          git add data/data.json
          if git diff --cached --quiet; then
            echo "No changes after rebase - skipping."
            exit 0
          fi

          git commit -m "Update data.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

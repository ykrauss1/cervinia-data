name: Update Cervinia Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node scrape.js

      - name: Commit updated HTML files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add home.html meteo.html webcams.html || true
          git commit -m "Update scraped HTML" || true
          git push || true

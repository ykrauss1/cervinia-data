name: Cervinia Scraper
on:
  schedule:
    - cron: '*/30 * * * *' # רץ כל חצי שעה
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Run Scraper
        run: node scraper.js
      - name: Commit Data
        run: |
          git config --global user.name "Cervinia-Bot"
          git config --global user.email "bot@cervinia.live"
          git add data.json
          git commit -m "Update ski data" || exit 0
          git push

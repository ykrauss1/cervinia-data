<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Final Fix v14</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', system-ui; background: var(--bg); margin: 0; direction: rtl; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        /* תיקון סמן: יישור לימין, אבל תמיכה ביוניקוד למיקום הסמן */
        textarea, input { 
            direction: rtl !important; text-align: right !important; 
            unicode-bidi: bidi-override !important; 
            box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
        }

        nav { background: var(--dark); color: white; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        .services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
        .service-btn { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 20px; position: relative; }
        .close-btn { position: absolute; left: 20px; top: 20px; cursor: pointer; font-size: 1.5rem; }

        .search-options { display: none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .booking-btn { background: #003580; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 10px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .airbnb-btn { background: #FF5A5F; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .post { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 10px; background: white; }
        .reply-item { margin: 8px 25px 0 0; padding: 10px; background: #f8fbff; border-right: 3px solid var(--accent); border-radius: 4px; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:bold;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="services-grid">
        <div class="service-btn" onclick="openM('hotelModal')"><i class="fa-solid fa-hotel"></i> אירוח</div>
        <div class="service-btn" onclick="openM('mapModal')"><i class="fa-solid fa-map-location-dot"></i> מפות</div>
    </div>

    <div class="card">
        <h3>תחזית וצפי (מהיום 15.02)</h3>
        <table style="width:100%; border-collapse: collapse;">
            <thead><tr><th>צפי</th><th>תאריך</th><th>טמפ'</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>פורום</h3>
        <div id="f-container"></div>
        <textarea id="f-input" rows="3" placeholder="כתוב הודעה..." style="margin-top:20px;"></textarea>
        <button class="service-btn" style="background:var(--accent); color:white; border:none; width:100%; margin-top:10px;" onclick="sendPost()">פרסם</button>
    </div>
</div>

<div id="authModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeM('authModal')">×</span>
        <h3>כניסה</h3>
        <input type="text" id="authName" placeholder="שם">
        <input type="email" id="authEmail" placeholder="אימייל" style="margin-top:10px;">
        <button class="service-btn" style="width:100%; background:var(--accent); color:white; margin-top:20px;" onclick="handleAuth()">התחברות</button>
    </div>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeM('hotelModal')">×</span>
        <h3>חיפוש אירוח</h3>
        <input type="text" id="dateRange" placeholder="בחר תאריכים...">
        <button class="service-btn" style="width:100%; margin-top:15px; background:var(--dark); color:white;" onclick="showSearchOptions()">הצג אפשרויות חיפוש</button>
        
        <div id="searchOptions" class="search-options">
            <button class="booking-btn" onclick="doSearch('booking')"><i class="fa-solid fa-building"></i> Booking.com</button>
            <button class="airbnb-btn" onclick="doSearch('airbnb')"><i class="fa-brands fa-airbnb"></i> Airbnb</button>
        </div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    window.onload = () => { renderHeader(); loadW(); loadF(); flatpickr("#dateRange", { mode: "range", minDate: "today" }); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        area.innerHTML = user ? `<b>${user.name}</b> | <a href="#" onclick="logout()">התנתק</a>` : `<button onclick="openM('authModal')">כניסה</button>`;
    }

    async function loadW() {
        const r = await fetch('data.json?v=' + Date.now());
        const d = await r.json();
        const filtered = d.forecast.filter(f => parseInt(f.date.split('.')[0]) >= 15).slice(0, 4);
        document.getElementById('w-body').innerHTML = filtered.map(f => `<tr><td>גבוה</td><td>${f.date}</td><td>${f.temp_min}/${f.temp_max}</td></tr>`).join('');
    }

    async function loadF() {
        const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
        const data = await res.json();
        document.getElementById('f-container').innerHTML = data.map(p => `
            <div class="post">
                <b>${p.user}</b>: ${p.content}
                <br><small style="color:var(--accent); cursor:pointer;" onclick="openRBox('${p.id}', '${p.user}', this)">השב</small>
                <div class="r-target"></div>
                ${(p.replies || []).map(r => `<div class="reply-item"><b>${r.user}</b>: ${r.content}</div>`).join('')}
            </div>`).join('');
    }

    function openRBox(pId, toUser, el) {
        const target = el.nextElementSibling;
        if(target.innerHTML) { target.innerHTML = ''; return; }
        const prefix = `@${toUser}: `;
        target.innerHTML = `<div style="margin-top:10px;">
            <textarea id="in-${pId}">${prefix}</textarea>
            <button onclick="sendR('${pId}')">שלח</button>
            <button onclick="this.parentElement.innerHTML=''">בטל</button>
        </div>`;
        const tx = document.getElementById(`in-${pId}`);
        setTimeout(() => {
            tx.focus();
            // מיקום הסמן משמאל לשם המשתמש
            tx.setSelectionRange(prefix.length, prefix.length);
        }, 50);
    }

    async function sendPost() {
        const v = document.getElementById('f-input').value;
        if(!user) return openM('authModal');
        await fetch(`${API}/posts`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({user:user.name, content:v}) });
        location.reload();
    }

    function showSearchOptions() {
        if(!document.getElementById('dateRange').value) return alert("בחר תאריכים");
        document.getElementById('searchOptions').style.display = 'block';
    }

    function doSearch(site) {
        const d = document.getElementById('dateRange').value.split(" to ");
        const url = site === 'booking' ? `https://www.booking.com/searchresults.he.html?ss=Breuil-Cervinia&checkin=${d[0]}&checkout=${d[1]}` : `https://www.airbnb.co.il/s/Breuil-Cervinia/homes?checkin=${d[0]}&checkout=${d[1]}`;
        window.open(url);
    }

    function handleAuth() {
        user = {name: document.getElementById('authName').value, email: document.getElementById('authEmail').value};
        localStorage.setItem('skiUser', JSON.stringify(user));
        location.reload();
    }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
    function openM(id) { document.getElementById(id).style.display='flex'; }
    function closeM(id) { document.getElementById(id).style.display='none'; }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Professional Threading</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        /* עיצוב הפורום */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; }
        .reply-item { 
            margin-top: 10px; padding: 10px; 
            background: #f8fbff; border-right: 4px solid #cbd5e0; 
            border-radius: 6px; 
        }
        /* הזחה משתנה לפי עומק */
        .depth-1 { margin-right: 40px; border-right-color: var(--accent); }
        .depth-2 { margin-right: 80px; border-right-color: #2c3e50; }

        .user-tag { font-weight: 800; color: var(--dark); }
        .time-tag { font-size: 0.75rem; color: #999; margin-right: 10px; }
        .action-link { color: #3498db; cursor: pointer; font-size: 0.85rem; font-weight: bold; margin-top: 5px; display: inline-block; }
        .del-btn { color: var(--error); cursor: pointer; float: left; border: none; background: none; font-size: 0.9rem; }
        .logout-btn { background: none; border: 1px solid white; color: white; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
        
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; }
        .btn-send { background: var(--accent); color: var(--dark); padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa fa-link"></i><br><small>קישור לצ'רמט</small><br><b>בבדיקה</b></div>
        <div class="stat-card"><i class="fa fa-mountain"></i><br><small>מסלולים</small><br><b>109</b></div>
        <div class="stat-card"><i class="fa fa-wind"></i><br><small>מעליות</small><br><b>47</b></div>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <hr>
        <textarea id="f-input" placeholder="כתוב פוסט חדש..."></textarea>
        <button class="btn-send" onclick="sendPost()">פרסם פוסט</button>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }};

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    window.onload = () => { renderHeader(); loadF(); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            area.innerHTML = `שלום, <b>${user.name}</b> | <button class="logout-btn" onclick="logout()">התנתק</button>`;
        } else {
            area.innerHTML = `<button class="btn-send" onclick="login()">כניסה</button>`;
        }
    }

    function login() {
        const n = prompt("שם:"); const e = prompt("אימייל:");
        if(n && e) { user = {name:n, email:e}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); }
    }

    function logout() { localStorage.removeItem('skiUser'); location.reload(); }

    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const isAdmin = user && user.email === 'ykrauss1@gmail.com';

            let html = '';
            data.forEach(p => {
                const replies = p.replies || [];
                replies.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

                // פונקציית עזר לבניית עץ תגובות
                function buildTree(parentId = null, depth = 0) {
                    return replies
                        .filter(r => r.parent_id === parentId)
                        .map(r => `
                            <div class="reply-item ${depth > 0 ? 'depth-' + depth : ''}">
                                ${isAdmin ? `<button class="del-btn" onclick="delMsg('replies','${r.id}')"><i class="fa fa-trash"></i></button>` : ''}
                                <span class="user-tag">${r.user}</span>
                                <span class="time-tag">${new Date(r.created_at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</span>
                                <div>${r.content}</div>
                                <span class="action-link" onclick="openBox('${p.id}', '${r.user}', this, '${r.id}')">השב</span>
                                <div class="reply-target"></div>
                                ${buildTree(r.id, depth + 1).join('')}
                            </div>
                        `);
                }

                html += `
                    <div class="post">
                        ${isAdmin ? `<button class="del-btn" onclick="delMsg('posts','${p.id}')">מחק פוסט</button>` : ''}
                        <span class="user-tag">${p.user}</span>
                        <div style="margin:10px 0; font-weight:bold;">${p.content}</div>
                        <span class="action-link" onclick="openBox('${p.id}', '${p.user}', this, null)">השב</span>
                        <div class="reply-target"></div>
                        <div class="replies-list">${buildTree(null, 0).join('')}</div>
                    </div>`;
            });
            document.getElementById('f-container').innerHTML = html;
        } catch(e) {}
    }

    function openBox(pId, toUser, el, parentId) {
        if(!user) return alert("התחבר");
        const target = el.nextElementSibling;
        if(target.innerHTML !== '') { target.innerHTML = ''; return; }
        document.querySelectorAll('.reply-target').forEach(t => t.innerHTML = '');
        target.innerHTML = `
            <div style="margin:10px 0; background:#eee; padding:10px; border-radius:5px;">
                <textarea id="temp-in-${pId}">@${toUser}: </textarea>
                <button class="btn-send" onclick="sendReply('${pId}', ${parentId ? `'${parentId}'` : 'null'})">שלח</button>
            </div>`;
    }

    async function sendPost() {
        const c = document.getElementById('f-input').value;
        if(!c.trim()) return;
        await fetch(`${API}/posts`, { method:'POST', ...HEAD, body: JSON.stringify({user: user.name, content: c}) });
        document.getElementById('f-input').value = ''; loadF();
    }

    async function sendReply(pId, parentId) {
        const c = document.querySelector(`#temp-in-${pId}`).value;
        if(!c.trim()) return;
        const body = { post_id: pId, user: user.name, content: c, parent_id: parentId };
        await fetch(`${API}/replies`, { method:'POST', ...HEAD, body: JSON.stringify(body) });
        loadF();
    }

    async function delMsg(table, id) {
        if(confirm("למחוק?")) { await fetch(`${API}/${table}?id=eq.${id}`, { method:'DELETE', headers: HEAD.headers }); loadF(); }
    }
</script>
</body>
</html>

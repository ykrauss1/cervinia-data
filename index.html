<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - Final Recovery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #e0e6ed; --white: #ffffff; --error: #e74c3c; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        nav { background: var(--primary); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo-text { font-size: 1.8em; font-weight: 900; }
        .logo-text span { color: var(--accent); }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }

        /* Status & Weather Headers */
        .live-status-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .status-item { background: #0d1b3e; color: white; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .status-val { font-size: 1.5em; font-weight: bold; color: var(--error); }
        .weather-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .weather-card { background: #d9e2ec; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #c0cbd9; }

        /* Forecast Table */
        .forecast-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .forecast-table th { background: #f8fafc; padding: 12px; border-bottom: 2px solid #ddd; text-align: center; }
        .forecast-table td { padding: 15px 5px; border-bottom: 1px solid #eee; text-align: center; word-wrap: break-word; }
        .ltr { direction: ltr; display: inline-block; }

        /* Forum - The Nesting Fix */
        .post-container { border-bottom: 2px solid #edf2f7; padding: 15px 0; }
        .post-main { background: #fff; padding: 10px; border-radius: 8px; }
        .replies-area { margin-right: 40px; margin-top: 10px; border-right: 3px solid var(--accent); padding-right: 15px; }
        .reply-item { background: #f1f5f9; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
        
        .author { font-weight: bold; color: var(--primary); }
        .action-bar { margin-top: 5px; display: flex; gap: 15px; }
        .action-link { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: bold; font-size: 0.8em; padding: 0; }
        .action-link.del { color: var(--error); }

        /* Reply Box */
        .reply-box { background: #fff; border: 2px solid var(--accent); border-radius: 10px; padding: 12px; margin: 10px 0; }
        .btn-row { display: flex; flex-direction: row-reverse; gap: 10px; margin-top: 10px; }
        .btn { padding: 6px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-send { background: var(--accent); color: var(--primary); }
        .btn-cancel { background: #ccc; }
        
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 5px; padding: 8px; font-family: inherit; resize: none; }
    </style>
</head>
<body>

<nav>
    <div class="logo-text">Cervinia<span>Live</span></div>
    <div id="nav-controls"><button class="btn btn-send" onclick="openAuth()">כניסה</button></div>
</nav>

<div class="container">
    <div class="live-status-bar">
        <div class="status-item"><i class="fa-solid fa-link"></i><div class="status-val" id="link-stat">N/A</div><small>קישור לצ'רמט</small></div>
        <div class="status-item"><i class="fa-solid fa-route"></i><div class="status-val" id="slopes-stat">N/A</div><small>מסלולים פתוחים</small></div>
        <div class="status-item"><i class="fa-solid fa-cable-car"></i><div class="status-val" id="lifts-stat">N/A</div><small>מעליות פתוחות</small></div>
    </div>

    <div class="weather-grid">
        <div class="weather-card"><h4>Plateau Rosa (3480m)</h4><div class="ltr"><b id="p-temp">--</b>° | <b id="p-snow">--</b>cm</div></div>
        <div class="weather-card"><h4>Plan Maison (2550m)</h4><div class="ltr"><b id="m-temp">--</b>° | <b id="m-snow">--</b>cm</div></div>
        <div class="weather-card"><h4>עיירה (2050m)</h4><div class="ltr"><b id="t-temp">--</b>° | <b id="t-snow">--</b>cm</div></div>
    </div>

    <div class="card">
        <h3>תחזית וסטטוס (4 ימים)</h3>
        <table class="forecast-table">
            <thead>
                <tr>
                    <th style="width:18%">תאריך</th>
                    <th style="width:22%">טמפ'</th>
                    <th style="width:20%">רוח</th>
                    <th style="width:15%">ראות</th>
                    <th style="width:10%">ממטרים</th>
                    <th style="width:15%">סטטוס</th>
                </tr>
            </thead>
            <tbody id="forecast-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="posts-display">טוען הודעות...</div>
        <div style="margin-top:20px; border-top:1px solid #eee; padding-top:15px;">
            <textarea id="main-input" rows="2" placeholder="כתוב פוסט חדש..."></textarea>
            <div class="btn-row"><button class="btn btn-send" onclick="addPost()">פרסם פוסט</button></div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    async function loadWeather() {
        try {
            const res = await fetch('data.json?t=' + Date.now());
            const data = await res.json();
            
            // עליון
            document.getElementById('p-temp').innerText = data.levels.plateau.temp;
            document.getElementById('p-snow').innerText = data.levels.plateau.snow;
            document.getElementById('m-temp').innerText = data.levels.plan.temp;
            document.getElementById('m-snow').innerText = data.levels.plan.snow;
            document.getElementById('t-temp').innerText = data.levels.town.temp;
            document.getElementById('t-snow').innerText = data.levels.town.snow;

            // טבלה - גישה ישירה למערך למניעת "טבלה ריקה"
            const rows = data.forecast.slice(0, 4);
            document.getElementById('forecast-body').innerHTML = rows.map(d => `
                <tr>
                    <td><b>${d.date}</b></td>
                    <td class="ltr">${d.temp_min.replace('°C','')}/${d.temp_max.replace('°C','')}°C</td>
                    <td class="ltr">${d.wind.replace('km/h','')} km/h</td>
                    <td>${d.visibility || 'טובה'}</td>
                    <td>${d.humidity || '0%'}</td>
                    <td style="color:green; font-weight:bold">פתוח</td>
                </tr>
            `).join('');
        } catch(e) { console.error("Error loading JSON:", e); }
    }

    async function fetchForum() {
        const { data: posts, error } = await _supabase.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
        if (error) return console.error(error);
        
        const isAdmin = user && (user.email === 'ykrauss1@gmail.com' || user.name === 'ADMIN');

        document.getElementById('posts-display').innerHTML = posts.map(p => {
            const repliesHtml = (p.replies || []).map(r => `
                <div class="reply-item">
                    <span class="author">${r.user}:</span> ${r.content}
                    <div class="action-bar">
                        <button class="action-link" onclick="openReply('${p.id}', '${r.id}')">השב</button>
                        ${isAdmin ? `<button class="action-link del" onclick="deleteItem('replies','${r.id}')">מחק</button>` : ''}
                    </div>
                    <div id="box-${r.id}"></div>
                </div>
            `).join('');

            return `
                <div class="post-container">
                    <div class="post-main">
                        <span class="author">${p.user}:</span> ${p.content}
                        <div class="action-bar">
                            <button class="action-link" onclick="openReply('${p.id}', '${p.id}')">השב</button>
                            ${isAdmin ? `<button class="action-link del" onclick="deleteItem('posts','${p.id}')">מחק פוסט</button>` : ''}
                        </div>
                        <div id="box-${p.id}"></div>
                    </div>
                    <div class="replies-area">${repliesHtml}</div>
                </div>
            `;
        }).join('');
    }

    function openReply(postId, targetId) {
        document.querySelectorAll('.reply-box').forEach(el => el.remove());
        const target = document.getElementById('box-' + targetId);
        target.innerHTML = `
            <div class="reply-box">
                <textarea id="input-${targetId}" rows="2" placeholder="כתוב תגובה..."></textarea>
                <div class="btn-row">
                    <button class="btn btn-send" onclick="sendReply('${postId}', '${targetId}')">שלח</button>
                    <button class="btn btn-cancel" onclick="this.parentElement.parentElement.remove()">ביטול</button>
                </div>
            </div>`;
        document.getElementById(`input-${targetId}`).focus();
    }

    async function sendReply(pId, tId) {
        if(!user) return alert("נא להתחבר");
        const txt = document.getElementById('input-' + tId).value;
        if(!txt.trim()) return;
        await _supabase.from('replies').insert([{ post_id: pId, user: user.name, content: txt }]);
        fetchForum();
    }

    async function addPost() {
        if(!user) return alert("נא להתחבר");
        const txt = document.getElementById('main-input').value;
        if(!txt.trim()) return;
        await _supabase.from('posts').insert([{ user: user.name, content: txt }]);
        document.getElementById('main-input').value = "";
        fetchForum();
    }

    async function deleteItem(table, id) {
        if(!confirm("למחוק?")) return;
        const { error } = await _supabase.from(table).delete().eq('id', id);
        if(error) alert("שגיאה במחיקה: " + error.message);
        else fetchForum();
    }

    function openAuth() {
        const n = prompt("שם:"), e = prompt("אימייל:");
        if(n && e) { localStorage.setItem('skiUser', JSON.stringify({name:n, email:e})); location.reload(); }
    }

    if(user) {
        document.getElementById('nav-controls').innerHTML = `
            <span style="margin-left:10px">שלום, <b>${user.name}</b></span>
            <button class="btn" style="background:red; color:white" onclick="localStorage.clear();location.reload()">התנתק</button>
        `;
    }

    window.addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelectorAll('.reply-box').forEach(el => el.remove()); });
    
    loadWeather();
    fetchForum();
</script>
</body>
</html>

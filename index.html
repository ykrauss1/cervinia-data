<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - Final Stable</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #e0e6ed; --white: #ffffff; --error: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        nav { background: var(--primary); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-text { font-size: 1.8em; font-weight: 900; }
        .logo-text span { color: var(--accent); }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        
        /* Top Status Cards - Matches your image */
        .live-status-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .status-item { background: #0d1b3e; color: white; padding: 20px; border-radius: 12px; text-align: center; position: relative; }
        .status-item i { display: block; font-size: 1.5em; color: var(--accent); margin-bottom: 8px; }
        .status-val { font-size: 1.8em; font-weight: bold; color: #ff4d4d; } /* N/A in Red */

        /* Weather Info - Matches your image */
        .section-title { font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .weather-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .weather-card { background: #d9e2ec; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #c0cbd9; }
        .weather-card h4 { margin: 0 0 10px 0; font-size: 1em; border-bottom: 1px solid #b0bbc9; padding-bottom: 5px; }
        .weather-card .val { font-size: 1.2em; font-weight: bold; direction: ltr; display: inline-block; }

        /* Table - Fixed Minus & Date */
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { background: #f8f9fa; padding: 12px; border-bottom: 2px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .ltr { direction: ltr; display: inline-block; }

        /* Forum - Fixed Height & Buttons */
        .forum-window { max-height: 450px; overflow-y: auto; padding: 15px; background: #fafafa; border-radius: 10px; border: 1px solid #eee; }
        .post { border-bottom: 1px solid #eee; padding: 15px 0; position: relative; }
        .post b { color: #333; }
        .replies { margin-right: 30px; border-right: 2px solid #eee; padding-right: 15px; margin-top: 10px; }
        .reply-item { background: #f1f3f5; padding: 8px; border-radius: 6px; margin-top: 5px; font-size: 0.9em; }
        .btn-sm { padding: 4px 10px; font-size: 0.8em; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; background: white; margin-left: 5px; }
        .btn-del { color: #e74c3c; border-color: #fab1a0; }

        /* Auth Modal */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .auth-card { background: white; padding: 30px; border-radius: 15px; width: 350px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-main { background: var(--accent); color: var(--primary); padding: 12px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<nav>
    <div class="logo-text">Cervinia<span>Live</span></div>
    <div id="nav-controls"><button onclick="openAuth()" class="btn-main" style="width:auto">כניסה / הרשמה</button></div>
</nav>

<div class="container">
    <div class="live-status-bar">
        <div class="status-item"><i class="fa-solid fa-link"></i><div class="status-val">N/A</div><small>קישור לצ'רמט</small></div>
        <div class="status-item"><i class="fa-solid fa-route"></i><div class="status-val">N/A</div><small>מסלולים פתוחים</small></div>
        <div class="status-item"><i class="fa-solid fa-cable-car"></i><div class="status-val">N/A</div><small>מעליות פתוחות</small></div>
    </div>

    <div class="section-title"><i class="fa-solid fa-mountain"></i> מצב השלג ומזג האוויר</div>
    <div class="weather-grid">
        <div class="weather-card"><h4>Plateau Rosa (3480m)</h4><div class="val"><span id="p-temp">N/A</span> | <span id="p-snow">N/A</span> <i class="fa-regular fa-snowflake" style="font-size:0.8em"></i></div></div>
        <div class="weather-card"><h4>Plan Maison (2550m)</h4><div class="val"><span id="m-temp">N/A</span> | <span id="m-snow">N/A</span> <i class="fa-regular fa-snowflake" style="font-size:0.8em"></i></div></div>
        <div class="weather-card"><h4>עיירה (2050m)</h4><div class="val"><span id="t-temp">N/A</span> | <span id="t-snow">N/A</span> <i class="fa-regular fa-snowflake" style="font-size:0.8em"></i></div></div>
    </div>

    <div class="card">
        <div class="section-title"><i class="fa-solid fa-list-check"></i> תחזית וסטטוס קישור</div>
        <table>
            <thead><tr><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th><th>ממטרים</th><th>סטטוס</th></tr></thead>
            <tbody id="forecast-body"></tbody>
        </table>
    </div>

    <div class="card" style="margin-top:25px;">
        <h3>עדכונים מהשטח</h3>
        <div id="posts-container" class="forum-window">טוען...</div>
        <textarea id="forum-input" rows="2" style="width:100%; margin-top:15px; padding:10px; border-radius:8px; border:1px solid #ddd;" placeholder="כתוב הודעה חדשה..."></textarea>
        <button class="btn-main" style="margin-top:10px" onclick="addPost()">שלח פוסט</button>
    </div>
</div>

<div id="auth-modal" onclick="if(event.target.id === 'auth-modal') closeAuth()">
    <div class="auth-card" onclick="event.stopPropagation()">
        <h3>כניסה למערכת</h3>
        <input type="text" id="a-name" placeholder="שם משתמש">
        <input type="email" id="a-email" placeholder="אימייל">
        <input type="password" id="a-pass" placeholder="סיסמה">
        <button class="btn-main" onclick="processAuth()">אישור</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    function openAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
    function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }
    function processAuth() {
        user = { name: document.getElementById('a-name').value, email: document.getElementById('a-email').value };
        localStorage.setItem('skiUser', JSON.stringify(user));
        location.reload();
    }

    async function loadData() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            
            // Fixed levels data
            if(data.levels) {
                document.getElementById('p-temp').innerText = data.levels.plateau.temp;
                document.getElementById('p-snow').innerText = data.levels.plateau.snow;
                document.getElementById('m-temp').innerText = data.levels.plan.temp;
                document.getElementById('m-snow').innerText = data.levels.plan.snow;
                document.getElementById('t-temp').innerText = data.levels.town.temp;
                document.getElementById('t-snow').innerText = data.levels.town.snow;
            }

            // FILTER: Only today (10/02) and forward
            const today = new Date(); today.setHours(0,0,0,0);
            const future = data.forecast.filter(d => {
                const [day, mon] = d.date.split('-');
                const dObj = new Date(2026, mon-1, day);
                return dObj >= today;
            }).slice(0, 4);

            document.getElementById('forecast-body').innerHTML = future.map(d => `
                <tr>
                    <td>${d.date}</td>
                    <td class="ltr">${d.temp_min}/${d.temp_max}°C</td>
                    <td>km/h ${d.wind}</td>
                    <td>${d.visibility || 'טובה'}</td>
                    <td>${d.humidity || 'N/A'}</td>
                    <td style="color:${parseInt(d.wind)>40?'orange':'green'}">✅ פתוח</td>
                </tr>
            `).join('');
        } catch(e) {}
    }

    async function fetchPosts() {
        const { data: posts } = await _supabase.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
        if (!posts) return;
        const isAdmin = user && user.email === 'ykrauss1@gmail.com';
        document.getElementById('posts-container').innerHTML = posts.map(p => `
            <div class="post">
                <b>${p.user}:</b> ${p.content}
                <div style="margin-top:5px">
                    <button class="btn-sm" onclick="addR('${p.id}')">השב</button>
                    ${isAdmin ? `<button class="btn-sm btn-del" onclick="delP('${p.id}')">מחק</button>` : ''}
                </div>
                <div class="replies">${(p.replies || []).map(r => `<div class="reply-item"><b>${r.user}:</b> ${r.content}</div>`).join('')}</div>
            </div>
        `).join('');
    }

    async function addPost() { if(!user) return openAuth(); const c = document.getElementById('forum-input').value; if(c.trim()){ await _supabase.from('posts').insert([{user:user.name, content:c}]); location.reload(); }}
    async function delP(id) { if(confirm("למחוק?")){ await _supabase.from('posts').delete().eq('id', id); fetchPosts(); }}

    if(user) { document.getElementById('nav-controls').innerHTML = `<span style="color:white">שלום, <b>${user.name}</b></span>`; }
    loadData(); fetchPosts();
</script>
</body>
</html>

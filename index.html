<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Stable Version</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; position: relative; }
        .reply-item { margin-top: 10px; padding: 10px; background: #f8fbff; border-right: 4px solid #cbd5e0; border-radius: 6px; }
        .admin-badge { background: var(--error); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-left: 5px; }
        .del-btn { color: var(--error); cursor: pointer; float: left; border: 1px solid var(--error); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; background: white; font-weight: bold; }
        .btn-send { background: var(--accent); color: var(--dark); padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; margin-top: 10px; font-family: inherit; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa fa-mountain"></i><br><small>מסלולים</small><br><b>109</b></div>
        <div class="stat-card"><i class="fa fa-wind"></i><br><small>מעליות</small><br><b>47</b></div>
        <div class="stat-card"><i class="fa fa- skiers"></i><br><small>מצב האתר</small><br><b>פתוח</b></div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים הקרובים</h3>
        <table>
            <thead><tr><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
            <tbody id="w-body"><tr><td colspan="4">טוען...</td></tr></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <hr>
        <textarea id="f-input" placeholder="כתוב פוסט חדש..."></textarea>
        <button class="btn-send" onclick="sendPost()">פרסם פוסט</button>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }};
    
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    const ADMIN_NAME = 'ADMIN';

    window.onload = () => { renderHeader(); loadW(); loadF(); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            area.innerHTML = `<div>${user.name === ADMIN_NAME ? '<span class="admin-badge">ADMIN</span>' : ''} שלום, <b>${user.name}</b> | <a href="#" onclick="logout()" style="color:white; text-decoration:underline; font-size:0.8rem;">התנתק</a></div>`;
        } else {
            area.innerHTML = `<button class="btn-send" onclick="login()">כניסה</button>`;
        }
    }

    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            document.getElementById('w-body').innerHTML = d.forecast.slice(0,4).map(f => `<tr><td>${f.date}</td><td>${f.temp_min}/${f.temp_max}</td><td>${f.wind}</td><td>${f.visibility}</td></tr>`).join('');
        } catch(e) { document.getElementById('w-body').innerHTML = 'תקלה בטעינה'; }
    }

    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const isAdmin = user && user.name === ADMIN_NAME;

            let html = '';
            data.forEach(p => {
                const buildTree = (parentId = null) => {
                    return (p.replies || []).filter(r => r.parent_id === parentId).map(r => `
                        <div class="reply-item">
                            ${isAdmin ? `<button class="del-btn" onclick="deleteMsg('replies','${r.id}')">מחק</button>` : ''}
                            <span style="font-weight:800;">${r.user === ADMIN_NAME ? '<span class="admin-badge">ADMIN</span>' : r.user}</span>
                            <div style="margin:5px 0;">${r.content}</div>
                            <span style="color:#3498db; cursor:pointer; font-size:0.8rem; font-weight:bold;" onclick="openBox('${p.id}', '${r.user}', this, '${r.id}')">השב</span>
                            <div class="reply-target"></div>
                            ${buildTree(r.id)}
                        </div>`).join('');
                };

                html += `
                    <div class="post">
                        ${isAdmin ? `<button class="del-btn" onclick="deleteMsg('posts','${p.id}')">מחק פוסט</button>` : ''}
                        <span style="font-weight:800;">${p.user === ADMIN_NAME ? '<span class="admin-badge">ADMIN</span>' : p.user}</span>
                        <div style="margin:10px 0; font-weight:bold; font-size:1.1rem;">${p.content}</div>
                        <span style="color:#3498db; cursor:pointer; font-size:0.8rem; font-weight:bold;" onclick="openBox('${p.id}', '${p.user}', this, null)">השב</span>
                        <div class="reply-target"></div>
                        ${buildTree(null)}
                    </div>`;
            });
            document.getElementById('f-container').innerHTML = html || 'אין הודעות.';
        } catch(e) {}
    }

    async function deleteMsg(table, id) {
        if(!confirm("למחוק?")) return;
        const res = await fetch(`${API}/${table}?id=eq.${id}`, { method: 'DELETE', headers: HEAD.headers });
        if(res.ok) loadF();
        else alert("שגיאה במחיקה. וודא שה-SQL בוצע.");
    }

    async function sendPost() {
        const input = document.getElementById('f-input');
        if(!user || !input.value.trim()) return;
        await fetch(`${API}/posts`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({user: user.name, content: input.value.trim()}) });
        input.value = ''; loadF();
    }

    async function sendReply(pId, pParentId) {
        const area = document.querySelector(`#temp-in-${pId}`);
        if(!area.value.trim()) return;
        await fetch(`${API}/replies`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({post_id: pId, user: user.name, content: area.value.trim(), parent_id: pParentId}) });
        loadF();
    }

    function openBox(pId, toUser, el, parentId) {
        const target = el.nextElementSibling;
        if(target.innerHTML !== '') { target.innerHTML = ''; return; }
        document.querySelectorAll('.reply-target').forEach(t => t.innerHTML = '');
        target.innerHTML = `<div style="margin:10px 0;"><textarea id="temp-in-${pId}">@${toUser}: </textarea><br><button class="btn-send" onclick="sendReply('${pId}', ${parentId ? `'${parentId}'` : 'null'})">שלח</button></div>`;
    }

    function login() {
        const n = prompt("שם:");
        if(n) { user = {name:n}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); }
    }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

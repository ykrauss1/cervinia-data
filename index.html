<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - מערכת ניהול</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #e0e6ed; --white: #ffffff; --error: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; }
        
        /* Login */
        #login-overlay { position: fixed; inset: 0; background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .login-card { background: white; padding: 35px; border-radius: 20px; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .login-card input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        
        /* UI Components */
        nav { background: var(--primary); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        /* Pages */
        .page { display: none; }
        .page.active { display: block; }

        /* Admin Dashboard Specific */
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--primary); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .admin-table { width: 100%; border-collapse: collapse; background: white; }
        .admin-table th, .admin-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: right; }
        .admin-badge { background: var(--error); color: white; padding: 3px 10px; border-radius: 5px; font-size: 0.8em; font-weight: bold; }
        
        /* Buttons */
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: var(--primary); }
        .btn-admin { background: #f1c40f; color: #000; margin-right: 10px; }
        .btn-danger { background: var(--error); color: white; padding: 5px 10px; font-size: 0.8em; }

        .webcams { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .cam-box { background: #000; height: 180px; border-radius: 10px; overflow: hidden; border: 2px solid white; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h2 style="margin-top:0">CerviniaLive</h2>
        <p style="color:#666; font-size:0.9em">הזן פרטים כדי להיכנס למערכת</p>
        <input type="text" id="login-name" placeholder="שם מלא">
        <input type="email" id="login-email" placeholder="אימייל">
        <input type="password" id="login-pass" placeholder="סיסמה">
        <button class="btn btn-primary" style="width:100%" onclick="handleLogin()">כניסה למערכת</button>
    </div>
</div>

<nav>
    <div style="font-size:1.6em; font-weight:900; cursor:pointer" onclick="showPage('main')">Cervinia<span>Live</span></div>
    <div id="nav-controls">
        </div>
</nav>

<div class="container">
    
    <div id="main-page" class="page active">
        <div class="card" style="display:flex; justify-content:space-around; text-align:center;">
            <div>עיירה<br><b id="t-town" style="font-size:2em; color:var(--primary)">--</b></div>
            <div>אמצע<br><b id="t-mid" style="font-size:2em; color:var(--primary)">--</b></div>
            <div>פסגה<br><b id="t-peak" style="font-size:2em; color:var(--primary)">--</b></div>
        </div>

        <div class="webcams">
            <div class="cam-box"><iframe src="https://webcam.cervinia.it/webcam/cervinia/cervinia-1.jpg"></iframe></div>
            <div class="cam-box"><iframe src="https://webcam.cervinia.it/webcam/cervinia/plan-maison-1.jpg"></iframe></div>
            <div class="cam-box"><iframe src="https://webcam.cervinia.it/webcam/cervinia/plateau-rosa-1.jpg"></iframe></div>
        </div>

        <div class="card" style="margin-top:25px;">
            <h3>עדכונים מהשטח</h3>
            <div id="posts-container"></div>
            <textarea id="forum-input" style="width:100%; height:80px; margin-top:15px; border-radius:10px; padding:12px; border:1px solid #ddd" placeholder="כתוב הודעה לגולשים..."></textarea>
            <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="addPost()">שלח הודעה</button>
        </div>
    </div>

    <div id="admin-page" class="page">
        <div class="card">
            <h2 style="margin-top:0">לוח בקרה - מנהל מערכת</h2>
            <div class="admin-grid">
                <div class="stat-card"><small>הודעות בפורום</small><div id="stat-posts" style="font-size:1.5em; font-weight:bold">0</div></div>
                <div class="stat-card"><small>סטטוס DB</small><div style="font-size:1.5em; font-weight:bold; color:var(--success)">מחובר</div></div>
                <div class="stat-card"><small>מייל מנהל</small><div style="font-size:0.9em; margin-top:5px;">ykrauss1@gmail.com</div></div>
            </div>

            <h3>ניהול הודעות פורום</h3>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>כותב</th>
                        <th>תוכן</th>
                        <th>תאריך</th>
                        <th>פעולות</th>
                    </tr>
                </thead>
                <tbody id="admin-posts-table">
                    </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    // הגדרות Supabase
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_KEY = 'YOUR_ANON_KEY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let user = null;
    let isAdmin = false;

    function handleLogin() {
        const name = document.getElementById('login-name').value;
        const email = document.getElementById('login-email').value;
        if (!name || !email) return alert("מלא פרטים");

        user = { name, email };
        isAdmin = email.toLowerCase() === 'ykrauss1@gmail.com';

        document.getElementById('login-overlay').style.display = 'none';
        
        // בניית התפריט
        let controls = document.getElementById('nav-controls');
        controls.innerHTML = `שלום, <b>${name}</b> ${isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}`;
        if (isAdmin) {
            controls.innerHTML += `<button class="btn btn-admin" onclick="showPage('admin')">ניהול אתר</button>`;
        }
        controls.innerHTML += `<button class="btn" onclick="location.reload()">התנתק</button>`;

        fetchPosts();
    }

    function showPage(pageName) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageName + '-page').classList.add('active');
        if(pageName === 'admin') loadAdminStats();
    }

    async function fetchPosts() {
        const { data, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
        if (error) return;

        // עדכון הפורום הציבורי
        const container = document.getElementById('posts-container');
        container.innerHTML = "";
        data.forEach(post => {
            container.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee"><b>${post.user}:</b> ${post.content}</div>`;
        });

        // הכנת טבלת הניהול (רק אם אדמין)
        if (isAdmin) {
            const adminTable = document.getElementById('admin-posts-table');
            adminTable.innerHTML = "";
            document.getElementById('stat-posts').innerText = data.length;
            data.forEach(post => {
                adminTable.innerHTML += `
                    <tr>
                        <td>${post.user}</td>
                        <td>${post.content.substring(0,30)}...</td>
                        <td>${new Date(post.created_at).toLocaleDateString()}</td>
                        <td><button class="btn btn-danger" onclick="deletePost('${post.id}')">מחק</button></td>
                    </tr>`;
            });
        }
    }

    async function addPost() {
        const input = document.getElementById('forum-input');
        if (!input.value.trim()) return;
        await _supabase.from('posts').insert([{ user: user.name, content: input.value }]);
        input.value = "";
        fetchPosts();
    }

    async function deletePost(id) {
        if (confirm("למחוק הודעה זו לצמיתות?")) {
            await _supabase.from('posts').delete().eq('id', id);
            fetchPosts();
        }
    }

    async function loadWeather() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            document.getElementById('t-peak').innerText = data.temp + "°";
            document.getElementById('t-mid').innerText = (parseFloat(data.temp)+4).toFixed(1) + "°";
            document.getElementById('t-town').innerText = (parseFloat(data.temp)+8).toFixed(1) + "°";
        } catch(e) {}
    }

    loadWeather();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - גרסת שחזור</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background: #e9ebee; margin: 0; direction: rtl; }
        header { background: #003580; color: white; padding: 20px; text-align: center; }
        .wrapper { max-width: 700px; margin: auto; padding: 10px; }
        
        /* Stats Table - הכי בטוח נגד תזוזות */
        .stats-table { width: 100%; background: white; margin-bottom: 20px; border-collapse: collapse; border-radius: 8px; overflow: hidden; }
        .stats-table td { padding: 15px; text-align: center; border: 1px solid #ddd; }
        
        /* פוסטים - מבנה בלוק פשוט */
        .post { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .post-user { font-weight: bold; color: #003580; font-size: 1.1rem; }
        .post-content { margin: 10px 0; font-size: 1.1rem; line-height: 1.4; }
        .post-img { max-width: 100%; height: auto; display: block; margin: 10px 0; border-radius: 4px; }
        
        /* תגובות */
        .reply-area { margin-right: 20px; border-right: 3px solid #003580; padding: 5px 10px; background: #f9f9f9; margin-top: 10px; }
        .reply-item { padding: 5px 0; border-bottom: 1px solid #eee; }

        /* כפתורי פעולה */
        .btn-action { color: #003580; cursor: pointer; font-size: 0.9rem; font-weight: bold; background: none; border: none; padding: 5px; }
        
        /* תיבת כתיבה */
        .editor { background: white; padding: 15px; border-radius: 8px; border: 2px solid #003580; }
        textarea { width: 100%; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; font-size: 1rem; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .send-btn { background: #003580; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>CERVINIA LIVE</h1>
    <div id="user-info"></div>
</header>

<div class="wrapper">
    <table class="stats-table">
        <tr>
            <td>מזג אוויר<br><b id="w-temp">--</b></td>
            <td>מעליות<br><b id="w-lifts">--</b></td>
            <td>מסלולים<br><b id="w-slopes">--</b></td>
            <td onclick="window.open('https://www.cervinia.it/en/winter/skirama')" style="cursor:pointer; background:#f0f7ff;">מפה<br><b>פתח</b></td>
        </tr>
    </table>

    <div id="forum-feed">טוען הודעות...</div>

    <div class="editor">
        <strong>עדכון חדש מהשטח:</strong>
        <textarea id="post-text" rows="3" placeholder="מה תרצה לספר לנו?"></textarea>
        <div class="toolbar">
            <label style="cursor:pointer;">
                <i class="fa fa-paperclip" style="font-size:1.5rem;"></i> צרף תמונה
                <input type="file" id="post-file" hidden onchange="alert('קובץ נבחר')">
            </label>
            <button class="send-btn" onclick="submitNewPost()">פרסם עכשיו</button>
        </div>
    </div>
</div>

<script>
    const PROJECT = 'cdgqodtbdhsqkvcgcdlm';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const API = `https://${PROJECT}.supabase.co/rest/v1`;
    const STORAGE = `https://${PROJECT}.supabase.co/storage/v1/object/public/images`;
    const HEADERS = { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' };

    let currentUser = JSON.parse(localStorage.getItem('skiUser')) || null;

    window.onload = () => {
        if(!currentUser) {
            let n = prompt("ברוך הבא! מה השם שלך?");
            if(n) { currentUser = {name: n}; localStorage.setItem('skiUser', JSON.stringify(currentUser)); }
        }
        document.getElementById('user-info').innerText = "שלום, " + (currentUser?.name || "אורח");
        refreshAll();
    };

    async function refreshAll() {
        // מזג אוויר
        const wReq = await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.93&longitude=7.71&current=temperature_2m');
        const wData = await wReq.json();
        document.getElementById('w-temp').innerText = Math.round(wData.current.temperature_2m) + "°";

        // נתוני אתר
        const sReq = await fetch(`${API}/site_status?id=eq.1`, { headers: HEADERS });
        const [sData] = await sReq.json();
        if(sData) {
            document.getElementById('w-lifts').innerText = sData.lifts;
            document.getElementById('w-slopes').innerText = sData.slopes;
        }

        // הודעות
        const pReq = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, { headers: HEADERS });
        const pData = await pReq.json();
        
        document.getElementById('forum-feed').innerHTML = pData.map(p => `
            <div class="post">
                <div class="post-user">${p.user}</div>
                <div class="post-content">${p.content}</div>
                ${p.image_url ? `<img src="${p.image_url}" class="post-img">` : ''}
                
                <div class="reply-area">
                    ${(p.replies || []).map(r => `<div class="reply-item"><b>${r.user}:</b> ${r.content}</div>`).join('')}
                </div>
                
                <button class="btn-action" onclick="addReply('${p.id}')">השב</button>
            </div>
        `).join('');
    }

    async function submitNewPost() {
        const text = document.getElementById('post-text').value;
        const file = document.getElementById('post-file').files[0];
        if(!text.trim()) return;

        let imgUrl = null;
        if(file) {
            const fileName = `${Date.now()}_${file.name}`;
            const up = await fetch(`https://${PROJECT}.supabase.co/storage/v1/object/images/${fileName}`, {
                method: 'POST',
                headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` },
                body: file
            });
            if(up.ok) imgUrl = `${STORAGE}/${fileName}`;
        }

        await fetch(`${API}/posts`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify({ user: currentUser.name, content: text, image_url: imgUrl })
        });
        
        document.getElementById('post-text').value = "";
        refreshAll();
    }

    async function addReply(postId) {
        const replyText = prompt("מה התגובה שלך?");
        if(!replyText) return;

        await fetch(`${API}/replies`, {
            method: 'POST',
            headers: HEADERS,
            body: JSON.stringify({ post_id: postId, user: currentUser.name, content: replyText })
        });
        refreshAll();
    }
</script>
</body>
</html>

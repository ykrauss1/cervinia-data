<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --error: #ff4d4d; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        
        nav { background: var(--primary); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.8rem; font-weight: 900; }
        .logo span { color: var(--accent); }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }

        /* Forecast Table */
        .forecast-table { width: 100%; border-collapse: collapse; }
        .forecast-table th { background: #f8fafc; padding: 12px; border-bottom: 2px solid #ddd; text-align: center; }
        .forecast-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        .ltr { direction: ltr; display: inline-block; }

        /* Forum Nesting */
        .post-box { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 20px; background: #fff; }
        .reply-node { margin-right: 40px; margin-top: 10px; padding: 10px; background: #f8fafc; border-right: 4px solid var(--accent); border-radius: 8px; }
        .action-bar { margin-top: 10px; display: flex; gap: 15px; }
        .btn-link { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 0.85rem; padding: 0; }
        .btn-del { color: var(--error); }

        /* Auth Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 380px; position: relative; }
        .field { margin-bottom: 15px; position: relative; }
        .field label { display: block; margin-bottom: 5px; font-weight: bold; }
        .field input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .eye-icon { position: absolute; left: 10px; top: 35px; cursor: pointer; color: #888; }
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        .toggle-auth { text-align: center; margin-top: 15px; font-size: 0.9rem; cursor: pointer; color: var(--accent); text-decoration: underline; }

        /* Reply Box & Buttons Order */
        .reply-box { background: white; border: 1px solid var(--accent); padding: 10px; border-radius: 8px; margin-top: 10px; }
        .btn-row { display: flex; flex-direction: row-reverse; gap: 10px; margin-top: 10px; justify-content: flex-end; }
        .btn-s { padding: 5px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-s.send { background: var(--accent); color: var(--primary); }
        .btn-s.cancel { background: #eee; }
    </style>
</head>
<body>

<nav>
    <div class="logo">Cervinia<span>Live</span></div>
    <div id="nav-actions"><button class="btn-s send" onclick="openAuth(true)">כניסה / הרשמה</button></div>
</nav>

<div class="container">
    <div class="card">
        <h3>תחזית (פורמט DD/MM/YYYY)</h3>
        <table class="forecast-table">
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>טמפרטורה</th>
                    <th>רוח</th>
                    <th>ראות</th>
                    <th>סטטוס</th>
                </tr>
            </thead>
            <tbody id="forecast-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>פורום עדכונים מהשטח</h3>
        <div id="forum-display">טוען הודעות...</div>
        <hr>
        <div style="margin-top:20px;">
            <textarea id="main-post-input" rows="2" style="width:100%; border-radius:10px; padding:10px;" placeholder="כתוב פוסט חדש..."></textarea>
            <div class="btn-row"><button class="btn-s send" onclick="addMainPost()">פרסם</button></div>
        </div>
    </div>
</div>

<div id="auth-modal" class="modal">
    <div class="modal-content">
        <h2 id="m-title">כניסה</h2>
        <div class="field">
            <label>אימייל</label>
            <input type="email" id="m-email" placeholder="you@example.com">
        </div>
        <div class="field" id="name-field" style="display:none;">
            <label>שם מלא</label>
            <input type="text" id="m-name" placeholder="השם שלך">
        </div>
        <div class="field">
            <label>סיסמה</label>
            <input type="password" id="m-pass">
            <i class="fa-solid fa-eye eye-icon" onclick="togglePass('m-pass')"></i>
        </div>
        <div class="field" id="confirm-field" style="display:none;">
            <label>אימות סיסמה</label>
            <input type="password" id="m-confirm">
            <i class="fa-solid fa-eye eye-icon" onclick="togglePass('m-confirm')"></i>
        </div>
        <button class="btn-main" onclick="handleAuth()">בצע</button>
        <div class="toggle-auth" onclick="switchAuthMode()" id="m-toggle">אין לך חשבון? הירשם כאן</div>
        <button class="btn-s cancel" style="width:100%; margin-top:10px;" onclick="openAuth(false)">ביטול</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    let isSignup = false;

    // 1. Data Loading
    async function loadData() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            document.getElementById('forecast-body').innerHTML = data.forecast.slice(0, 4).map(d => {
                // תיקון פורמט תאריך לישראלי
                const [y, m, d_val] = d.date.includes('-') ? d.date.split('-') : d.date.split('/');
                const formattedDate = d.date.length > 5 ? `${d_val}/${m}/${y}` : d.date;

                return `<tr>
                    <td><b>${formattedDate}</b></td>
                    <td class="ltr" style="color:#d63031; font-weight:bold">${d.temp_min}/${d.temp_max}°C</td>
                    <td class="ltr">${d.wind.replace('km/h','')} קמ"ש</td>
                    <td>${d.visibility || 'טובה'}</td>
                    <td><b style="color:green">פתוח</b></td>
                </tr>`;
            }).join('');
        } catch (e) { console.error(e); }
        fetchForum();
    }

    // 2. Forum logic
    async function fetchForum() {
        const { data: posts } = await _supabase.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
        if (!posts) return;
        const isAdmin = user && user.email === 'ykrauss1@gmail.com';

        document.getElementById('forum-display').innerHTML = posts.map(p => {
            const repsHtml = (p.replies || []).map(r => `
                <div class="reply-node">
                    <div style="font-weight:bold; font-size:0.9rem">${r.user}:</div>
                    <div>${r.content}</div>
                    <div class="action-bar">
                        <button class="btn-link" onclick="openReply('${p.id}', '${r.id}')">השב</button>
                        ${isAdmin ? `<button class="btn-link btn-del" onclick="delItem('replies','${r.id}')">מחק</button>` : ''}
                    </div>
                    <div id="target-${r.id}"></div>
                </div>`).join('');

            return `<div class="post-box">
                <div style="font-weight:bold; color:var(--primary)">${p.user}:</div>
                <div>${p.content}</div>
                <div class="action-bar">
                    <button class="btn-link" onclick="openReply('${p.id}', '${p.id}')">השב</button>
                    ${isAdmin ? `<button class="btn-link btn-del" onclick="delItem('posts','${p.id}')">מחק פוסט</button>` : ''}
                </div>
                <div id="target-${p.id}"></div>
                <div class="replies-list">${repsHtml}</div>
            </div>`;
        }).join('');
    }

    // 3. Auth UI Logic
    function openAuth(show) { document.getElementById('auth-modal').style.display = show ? 'flex' : 'none'; }
    function togglePass(id) {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
    }
    function switchAuthMode() {
        isSignup = !isSignup;
        document.getElementById('m-title').innerText = isSignup ? 'הרשמה' : 'כניסה';
        document.getElementById('name-field').style.display = isSignup ? 'block' : 'none';
        document.getElementById('confirm-field').style.display = isSignup ? 'block' : 'none';
        document.getElementById('m-toggle').innerText = isSignup ? 'כבר יש לך חשבון? היכנס' : 'אין לך חשבון? הירשם כאן';
    }

    async function handleAuth() {
        const email = document.getElementById('m-email').value;
        const name = document.getElementById('m-name').value || email.split('@')[0];
        const pass = document.getElementById('m-pass').value;
        if(email && pass) {
            user = { email, name };
            localStorage.setItem('skiUser', JSON.stringify(user));
            location.reload();
        }
    }

    function openReply(pId, tId) {
        if(!user) return openAuth(true);
        document.querySelectorAll('.reply-box').forEach(el => el.remove());
        const div = document.getElementById('target-' + tId);
        div.innerHTML = `
            <div class="reply-box">
                <textarea id="input-${tId}" style="width:100%; border:none; outline:none;" placeholder="תגובה..."></textarea>
                <div class="btn-row">
                    <button class="btn-s send" onclick="sendReply('${pId}', '${tId}')">שלח</button>
                    <button class="btn-s cancel" onclick="this.parentElement.parentElement.remove()">ביטול</button>
                </div>
            </div>`;
    }

    async function sendReply(pId, tId) {
        const val = document.getElementById('input-' + tId).value;
        if(!val.trim()) return;
        await _supabase.from('replies').insert([{ post_id: pId, user: user.name, content: val }]);
        fetchForum();
    }

    async function addMainPost() {
        if(!user) return openAuth(true);
        const val = document.getElementById('main-post-input').value;
        if(!val.trim()) return;
        await _supabase.from('posts').insert([{ user: user.name, content: val }]);
        document.getElementById('main-post-input').value = "";
        fetchForum();
    }

    async function delItem(tbl, id) { if(confirm("למחוק?")) { await _supabase.from(tbl).delete().eq('id', id); fetchForum(); } }

    if(user) {
        document.getElementById('nav-actions').innerHTML = `
            <span style="color:white; margin-left:15px">שלום, <b>${user.name}</b></span>
            <button class="btn-s cancel" onclick="localStorage.clear();location.reload()">התנתק</button>
        `;
    }

    loadData();
</script>
</body>
</html>

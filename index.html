<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cervinia Live Status</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans">

    <header class="relative h-64 bg-slate-900 overflow-hidden">
        <img src="https://images.unsplash.com/photo-1551632811-561732d1e306?q=80&w=2070&auto=format&fit=crop" class="w-full h-full object-cover opacity-60">
        <div class="absolute inset-0 flex flex-col justify-end p-6 bg-gradient-to-t from-slate-900">
            <h1 class="text-4xl font-black text-white italic tracking-tighter uppercase">BREUIL-CERVINIA</h1>
        </div>
    </header>

    <main class="max-w-md mx-auto -mt-8 relative z-10 px-4">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden">
            
            <div class="bg-slate-50 px-6 py-3 flex justify-between items-center border-b border-slate-100">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Live Updates</span>
                <span id="update-time" class="text-xs font-bold text-blue-500 italic">--:--</span>
            </div>

            <div class="p-6 space-y-6">
                <div>
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-tighter">Open Lifts</h3>
                    <p id="lift-status" class="text-3xl font-black text-slate-800 italic tracking-tighter">Loading...</p>
                </div>

                <div class="h-px bg-slate-100"></div>

                <div>
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-tighter">Zermatt Link</h3>
                    <p id="conn-status" class="text-3xl font-black italic tracking-tighter text-slate-300">Checking...</p>
                </div>
            </div>

            <div class="p-4 bg-slate-50">
                <button onclick="updatePage()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-xs uppercase tracking-[0.2em] hover:bg-slate-800 transition-all active:scale-95 shadow-xl">
                    Refresh Status
                </button>
            </div>
        </div>
    </main>

    <script>
        async function updatePage() {
            console.log("Starting update...");
            try {
                // שים לב: השתמשתי ב-Data.json עם D גדולה כפי שמופיע אצלך
                const response = await fetch('https://raw.githubusercontent.com/ykrauss1/cervinia-data/main/Data.json?t=' + Date.now());
                
                if (!response.ok) {
                    console.error("HTTP Error: " + response.status);
                    throw new Error("File not found");
                }

                const data = await response.json();
                console.log("Data received:", data);

                // עדכון מעליות
                document.getElementById('lift-status').innerText = data.lifts || "N/A";
                
                // עדכון חיבור
                const isOp = data.conn && data.conn.toLowerCase() === 'open';
                const connEl = document.getElementById('conn-status');
                connEl.innerText = isOp ? 'OPEN' : 'CLOSED';
                connEl.style.color = isOp ? '#16a34a' : '#ef4444';

                // עדכון זמן
                if (data.lastUpdate) {
                    const d = new Date(data.lastUpdate);
                    document.getElementById('update-time').innerText = d.toLocaleTimeString('he-IL', {hour: '2-digit', minute:'2-digit'});
                }

            } catch (e) {
                console.error("Script failed:", e);
                document.getElementById('lift-status').innerText = "Data Error";
                document.getElementById('conn-status').innerText = "OFFLINE";
            }
        }

        // הפעלה בטעינה
        window.addEventListener('load', () => {
            console.log("Page loaded, initializing...");
            if (window.lucide) lucide.createIcons();
            updatePage();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Final Verified</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; --warning: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; }
        .admin-badge { background: #ff0000; color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; margin-left: 10px; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        
        /* Stats Header - Fixed */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card small { display: block; margin-bottom: 5px; opacity: 0.8; font-size: 0.9rem; }
        .stat-card b { font-size: 1.4rem; }

        .services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
        .service-btn { background: white; border: 1px solid #ddd; padding: 18px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
        .temp-cell { direction: ltr !important; unicode-bidi: plaintext; font-weight: 600; }

        .post { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 15px; background: white; }
        .reply-item { margin-top: 10px; padding: 12px; background: #f8fbff; border-right: 4px solid #cbd5e0; border-radius: 8px; margin-right: 30px; }
        .reply-btn { color: var(--accent); cursor: pointer; font-weight: bold; font-size: 0.85rem; margin-top: 5px; display: inline-block; }
        
        .modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
        .modal-content { background: white; width: 95%; border-radius: 20px; position: relative; padding: 30px; box-sizing: border-box; }
        .modal-large { max-width: 1000px; height: 85vh; display: flex; flex-direction: column; }
        .close-modal { position: absolute; top: 15px; left: 15px; font-size: 2rem; cursor: pointer; z-index: 10; border: none; background: none; }
        .map-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .map-container { flex-grow: 1; border: 2px solid #eee; border-radius: 10px; overflow: hidden; background: #fafafa; }
        .hotel-box { display: none; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .counter-row { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px 15px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.6rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card"><small>טמפ'</small><b id="stat-temp">--</b></div>
        <div class="stat-card"><small>מסלולים</small><b id="stat-slopes">--</b></div>
        <div class="stat-card"><small>מעליות</small><b id="stat-lifts">--</b></div>
        <div class="stat-card"><small>סטטוס</small><b id="stat-conn">--</b></div>
    </div>

    <div class="services-grid">
        <div class="service-btn" onclick="openHotel()"><i class="fa fa-hotel"></i> אירוח</div>
        <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-schools', '_blank')"><i class="fa fa-person-skiing"></i> הדרכה</div>
        <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-rental', '_blank')"><i class="fa fa-skis"></i> ציוד</div>
        <div class="service-btn" onclick="openMaps()"><i class="fa fa-map-marked-alt"></i> מפות האתר</div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים הקרובים (Plateau Rosà)</h3>
        <table>
            <thead><tr><th>צפי</th><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <div style="background: #f1f3f5; padding: 20px; border-radius: 12px; margin-top: 20px;">
            <textarea id="f-input" rows="3" placeholder="מה קורה בצרביניה כרגע?" style="width:100%; border:1px solid #ddd; border-radius:8px; padding:10px; resize:none;"></textarea>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <div>
                    <span style="cursor:pointer; color:#888; margin-left:15px;" onclick="document.getElementById('f-input').value=''">בטל</span>
                    <i class="fa fa-paperclip" style="font-size:1.3rem; color:#666; cursor:pointer;"></i>
                </div>
                <button class="service-btn" style="background:var(--accent); border:none; padding:10px 25px;" onclick="sendPost()">פרסם פוסט</button>
            </div>
        </div>
    </div>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content modal-large">
        <button class="close-modal" onclick="closeM('mapModal')">×</button>
        <h2 style="text-align:center;">מפות האתר</h2>
        <div class="map-nav">
            <button class="service-btn" onclick="showMap('slopes')">מפת מסלולים (PDF)</button>
            <button class="service-btn" onclick="showMap('town')">מפת העיירה (Google)</button>
            <button class="service-btn" onclick="showMap('mine')">המפה שלי (JPG)</button>
        </div>
        <div class="map-container" id="map-viewer">
            <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#888;">בחר מפה מהתפריט</div>
        </div>
    </div>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content" style="max-width: 450px;">
        <button class="close-modal" onclick="closeM('hotelModal')">×</button>
        <h3 style="text-align:center;">חיפוש אירוח חכם</h3>
        <div id="hotel-form">
            <input type="text" id="dateRange" style="width:100%; padding:14px; border:1px solid #ddd; border-radius:10px; margin-bottom:15px; box-sizing: border-box;" placeholder="בחר תאריכים...">
            <div class="counter-row"><span>אורחים</span><div style="display:flex; align-items:center; gap:15px;"><button class="service-btn" style="padding:5px 12px;" onclick="updateCount('guests',-1)">-</button><b id="guests-val">2</b><button class="service-btn" style="padding:5px 12px;" onclick="updateCount('guests',1)">+</button></div></div>
            <div class="counter-row"><span>חדרים</span><div style="display:flex; align-items:center; gap:15px;"><button class="service-btn" style="padding:5px 12px;" onclick="updateCount('rooms',-1)">-</button><b id="rooms-val">1</b><button class="service-btn" style="padding:5px 12px;" onclick="updateCount('rooms',1)">+</button></div></div>
            <button class="service-btn" style="width:100%; background:var(--accent); border:none;" onclick="doSearch()">חפש מקום לינה</button>
        </div>
        <div id="hotel-results" class="hotel-box">
            <button class="service-btn" onclick="window.open(hUrls.booking)"><img src="https://upload.wikimedia.org/wikipedia/commons/b/be/Booking.com_logo.svg" height="15"></button>
            <button class="service-btn" onclick="window.open(hUrls.airbnb)"><img src="https://upload.wikimedia.org/wikipedia/en/a/a9/Airbnb_logo.svg" height="15"></button>
            <button class="service-btn" style="grid-column: span 2; background:#eee;" onclick="resetHotel()">חיפוש חדש</button>
        </div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    let hUrls = { booking: '', airbnb: '' };
    let counts = { guests: 2, rooms: 1 };

    window.onload = () => { renderHeader(); loadW(); loadF(); flatpickr("#dateRange", { mode: "range", dateFormat: "Y-m-d" }); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            area.innerHTML = `<div style="display:flex; align-items:center;">
                ${user.name === 'ADMIN' ? '<span class="admin-badge">ADMIN</span>' : ''}
                <span>שלום <b>${user.name}</b> | <a href="#" onclick="logout()" style="color:white; font-size:0.8rem;">התנתק</a></span>
            </div>`;
        } else { area.innerHTML = `<button onclick="login()" class="service-btn" style="padding:5px 15px;">כניסה</button>`; }
    }

    async function loadW() {
        const r = await fetch('data.json?v=' + Date.now());
        const d = await r.json();
        document.getElementById('stat-temp').innerText = d.temp.replace('--', '-');
        document.getElementById('stat-slopes').innerText = d.slopes;
        document.getElementById('stat-lifts').innerText = d.lifts;
        document.getElementById('stat-conn').innerText = d.conn === 'open' ? 'פתוח' : 'סגור';
        
        document.getElementById('w-body').innerHTML = d.forecast.slice(0,4).map(f => {
            const wind = parseFloat(f.wind);
            const prob = wind < 32 ? {c:'var(--success)', t:'גבוה'} : (wind > 50 ? {c:'var(--error)', t:'נמוך'} : {c:'var(--warning)', t:'בינוני'});
            const tempClean = f.temp_min.replace('--','-') + '/' + f.temp_max.replace('--','-');
            return `<tr><td style="color:${prob.c}; font-weight:bold;">${prob.t}</td><td>${f.date}</td><td class="temp-cell">${tempClean}</td><td>${f.wind}</td><td>${f.visibility}</td></tr>`;
        }).join('');
    }

    async function loadF() {
        const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
        const data = await res.json();
        const isAdmin = user && user.name === 'ADMIN';

        const buildTree = (replies, pId = null) => {
            return replies.filter(r => r.parent_id === pId).map(r => {
                const dt = new Date(r.created_at);
                const timeStr = `${dt.getDate().toString().padStart(2,'0')}.${(dt.getMonth()+1).toString().padStart(2,'0')}, ${dt.getHours().toString().padStart(2,'0')}:${dt.getMinutes().toString().padStart(2,'0')}`;
                return `<div class="reply-item">
                    ${isAdmin ? `<span style="color:red; cursor:pointer; float:left; font-size:0.7rem;" onclick="del('replies','${r.id}')">מחק</span>` : ''}
                    <b>${r.user}</b> <small style="color:#888;">${timeStr}</small>
                    <div style="margin:5px 0;">${r.content}</div>
                    <span class="reply-btn" onclick="openRBox('${r.post_id}', '${r.user}', this, '${r.id}')">השב</span>
                    <div class="r-target"></div>
                    ${buildTree(replies, r.id)}
                </div>`;
            }).join('');
        };

        document.getElementById('f-container').innerHTML = data.map(p => {
            const dt = new Date(p.created_at);
            const timeStr = `${dt.getDate().toString().padStart(2,'0')}.${(dt.getMonth()+1).toString().padStart(2,'0')}, ${dt.getHours().toString().padStart(2,'0')}:${dt.getMinutes().toString().padStart(2,'0')}`;
            return `<div class="post">
                ${isAdmin ? `<span style="color:red; cursor:pointer; float:left; font-size:0.7rem;" onclick="del('posts','${p.id}')">מחק פוסט</span>` : ''}
                <b>${p.user}</b> <small style="color:#888;">${timeStr}</small>
                <div style="margin:10px 0; font-size:1.1rem;">${p.content}</div>
                <span class="reply-btn" onclick="openRBox('${p.id}', '${p.user}', this, null)">השב</span>
                <div class="r-target"></div>
                ${buildTree(p.replies || [], null)}
            </div>`;
        }).join('');
    }

    function openRBox(pId, toUser, el, rId) {
        const target = el.nextElementSibling;
        if(target.innerHTML) return target.innerHTML = '';
        target.innerHTML = `<div style="margin-top:10px; background:#fff; padding:10px; border-radius:8px; border:1px solid #eee;">
            <textarea id="in-${pId}" rows="2" style="width:100%; border:1px solid #ddd; border-radius:6px; padding:8px; resize:none;">@${toUser}: </textarea>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                <div><span style="cursor:pointer; color:#888; margin-left:12px;" onclick="this.closest('.r-target').innerHTML=''">בטל</span><i class="fa fa-paperclip" style="color:#666;"></i></div>
                <button class="service-btn" style="padding:5px 15px; background:var(--accent); border:none;" onclick="sendR('${pId}','${rId||''}')">שלח</button>
            </div>
        </div>`;
        setTimeout(() => { const tx = document.getElementById(`in-${pId}`); tx.focus(); tx.setSelectionRange(tx.value.length, tx.value.length); }, 50);
    }

    async function sendPost() {
        const v = document.getElementById('f-input').value;
        if(!user || !v) return login();
        await fetch(`${API}/posts`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({user:user.name, content:v}) });
        location.reload();
    }

    async function sendR(pId, rId) {
        const v = document.getElementById(`in-${pId}`).value;
        await fetch(`${API}/replies`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({post_id:pId, user:user.name, content:v, parent_id: rId || null}) });
        loadF();
    }

    function updateCount(t, d) { counts[t] = Math.max(1, counts[t]+d); document.getElementById(`${t}-val`).innerText = counts[t]; }
    function openHotel() { resetHotel(); document.getElementById('hotelModal').style.display='flex'; }
    function doSearch() {
        const d = document.getElementById('dateRange').value.split(" to ");
        if(d.length < 2) return alert("בחר תאריכים");
        hUrls.booking = `https://www.booking.com/searchresults.he.html?ss=Breuil-Cervinia&checkin=${d[0]}&checkout=${d[1]}&group_adults=${counts.guests}&no_rooms=${counts.rooms}`;
        hUrls.airbnb = `https://www.airbnb.co.il/s/Breuil-Cervinia/homes?checkin=${d[0]}&checkout=${d[1]}&adults=${counts.guests}`;
        document.getElementById('hotel-form').style.display='none';
        document.getElementById('hotel-results').style.display='grid';
    }
    function resetHotel() { document.getElementById('hotel-form').style.display='block'; document.getElementById('hotel-results').style.display='none'; }
    function openMaps() { document.getElementById('mapModal').style.display='flex'; }
    function closeM(id) { document.getElementById(id).style.display='none'; }
    function showMap(type) {
        const v = document.getElementById('map-viewer');
        const urls = { slopes: 'https://github.com/ykrauss/Cervinia/raw/main/slopesmap.pdf', town: 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11107.478419614214!2d7.622613!3d45.934176!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4788cb97973976f9%3A0x2960f4b9c968940!2s11021%20Breuil-Cervinia%2C%20Aosta%20Valley%2C%20Italy!5e0!3m2!1sen!2sil!4v1700000000000', mine: 'https://github.com/ykrauss/Cervinia/raw/main/mymap.jpg' };
        v.innerHTML = type === 'mine' ? `<div style="height:100%; overflow:auto; text-align:center;"><img src="${urls.mine}" style="max-width:100%;"></div>` : `<iframe src="${urls[type]}" width="100%" height="100%" style="border:none;"></iframe>`;
    }
    async function del(t, id) { if(confirm('למחוק?')) { await fetch(`${API}/${t}?id=eq.${id}`, { method:'DELETE', headers: HEAD.headers }); loadF(); } }
    function login() { const n = prompt("שם:"); if(n) { user={name:n}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); } }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

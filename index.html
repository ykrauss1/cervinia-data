<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Final Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p: #0a192f; --a: #4cc9f0; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; }
        nav { background: var(--p); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* טבלה נקייה ומקצועית */
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f8fafc; padding: 15px; border-bottom: 2px solid #edf2f7; color: var(--p); }
        td { padding: 15px; border-bottom: 1px solid #edf2f7; text-align: center; font-size: 1rem; }
        .temp { direction: ltr; font-weight: bold; color: #e53e3e; }
        .wind { direction: ltr; color: #4a5568; }
        .status-ok { color: #38a169; font-weight: bold; }

        /* פורום */
        .post { border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .reply { margin-right: 35px; background: #f7fafc; padding: 10px; border-right: 4px solid var(--a); margin-top: 10px; border-radius: 4px; }
        .error-msg { color: #e53e3e; border: 1px solid #feb2b2; padding: 10px; border-radius: 5px; background: #fff5f5; }
        
        button { cursor: pointer; border: none; border-radius: 5px; padding: 8px 15px; font-weight: bold; }
        .btn-p { background: var(--a); color: var(--p); }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:bold;">Cervinia<span>Live</span></div>
    <div id="user-ui"><button class="btn-p" onclick="login()">כניסה</button></div>
</nav>

<div class="container">
    <div class="card">
        <h3 style="margin-top:0;">תחזית וסטטוס (מעודכן)</h3>
        <table>
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>טמפרטורה</th>
                    <th>רוח</th>
                    <th>ראות</th>
                    <th>סטטוס</th>
                </tr>
            </thead>
            <tbody id="f-body"><tr><td colspan="5">טוען נתונים...</td></tr></tbody>
        </table>
    </div>

    <div class="card">
        <h3 style="margin-top:0;">עדכונים מהשטח</h3>
        <div id="forum-root">מחבר לפורום...</div>
        <div style="margin-top:20px;">
            <textarea id="p-txt" style="width:100%; height:60px; padding:10px; border:1px solid #ddd; border-radius:5px;" placeholder="עדכון חדש..."></textarea>
            <button class="btn-p" style="margin-top:10px; float:left;" onclick="sendPost()">שלח עדכון</button>
            <div style="clear:both;"></div>
        </div>
    </div>
</div>

<script>
    const URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _sb = supabase.createClient(URL, KEY);
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    // פונקציית ניקוי מספרים בלבד - פותרת את הדרעק בטבלה
    function clean(str, unit) {
        if (!str) return "N/A";
        let num = str.replace(/[^\d.-]/g, ' ').trim().split(' ')[0];
        return num + " " + unit;
    }

    async function init() {
        if(user) document.getElementById('user-ui').innerHTML = `שלום, ${user.name} | <a href="#" onclick="logout()" style="color:white">התנתק</a>`;
        
        // טעינת טבלה
        try {
            const r = await fetch('data.json?v=' + Math.random());
            const d = await r.json();
            document.getElementById('f-body').innerHTML = d.forecast.slice(0,4).map(f => {
                let date = f.date;
                if(date.includes('-')) date = date.split('-').reverse().join('/');
                
                // כאן הניקוי הקריטי:
                let tMin = f.temp_min.replace('°C','').trim();
                let tMax = f.temp_max.replace('°C','').trim();
                let windNum = f.wind.replace('km/h','').trim();

                return `<tr>
                    <td><b>${date}</b></td>
                    <td class="temp">${tMin}/${tMax}°C</td>
                    <td class="wind">${windNum} קמ"ש</td>
                    <td>${f.visibility || 'טובה'}</td>
                    <td class="status-ok">פתוח</td>
                </tr>`;
            }).join('');
        } catch(e) { document.getElementById('f-body').innerHTML = "שגיאת נתונים"; }

        loadForum();
    }

    // פורום עם הגנה מפני AbortError
    async function loadForum(retryCount = 0) {
        try {
            const { data: ps, error } = await _sb.from('posts').select('*, replies(*)').order('created_at', {ascending: false});
            if (error) throw error;

            document.getElementById('forum-root').innerHTML = ps.map(p => `
                <div class="post">
                    <b>${p.user}:</b> ${p.content}
                    <div style="font-size:0.8rem; color:blue; cursor:pointer;" onclick="doRep('${p.id}')">השב</div>
                    <div id="r-${p.id}"></div>
                    ${(p.replies||[]).map(r => `<div class="reply"><b>${r.user}:</b> ${r.content}</div>`).join('')}
                </div>
            `).join('');
        } catch (e) {
            console.log("Forum Error:", e);
            if (retryCount < 3) {
                setTimeout(() => loadForum(retryCount + 1), 1000);
            } else {
                document.getElementById('forum-root').innerHTML = `<div class="error-msg">שגיאת חיבור (Abort). נסה לרענן את הדף (F5).</div>`;
            }
        }
    }

    function login() {
        const n = prompt("שם משתמש:");
        if(n) { 
            user = { name: n, email: 'user@test.com' };
            localStorage.setItem('skiUser', JSON.stringify(user));
            location.reload();
        }
    }

    function logout() { localStorage.clear(); location.reload(); }

    async function sendPost() {
        if(!user) return login();
        const t = document.getElementById('p-txt').value;
        if(t) {
            await _sb.from('posts').insert([{ user: user.name, content: t }]);
            document.getElementById('p-txt').value = "";
            loadForum();
        }
    }

    function doRep(id) {
        if(!user) return login();
        const div = document.getElementById('r-' + id);
        div.innerHTML = `<input id="i-${id}" style="width:70%"><button onclick="sendRep('${id}')">שלח</button>`;
    }

    async function sendRep(id) {
        const val = document.getElementById('i-' + id).value;
        await _sb.from('replies').insert([{ post_id: id, user: user.name, content: val }]);
        loadForum();
    }

    init();
</script>
</body>
</html>

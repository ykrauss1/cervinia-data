<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מצב גלישה - Cervinia</title>
    <style>
        :root {
            --primary-blue: #0056b3;
            --light-bg: #f4f7f9;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 20px 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .live-status {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .status-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--card-shadow);
            border-bottom: 5px solid var(--primary-blue);
        }
        .status-card h3 { margin: 0; font-size: 1.1em; color: #666; }
        .status-card .value { font-size: 2em; font-weight: bold; margin: 10px 0; color: #1e3c72; }
        
        .status-open { color: #28a745 !important; }
        .status-closed { color: #dc3545 !important; }

        .forecast-table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border-collapse: collapse;
        }
        .forecast-table th, .forecast-table td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        .forecast-table th { background-color: #f8f9fa; font-weight: bold; }

        .update-time {
            text-align: center;
            font-size: 0.85em;
            color: #888;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            border-top: 1px solid #ddd;
            direction: ltr;
        }
        footer a { color: var(--primary-blue); text-decoration: none; font-weight: bold; }

        @media (max-width: 600px) {
            .forecast-table { font-size: 0.9em; }
            .forecast-table th:nth-child(4), .forecast-table td:nth-child(4) { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Cervinia - Plateau Rosa</h1>
        <p>מצב מסלולים ותחזית מעודכנת</p>
    </header>

    <div class="live-status">
        <div class="status-card">
            <h3>מעליות פתוחות</h3>
            <div id="lifts" class="value">--</div>
        </div>
        <div class="status-card">
            <h3>מסלולים (ק"מ יחסי)</h3>
            <div id="slopes" class="value">--</div>
        </div>
        <div class="status-card">
            <h3>קישור לזארמט</h3>
            <div id="conn" class="value">--</div>
        </div>
        <div class="status-card">
            <h3>טמפ' נוכחית</h3>
            <div id="temp" class="value">--</div>
        </div>
    </div>

    <h2 style="text-align: center;">תחזית לימים הקרובים</h2>
    <table class="forecast-table">
        <thead>
            <tr>
                <th>תאריך</th>
                <th>טמפ' (Min/Max)</th>
                <th>רוח</th>
                <th>ראות</th>
                <th>סיכוי לקישור</th>
            </tr>
        </thead>
        <tbody id="forecast-body">
            </tbody>
    </table>

    <div class="update-time" id="last-update">עדכון אחרון: --</div>

    <footer>
        <p>Questions or feedback? Contact me at: 
           <a href="mailto:ykrauss1@gmail.com">ykrauss1@gmail.com</a>
        </p>
    </footer>
</div>

<script>
    async function loadData() {
        try {
            const response = await fetch('data.json?v=' + new Date().getTime());
            const data = await response.json();

            // עדכון נתונים חיים
            document.getElementById('lifts').innerText = data.lifts;
            document.getElementById('slopes').innerText = data.slopes;
            document.getElementById('temp').innerText = data.temp;
            
            const connElement = document.getElementById('conn');
            if(data.conn === "open") {
                connElement.innerText = "פתוח";
                connElement.className = "value status-open";
            } else {
                connElement.innerText = "סגור";
                connElement.className = "value status-closed";
            }

            document.getElementById('last-update').innerText = "עדכון אחרון: " + data.last_update;

            // עדכון טבלת תחזית
            const tbody = document.getElementById('forecast-body');
            tbody.innerHTML = '';
            data.forecast.forEach(day => {
                const row = `<tr>
                    <td>${day.date}</td>
                    <td>${day.temp_min} / ${day.temp_max}</td>
                    <td>${day.wind}</td>
                    <td>${day.visibility}</td>
                    <td style="font-weight:bold; color:${day.link_prob === 'High' ? '#28a745' : '#ffc107'}">${day.link_prob}</td>
                </tr>`;
                tbody.innerHTML += row;
            });

        } catch (error) {
            console.error("Error loading JSON:", error);
        }
    }

    loadData();
</script>

</body>
</html>

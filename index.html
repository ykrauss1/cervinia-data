<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; --warning: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        
        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        
        /* Table & Forecast */
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        .temp-cell { direction: ltr !important; unicode-bidi: plaintext; display: inline-block; width: 100%; }
        
        /* Forum Styling */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; position: relative; }
        .reply-item { margin-top: 10px; padding: 10px; background: #f8fbff; border-right: 4px solid #cbd5e0; border-radius: 6px; position: relative; }
        .post-time { font-size: 0.75rem; color: #888; margin-right: 10px; }
        .del-btn { color: var(--error); cursor: pointer; float: left; font-size: 0.8rem; font-weight: bold; border: 1px solid var(--error); padding: 2px 5px; border-radius: 4px; }
        
        .forum-input-area { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #eee; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: inherit; resize: none; margin-bottom: 10px; }
        
        /* Modals */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { background: white; width: 95%; max-width: 450px; padding: 25px; border-radius: 20px; position: relative; }
        .close-x { position: absolute; top: 15px; left: 15px; font-size: 1.5rem; cursor: pointer; border: none; background: none; }
        .btn-send { background: var(--accent); color: var(--dark); padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .service-btn { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; width: 100%; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="stats">
        <div id="stat-temp" class="stat-card">--</div>
        <div id="stat-slopes" class="stat-card">--</div>
        <div id="stat-lifts" class="stat-card">--</div>
        <div id="stat-conn" class="stat-card">--</div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px;">
        <div class="service-btn" style="margin:0" onclick="openModal('hotelModal')"><i class="fa fa-hotel"></i> אירוח</div>
        <div class="service-btn" style="margin:0" onclick="window.open('https://www.cervinia.it/en/winter/ski-schools', '_blank')"><i class="fa fa-person-skiing"></i> הדרכה</div>
        <div class="service-btn" style="margin:0" onclick="window.open('https://www.cervinia.it/en/winter/ski-rental', '_blank')"><i class="fa fa-ski"></i> ציוד</div>
        <div class="service-btn" style="margin:0" onclick="openModal('mapModal')"><i class="fa fa-map-marked-alt"></i> מפות</div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים הקרובים</h3>
        <table>
            <thead><tr><th>צפי</th><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <div class="forum-input-area">
            <textarea id="f-input" rows="3" placeholder="מה קורה בצרביניה כרגע?"></textarea>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <i class="fa fa-paperclip" style="cursor:pointer; color:#666; margin-left:15px;"></i>
                    <span style="cursor:pointer; color:#888;" onclick="document.getElementById('f-input').value=''">בטל</span>
                </div>
                <button class="btn-send" onclick="sendPost()">פרסם פוסט</button>
            </div>
        </div>
    </div>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeModal('mapModal')">×</button>
        <h3>מפות האתר</h3>
        <button class="service-btn" onclick="window.open('https://github.com/ykrauss/Cervinia/raw/main/slopesmap.pdf', '_blank')">מפת מסלולים (PDF)</button>
        <button class="service-btn" onclick="window.open('https://www.google.com/maps/search/Breuil-Cervinia', '_blank')">מפת העיירה (Google)</button>
        <button class="service-btn" onclick="window.open('https://github.com/ykrauss/Cervinia/raw/main/mymap.jpg', '_blank')">המפה שלי (JPG)</button>
    </div>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content">
        <button class="close-x" onclick="closeModal('hotelModal')">×</button>
        <h3>חיפוש אירוח</h3>
        <input type="text" id="dateRange" style="width:100%; padding:10px; margin-bottom:10px;" placeholder="בחר תאריכים...">
        <button class="btn-send" style="width:100%" onclick="window.open('https://www.booking.com/searchresults.he.html?ss=Breuil-Cervinia', '_blank')">חפש ב-Booking</button>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    window.onload = () => { renderHeader(); loadW(); loadF(); flatpickr("#dateRange", { mode: "range", minDate: "today" }); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            area.innerHTML = `<div>${user.name === 'ADMIN' ? '<span style="color:red;font-weight:bold;margin-left:10px;">ADMIN</span>' : ''}שלום <b>${user.name}</b> | <a href="#" onclick="logout()" style="color:white;text-decoration:none;">התנתק</a></div>`;
        } else { area.innerHTML = `<button class="btn-send" onclick="login()">כניסה</button>`; }
    }

    async function loadW() {
        const r = await fetch('data.json?v=' + Date.now());
        const d = await r.json();
        document.getElementById('stat-temp').innerHTML = `<small>טמפ'</small><br><b>${d.temp}</b>`;
        document.getElementById('stat-slopes').innerHTML = `<small>מסלולים</small><br><b>${d.slopes}</b>`;
        document.getElementById('stat-lifts').innerHTML = `<small>מעליות</small><br><b>${d.lifts}</b>`;
        document.getElementById('stat-conn').innerHTML = `<small>סטטוס</small><br><b>${d.conn === 'open' ? 'פתוח' : 'סגור'}</b>`;
        document.getElementById('w-body').innerHTML = d.forecast.slice(0,4).map(f => `<tr><td>--</td><td>${f.date}</td><td class="temp-cell">${f.temp_min}/${f.temp_max}</td><td>${f.wind}</td><td>${f.visibility}</td></tr>`).join('');
    }

    async function loadF() {
        const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
        const data = await res.json();
        const isAdmin = user && user.name === 'ADMIN';

        document.getElementById('f-container').innerHTML = data.map(p => {
            const time = new Date(p.created_at).toLocaleString('he-IL', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
            return `
            <div class="post">
                ${isAdmin ? `<span class="del-btn" onclick="del('posts','${p.id}')">מחק פוסט</span>` : ''}
                <b>${p.user}</b> <span class="post-time">${time}</span>
                <div style="margin:8px 0;">${p.content}</div>
                <div style="color:var(--accent); cursor:pointer; font-size:0.8rem;" onclick="openR('${p.id}', '${p.user}', this)">השב</div>
                <div class="r-target"></div>
                ${(p.replies || []).map(r => {
                    const rTime = new Date(r.created_at).toLocaleString('he-IL', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
                    return `
                    <div class="reply-item">
                        ${isAdmin ? `<span class="del-btn" onclick="del('replies','${r.id}')">מחק</span>` : ''}
                        <b>${r.user}</b> <span class="post-time">${rTime}</span>
                        <div style="margin:5px 0;">${r.content}</div>
                    </div>`;
                }).join('')}
            </div>`;
        }).join('');
    }

    function openR(pId, toUser, el) {
        const target = el.nextElementSibling;
        if(target.innerHTML) { target.innerHTML = ''; return; }
        target.innerHTML = `<div style="margin-top:10px;"><textarea id="in-${pId}">@${toUser}: </textarea><button class="btn-send" onclick="sendR('${pId}')">שלח</button></div>`;
    }

    async function sendPost() {
        const val = document.getElementById('f-input').value;
        if(!user || !val) return login();
        await fetch(`${API}/posts`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({user:user.name, content:val}) });
        location.reload();
    }

    async function sendR(pId) {
        const val = document.getElementById(`in-${pId}`).value;
        await fetch(`${API}/replies`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({post_id:pId, user:user.name, content:val}) });
        loadF();
    }

    async function del(t, id) { if(confirm('למחוק?')) { await fetch(`${API}/${t}?id=eq.${id}`, { method:'DELETE', headers: HEAD.headers }); loadF(); } }
    function openModal(id) { document.getElementById(id).style.display='flex'; }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
    function login() { const n = prompt("שם:"); if(n) { user = {name:n}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); } }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cervinia Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --accent: #0284c7; --bg: #f1f5f9; --slate: #1e293b; }
        body { background: var(--bg); font-family: system-ui, sans-serif; margin: 0; direction: rtl; }
        nav { background: white; padding: 15px 5%; display: flex; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .temp-badge { background: #e0f2fe; color: #0369a1; padding: 5px 15px; border-radius: 10px; font-weight: 800; font-size: 1.5rem; display: inline-block; margin-bottom: 10px; }
        .cam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
        .cam-grid img { width: 100%; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 1.5rem; font-weight: 900;">Cervinia<span style="color:var(--accent)">Live</span></div>
</nav>

<div class="container">
    <div class="card" style="background: var(--accent); color: white;">
        <h2 style="margin:0">סיכוי לפתיחת קישור לזארמט</h2>
        <div id="p-link" style="font-size: 1.8rem; font-weight: 900; margin-top:10px;">טוען...</div>
    </div>

    <div class="grid">
        <div class="card">
            <div id="d-temp" class="temp-badge">--°C</div>
            <h3>צ'רביניה</h3>
            <div id="c-lifts" style="font-size: 2rem; font-weight: 800;">--/--</div>
        </div>
        <div class="card">
            <h3>וולטורננש</h3>
            <div id="v-lifts" style="font-size: 1.5rem;">--/--</div>
        </div>
    </div>

    <h2 style="margin-top:40px;">מצלמות בשידור חי</h2>
    <div class="cam-grid">
        <img src="https://api.skiline.cc/panodata/webcam/635/snapshot" referrerpolicy="no-referrer">
        <img src="https://api.skiline.cc/panodata/webcam/634/snapshot" referrerpolicy="no-referrer">
    </div>
</div>

<script>
    async function update() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const d = await res.json();
            document.getElementById('p-link').innerText = d.wind_prediction;
            document.getElementById('d-temp').innerText = d.temp;
            document.getElementById('c-lifts').innerText = d.cervinia.lifts;
            document.getElementById('v-lifts').innerText = d.valtournenche.lifts;
        } catch (e) { console.log("טוען..."); }
    }
    window.onload = update;
</script>
</body>
</html>

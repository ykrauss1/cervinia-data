<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; --warning: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .service-btn { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; color: var(--dark); font-weight: bold; transition: all 0.3s ease; }
        .service-btn:hover { background: var(--accent); transform: translateY(-3px); }
        
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        .prob-High { color: var(--success); font-weight: bold; }
        .prob-Medium { color: var(--warning); font-weight: bold; }
        .prob-Low { color: var(--error); font-weight: bold; }
        
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; }
        .reply-item { margin-top: 10px; padding: 10px; background: #f8fbff; border-right: 4px solid #cbd5e0; border-radius: 6px; }
        .del-btn { color: var(--error); cursor: pointer; float: left; border: 1px solid var(--error); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; background: white; }
        
        .btn-send { background: var(--accent); color: var(--dark); padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; margin-top: 10px; font-family: inherit; resize: none; }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 95%; max-width: 900px; padding: 25px; border-radius: 20px; position: relative; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 15px; left: 15px; font-size: 1.5rem; cursor: pointer; border: none; background: none; }
        
        .map-nav { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap; }
        .map-btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--accent); background: white; cursor: pointer; font-weight: bold; }
        .map-btn.active { background: var(--accent); color: var(--dark); }
        #map-frame-container { width: 100%; height: 500px; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }

        .counter-box { display: flex; align-items: center; justify-content: space-between; background: #f1f3f5; padding: 10px; border-radius: 10px; margin: 10px 0; }
        .counter-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: white; cursor: pointer; font-weight: bold; }
        .provider-card { border: 2px solid #eee; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa fa-thermometer-half"></i><br><small>טמפ' כעת</small><br><b id="stat-temp">--</b></div>
        <div class="stat-card"><i class="fa fa-mountain"></i><br><small>מסלולים</small><br><b id="stat-slopes">--</b></div>
        <div class="stat-card"><i class="fa fa-wind"></i><br><small>מעליות</small><br><b id="stat-lifts">--</b></div>
        <div class="stat-card"><i class="fa fa-check-circle"></i><br><small>מצב האתר</small><br><b id="stat-conn">--</b></div>
    </div>

    <div class="services-grid">
        <div class="service-btn" onclick="openHotels()"><i class="fa fa-hotel"></i> אירוח</div>
        <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-schools', '_blank')"><i class="fa fa-person-skiing"></i> הדרכת סקי</div>
        <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-rental', '_blank')"><i class="fa fa-ski"></i> השכרת ציוד</div>
        <div class="service-btn" onclick="openMaps()"><i class="fa fa-map-marked-alt"></i> מפות האתר</div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים הקרובים (Plateau Rosà)</h3>
        <table>
            <thead><tr><th>צפי ללינק</th><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #eee;">
            <textarea id="f-input" rows="3" placeholder="מה קורה בצרביניה כרגע?"></textarea>
            <button class="btn-send" style="margin-top:10px" onclick="sendPost()">פרסם פוסט</button>
        </div>
    </div>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content" style="max-width: 450px;">
        <button class="close-modal" onclick="closeHotels()">×</button>
        <h3 style="margin-top:0">חיפוש אירוח חכם</h3>
        <div id="search-form">
            <input type="text" id="dateRange" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; margin:10px 0;" placeholder="בחר תאריכים...">
            <div class="counter-box"><span>אורחים</span><div><button class="counter-btn" onclick="updateCount('guests', -1)">-</button><b id="guests-val" style="margin:0 10px;">2</b><button class="counter-btn" onclick="updateCount('guests', 1)">+</button></div></div>
            <div class="counter-box"><span>חדרים</span><div><button class="counter-btn" onclick="updateCount('rooms', -1)">-</button><b id="rooms-val" style="margin:0 10px;">1</b><button class="counter-btn" onclick="updateCount('rooms', 1)">+</button></div></div>
            <button class="btn-send" style="width:100%; padding:15px; margin-top:10px;" onclick="generateSearchLinks()">חפש</button>
        </div>
        <div id="search-results" style="display:none; grid-template-columns: 1fr 1fr; gap:15px; margin-top:15px;">
            <div class="provider-card" onclick="goToLink('booking')">Booking</div>
            <div class="provider-card" onclick="goToLink('airbnb')">Airbnb</div>
            <button class="btn-send" style="grid-column: span 2; background:#eee; color:#333;" onclick="resetSearch()">חיפוש חדש</button>
        </div>
    </div>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeMaps()">×</button>
        <h3 style="margin-top:0">מפות האתר והעיירה</h3>
        <div class="map-nav">
            <button class="map-btn active" onclick="switchMap(this, 'slopes')">מפת מסלולים</button>
            <button class="map-btn" onclick="switchMap(this, 'town')">מפת העיירה</button>
            <button class="map-btn" onclick="switchMap(this, 'mymap')">המפה שלי</button>
        </div>
        <div id="map-frame-container">
            <iframe id="map-iframe" style="width:100%; height:100%; border:none;" src="https://raw.githubusercontent.com/ykrauss/Cervinia/main/slopesmap.pdf"></iframe>
        </div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    let counts = { guests: 2, rooms: 1 };
    let searchUrls = { booking: '', airbnb: '' };

    window.onload = () => { renderHeader(); loadW(); loadF(); flatpickr("#dateRange", { mode: "range", minDate: "today" }); };

    function openMaps() { document.getElementById('mapModal').style.display='flex'; }
    function closeMaps() { document.getElementById('mapModal').style.display='none'; }

    function switchMap(btn, type) {
        document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const frame = document.getElementById('map-iframe');
        if(type === 'slopes') frame.src = "https://raw.githubusercontent.com/ykrauss/Cervinia/main/slopesmap.pdf";
        else if(type === 'town') frame.src = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2777.6322!2d7.62!3d45.93!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4788cf609!2sBreuil-Cervinia!5e0!3m2!1she!2sil!4v1700000000";
        else if(type === 'mymap') frame.src = "https://raw.githubusercontent.com/ykrauss/Cervinia/main/mymap.jpg";
    }

    // הנתונים והפורום (השלד היצוק)
    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            document.getElementById('stat-temp').innerText = d.temp || '--';
            document.getElementById('stat-slopes').innerText = d.slopes || '--';
            document.getElementById('stat-lifts').innerText = d.lifts || '--';
            document.getElementById('stat-conn').innerText = d.conn === 'open' ? 'פתוח' : 'סגור';
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('w-body').innerHTML = d.forecast.filter(f => f.date >= today).slice(0,4).map(f => {
                const wind = parseFloat(String(f.wind).replace(/[^0-9.]/g, '')) || 0;
                let c = wind < 32 ? 'prob-High' : (wind > 50 ? 'prob-Low' : 'prob-Medium');
                return `<tr><td class="${c}">${wind < 32 ? 'גבוה' : (wind > 50 ? 'נמוך' : 'בינוני')}</td><td>${f.date}</td><td>${f.temp_min}/${f.temp_max}</td><td>${f.wind}</td><td>${f.visibility}</td></tr>`;
            }).join('');
        } catch(e) {}
    }

    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const isAdmin = user && user.name === 'ADMIN';
            let html = '';
            data.forEach(p => {
                const buildTree = (parentId = null) => {
                    return (p.replies || []).filter(r => r.parent_id === parentId).map(r => `
                        <div class="reply-item">
                            ${isAdmin ? `<button class="del-btn" onclick="deleteMsg('replies','${r.id}')">מחק</button>` : ''}
                            <span style="font-weight:800;">${r.user}</span>
                            <div style="margin:5px 0;">${r.content}</div>
                            <span style="color:#3498db; cursor:pointer; font-size:0.8rem; font-weight:bold;" onclick="openBox('${p.id}', '${r.user}', this, '${r.id}')">השב</span>
                            <div class="reply-target"></div>
                            ${buildTree(r.id)}
                        </div>`).join('');
                };
                html += `<div class="post">
                    ${isAdmin ? `<button class="del-btn" onclick="deleteMsg('posts','${p.id}')">מחק</button>` : ''}
                    <span style="font-weight:800;">${p.user}</span>
                    <div style="margin:10px 0; font-weight:bold;">${p.content}</div>
                    <span style="color:#3498db; cursor:pointer; font-size:0.8rem; font-weight:bold;" onclick="openBox('${p.id}', '${p.user}', this, null)">השב</span>
                    <div class="reply-target"></div>
                    ${buildTree(null)}
                </div>`;
            });
            document.getElementById('f-container').innerHTML = html || 'אין הודעות.';
        } catch(e) {}
    }

    function openBox(pId, toUser, el, parentId) {
        const target = el.nextElementSibling;
        if(target.innerHTML !== '') { target.innerHTML = ''; return; }
        target.innerHTML = `<div style="margin-top:10px;"><textarea id="temp-in-${pId}">@${toUser}: </textarea><button class="btn-send" onclick="sendReply('${pId}', ${parentId ? `'${parentId}'` : 'null'})">שלח</button></div>`;
    }

    async function sendPost() {
        const input = document.getElementById('f-input');
        if(!user || !input.value.trim()) return login();
        await fetch(`${API}/posts`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({user: user.name, content: input.value.trim()}) });
        location.reload();
    }

    async function sendReply(pId, pParentId) {
        const area = document.getElementById(`temp-in-${pId}`);
        if(!user || !area.value.trim()) return login();
        await fetch(`${API}/replies`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({post_id: pId, user: user.name, content: area.value.trim(), parent_id: pParentId}) });
        loadF();
    }

    async function deleteMsg(table, id) { if(confirm("למחוק?")) { await fetch(`${API}/${table}?id=eq.${id}`, { method: 'DELETE', headers: HEAD.headers }); loadF(); } }
    function openHotels() { document.getElementById('hotelModal').style.display='flex'; }
    function closeHotels() { document.getElementById('hotelModal').style.display='none'; }
    function updateCount(t, d) { counts[t] = Math.max(1, counts[t]+d); document.getElementById(`${t}-val`).innerText = counts[t]; }
    function generateSearchLinks() {
        const dates = document.getElementById('dateRange').value.split(" to ");
        if(dates.length < 2) return alert("בחר תאריכים");
        searchUrls.booking = `https://www.booking.com/searchresults.he.html?ss=Breuil-Cervinia&checkin=${dates[0]}&checkout=${dates[1]}&group_adults=${counts.guests}`;
        searchUrls.airbnb = `https://www.airbnb.co.il/s/Breuil-Cervinia/homes?checkin=${dates[0]}&checkout=${dates[1]}&adults=${counts.guests}`;
        document.getElementById('search-results').style.display = 'grid';
    }
    function goToLink(p) { window.open(searchUrls[p], '_blank'); }
    function resetSearch() { document.getElementById('search-results').style.display = 'none'; }
    function renderHeader() { /* ... */ }
    function login() { const n = prompt("שם:"); if(n) { user = {name:n}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); } }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

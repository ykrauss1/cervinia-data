<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - פורום מלא</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #e0e6ed; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        nav { background: var(--primary); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* פוסטים ותגובות */
        .post { border-bottom: 1px solid #eee; padding: 15px 0; position: relative; }
        .post-header { display: flex; justify-content: space-between; align-items: center; }
        .btn-action { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.85em; font-weight: bold; padding: 5px; }
        .btn-delete { color: var(--error); margin-right: 10px; }
        .replies-box { margin-right: 30px; border-right: 3px solid #f0f0f0; padding-right: 15px; margin-top: 10px; background: #fafafa; border-radius: 5px; }
        .reply-item { padding: 5px 0; border-bottom: 1px dashed #eee; font-size: 0.9em; }
        
        /* Auth Modal */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .auth-card { background: white; padding: 30px; border-radius: 15px; width: 350px; position: relative; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .eye-icon { position: absolute; left: 10px; top: 12px; cursor: pointer; opacity: 0.6; }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--accent); color: var(--primary); width: 100%; }
        .admin-badge { background: var(--error); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7em; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5em; font-weight:bold;">Cervinia<span>Live</span></div>
    <div id="nav-controls">
        <button class="btn" style="background:var(--accent); color:var(--primary);" onclick="openAuth('login')">התחברות / רישום</button>
    </div>
</nav>

<div id="auth-modal" onclick="if(event.target.id === 'auth-modal') closeAuth()">
    <div class="auth-card" onclick="event.stopPropagation()">
        <span style="position:absolute; top:10px; left:15px; cursor:pointer; font-size:1.5em;" onclick="closeAuth()">&times;</span>
        <div style="display:flex; margin-bottom: 20px; text-align:center;">
            <div id="tab-login" style="flex:1; cursor:pointer; padding:10px; border-bottom:2px solid var(--accent)" onclick="switchTab('login')">כניסה</div>
            <div id="tab-reg" style="flex:1; cursor:pointer; padding:10px; border-bottom:2px solid transparent" onclick="switchTab('reg')">הרשמה</div>
        </div>
        <div id="reg-fields" style="display:none;">
            <div class="input-group"><input type="text" id="reg-name" placeholder="שם מלא"></div>
        </div>
        <div class="input-group"><input type="email" id="auth-email" placeholder="אימייל"></div>
        <div class="input-group">
            <input type="password" id="auth-pass" placeholder="סיסמה">
            <span class="eye-icon" onclick="togglePass('auth-pass')">👁️</span>
        </div>
        <div id="confirm-fields" style="display:none;">
            <div class="input-group">
                <input type="password" id="auth-pass-confirm" placeholder="אימות סיסמה">
                <span class="eye-icon" onclick="togglePass('auth-pass-confirm')">👁️</span>
            </div>
        </div>
        <button class="btn btn-primary" onclick="processAuth()">בצע</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="posts-container">טוען הודעות...</div>
        <textarea id="forum-input" style="width:100%; height:80px; margin-top:15px; border-radius:10px; padding:12px; border:1px solid #ddd" placeholder="כתבו עדכון חדש..."></textarea>
        <button class="btn btn-primary" style="margin-top:10px;" onclick="addPost()">שלח הודעה</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    let currentMode = 'login';

    function openAuth(mode) { document.getElementById('auth-modal').style.display = 'flex'; switchTab(mode); }
    function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }
    function togglePass(id) { const input = document.getElementById(id); input.type = input.type === 'password' ? 'text' : 'password'; }
    
    function switchTab(mode) {
        currentMode = mode;
        document.getElementById('reg-fields').style.display = mode === 'reg' ? 'block' : 'none';
        document.getElementById('confirm-fields').style.display = mode === 'reg' ? 'block' : 'none';
        document.getElementById('tab-reg').style.borderBottomColor = mode === 'reg' ? 'var(--accent)' : 'transparent';
        document.getElementById('tab-login').style.borderBottomColor = mode === 'login' ? 'var(--accent)' : 'transparent';
    }

    async function processAuth() {
        const email = document.getElementById('auth-email').value;
        const name = document.getElementById('reg-name').value || email.split('@')[0];
        user = { name, email };
        localStorage.setItem('skiUser', JSON.stringify(user));
        location.reload();
    }

    function updateUI() {
        if(user) {
            const isAdmin = user.email === 'ykrauss1@gmail.com';
            document.getElementById('nav-controls').innerHTML = `
                <span>שלום, <b>${user.name}</b> ${isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}</span>
                <button onclick="localStorage.clear();location.reload()" style="background:none; border:none; color:white; cursor:pointer; text-decoration:underline; margin-right:10px">התנתק</button>
            `;
        }
    }

    async function fetchPosts() {
        const { data: posts, error } = await _supabase.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
        if (error) return;
        
        const isAdmin = user && user.email === 'ykrauss1@gmail.com';
        const container = document.getElementById('posts-container');
        
        container.innerHTML = posts.map(p => {
            const repliesHtml = (p.replies || []).map(r => `
                <div class="reply-item"><b>${r.user}:</b> ${r.content}</div>
            `).join('');

            return `
                <div class="post">
                    <div class="post-header">
                        <div><b>${p.user}:</b> ${p.content}</div>
                        <div>
                            <button class="btn-action" onclick="addReply('${p.id}')">תגובה</button>
                            ${isAdmin ? `<button class="btn-action btn-delete" onclick="deletePost('${p.id}')">מחיקה ✕</button>` : ''}
                        </div>
                    </div>
                    <div class="replies-box">${repliesHtml}</div>
                </div>
            `;
        }).join('');
    }

    async function addPost() {
        if(!user) return openAuth('login');
        const content = document.getElementById('forum-input').value;
        if(!content.trim()) return;
        await _supabase.from('posts').insert([{ user: user.name, content }]);
        document.getElementById('forum-input').value = "";
        fetchPosts();
    }

    async function addReply(postId) {
        if(!user) return openAuth('login');
        const content = prompt("כתוב תגובה:");
        if(!content) return;
        await _supabase.from('replies').insert([{ post_id: postId, user: user.name, content }]);
        fetchPosts();
    }

    async function deletePost(id) {
        if(!confirm("למחוק הודעה זו?")) return;
        await _supabase.from('posts').delete().eq('id', id);
        fetchPosts();
    }

    updateUI();
    fetchPosts();
</script>
</body>
</html>

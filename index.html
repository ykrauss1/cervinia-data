<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - Stable Fix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--primary); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { background: #eee; padding: 10px; border: 1px solid #ddd; }
        td { padding: 10px; border: 1px solid #eee; text-align: center; }
        .ltr { direction: ltr; display: inline-block; }

        /* Forum Nesting */
        .post { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .reply-item { margin-right: 40px; background: #f9f9f9; padding: 10px; border-right: 4px solid var(--accent); margin-top: 10px; border-radius: 5px; }

        /* Auth Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 350px; }
        .input-group { margin-bottom: 10px; position: relative; }
        .input-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        .eye { position: absolute; left: 10px; top: 12px; cursor: pointer; color: #666; }

        .btn { padding: 8px 18px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-blue { background: var(--accent); color: var(--primary); }
        .btn-dark { background: var(--primary); color: white; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:bold;">Cervinia<span>Live</span></div>
    <div id="auth-ui">
        <button class="btn btn-blue" onclick="showModal(true)">כניסה / הרשמה</button>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h3>תחזית וסטטוס</h3>
        <table>
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>טמפרטורה</th>
                    <th>רוח</th>
                    <th>ראות</th>
                    <th>סטטוס</th>
                </tr>
            </thead>
            <tbody id="forecast-body">
                <tr><td colspan="5">טוען נתונים...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="forum-area">טוען הודעות מהבסיס...</div>
        <div style="margin-top:20px;">
            <textarea id="main-input" style="width:100%; height:60px; padding:10px;" placeholder="כתוב פוסט חדש..."></textarea>
            <div style="display:flex; justify-content:flex-end; margin-top:5px;">
                <button class="btn btn-blue" onclick="addPost()">פרסם פוסט</button>
            </div>
        </div>
    </div>
</div>

<div id="auth-modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title">כניסה</h2>
        <div class="input-group">
            <input type="email" id="email" placeholder="אימייל">
        </div>
        <div id="reg-fields" style="display:none;">
            <div class="input-group">
                <input type="text" id="username" placeholder="שם משתמש">
            </div>
        </div>
        <div class="input-group">
            <input type="password" id="pass" placeholder="סיסמה">
            <i class="fa fa-eye eye" onclick="togglePass('pass')"></i>
        </div>
        <button class="btn btn-dark" onclick="doAuth()">אישור</button>
        <p id="toggle-text" style="cursor:pointer; color:blue; font-size:0.8rem; text-align:center;" onclick="toggleReg()">אין לך חשבון? הירשם</p>
        <button class="btn" style="width:100%; margin-top:5px;" onclick="showModal(false)">ביטול</button>
    </div>
</div>

<script>
    const SB_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SB_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _sb = supabase.createClient(SB_URL, SB_KEY);
    
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    let isReg = false;

    // --- אתחול ---
    window.onload = () => {
        updateAuthUI();
        loadWeather();
        loadForum();
    };

    // --- מזג אוויר ---
    async function loadWeather() {
        try {
            const r = await fetch('data.json?cache=' + Math.random());
            const d = await r.json();
            const body = document.getElementById('forecast-body');
            
            body.innerHTML = d.forecast.slice(0, 4).map(f => {
                // פורמט תאריך DD/MM/YYYY
                let dateStr = f.date;
                if(dateStr.includes('-')) {
                    const parts = dateStr.split('-');
                    dateStr = `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
                return `<tr>
                    <td><b>${dateStr}</b></td>
                    <td class="ltr" style="color:red; font-weight:bold;">${f.temp_min}/${f.temp_max}°C</td>
                    <td class="ltr">${f.wind}</td>
                    <td>${f.visibility || 'טובה'}</td>
                    <td style="color:green; font-weight:bold;">פתוח</td>
                </tr>`;
            }).join('');
        } catch(e) { 
            document.getElementById('forecast-body').innerHTML = '<tr><td colspan="5">שגיאה בטעינת הקובץ</td></tr>';
        }
    }

    // --- פורום ---
    async function loadForum() {
        try {
            const { data: posts, error } = await _sb.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
            if(error) throw error;

            const area = document.getElementById('forum-area');
            area.innerHTML = posts.map(p => {
                const reps = (p.replies || []).map(r => `
                    <div class="reply-item">
                        <b>${r.user}:</b> ${r.content}
                    </div>
                `).join('');

                return `<div class="post">
                    <b style="color:var(--primary)">${p.user}:</b> ${p.content}
                    <div style="margin-top:5px; font-size:0.8rem; color:blue; cursor:pointer;" onclick="replyTo('${p.id}')">השב</div>
                    <div id="reply-box-${p.id}"></div>
                    <div class="replies">${reps}</div>
                </div>`;
            }).join('');
        } catch(e) {
            document.getElementById('forum-area').innerHTML = 'שגיאה בחיבור לפורום.';
        }
    }

    // --- כניסה והרשמה ---
    function showModal(s) { document.getElementById('auth-modal').style.display = s ? 'flex' : 'none'; }
    function toggleReg() {
        isReg = !isReg;
        document.getElementById('reg-fields').style.display = isReg ? 'block' : 'none';
        document.getElementById('modal-title').innerText = isReg ? 'הרשמה' : 'כניסה';
        document.getElementById('toggle-text').innerText = isReg ? 'כבר יש לך חשבון? היכנס' : 'אין לך חשבון? הירשם';
    }
    function togglePass(id) {
        const x = document.getElementById(id);
        x.type = x.type === 'password' ? 'text' : 'password';
    }

    function doAuth() {
        const email = document.getElementById('email').value;
        const name = isReg ? document.getElementById('username').value : email.split('@')[0];
        if(email) {
            user = { email, name };
            localStorage.setItem('skiUser', JSON.stringify(user));
            location.reload();
        }
    }

    function updateAuthUI() {
        if(user) {
            document.getElementById('auth-ui').innerHTML = `
                <span>שלום, ${user.name}</span>
                <button class="btn" style="background:#ddd; margin-right:10px;" onclick="localStorage.clear();location.reload();">התנתק</button>
            `;
        }
    }

    async function addPost() {
        if(!user) return showModal(true);
        const val = document.getElementById('main-input').value;
        if(val.trim()) {
            await _sb.from('posts').insert([{ user: user.name, content: val }]);
            document.getElementById('main-input').value = "";
            loadForum();
        }
    }

    function replyTo(id) {
        if(!user) return showModal(true);
        const target = document.getElementById('reply-box-' + id);
        target.innerHTML = `
            <div style="margin-top:10px;">
                <textarea id="input-${id}" style="width:100%; padding:5px;"></textarea>
                <button class="btn btn-blue" onclick="sendReply('${id}')">שלח</button>
            </div>`;
    }

    async function sendReply(pId) {
        const val = document.getElementById('input-' + pId).value;
        if(val.trim()) {
            await _sb.from('replies').insert([{ post_id: pId, user: user.name, content: val }]);
            loadForum();
        }
    }
</script>
</body>
</html>

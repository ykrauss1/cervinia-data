<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Final Fixed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }

        /* פורום ושרשור */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 20px; background: white; }
        .replies-container { margin-top: 15px; border-right: 2px solid #eee; padding-right: 10px; }
        
        .reply-item { 
            margin-top: 8px; 
            padding: 10px 15px; 
            background: #f8fbff; 
            border-radius: 8px; 
            border: 1px solid #edf2f7;
            position: relative;
        }

        /* כאן קורה הקסם של ההזחה - כל תגובה לתגובה נכנסת פנימה */
        .reply-item[data-depth="1"] { margin-right: 35px; border-right: 4px solid var(--accent); background: #f0f9ff; }
        
        .user-tag { font-weight: 800; color: var(--dark); }
        .time-tag { font-size: 0.75rem; color: #999; margin-right: 10px; }
        .action-link { color: #3498db; cursor: pointer; font-size: 0.85rem; font-weight: bold; margin-top: 5px; display: inline-block; }
        
        .del-btn { color: var(--error); cursor: pointer; background: #fff1f0; border: 1px solid var(--error); border-radius: 4px; float: left; padding: 2px 6px; font-size: 0.75rem; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 350px; }
        .btn-row { display: flex; flex-direction: row-reverse; gap: 10px; margin-top: 10px; }
        .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-send { background: var(--accent); color: var(--dark); }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa fa-link"></i><br><small>קישור</small><br><b>פתוח</b></div>
        <div class="stat-card"><i class="fa fa-mountain"></i><br><small>מסלולים</small><br><b>58/72</b></div>
        <div class="stat-card"><i class="fa fa-wind"></i><br><small>רוח</small><br><b>12 קמ"ש</b></div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים הקרובים</h3>
        <table>
            <thead><tr><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th><th>סטטוס</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען...</div>
        <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
        <textarea id="f-input" style="width:100%; height:70px; padding:10px; border-radius:8px; border:1px solid #ddd;" placeholder="כתוב פוסט חדש..."></textarea>
        <div class="btn-row"><button class="btn btn-send" onclick="sendPost()">פרסם פוסט</button></div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }};

    let user = JSON.parse(localStorage.getItem('skiUser')) || { name: "אורח", email: "guest" };

    window.onload = () => { renderHeader(); loadW(); loadF(); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        const isAdmin = user.email === 'ykrauss1@gmail.com';
        area.innerHTML = `${isAdmin ? '<span style="background:red; color:white; padding:2px 5px; border-radius:4px; font-size:12px; margin-left:10px;">ADMIN</span>' : ''} שלום, <b>${user.name}</b>`;
    }

    // --- תיקון תחזית: תמיד 4 ימים מהיום ---
    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            const today = new Date();
            today.setHours(0,0,0,0);

            const future = d.forecast
                .filter(f => new Date(f.date) >= today)
                .sort((a,b) => new Date(a.date) - new Date(b.date))
                .slice(0, 4); // מוודא משיכה של בדיוק 4 ימים

            document.getElementById('w-body').innerHTML = future.map(f => `
                <tr>
                    <td><b>${f.date.split('-').reverse().join('/')}</b></td>
                    <td style="color:red; direction:ltr">${f.temp_min.replace(/[^\d.-]/g,'')}°/${f.temp_max.replace(/[^\d.-]/g,'')}°C</td>
                    <td>${f.wind.replace(/[^\d.]/g,'')} קמ"ש</td>
                    <td>${f.visibility}</td>
                    <td style="color:green; font-weight:bold">פתוח</td>
                </tr>`).join('');
        } catch(e) {}
    }

    // --- תיקון פורום: שרשור אמיתי ומחיקה ---
    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const isAdmin = user && user.email === 'ykrauss1@gmail.com';

            document.getElementById('f-container').innerHTML = data.map(p => {
                const sortedReplies = (p.replies || []).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
                
                // לוגיקה לבניית העץ:
                let repliesHtml = "";
                sortedReplies.forEach(r => {
                    const isNested = r.content.includes('@'); // זיהוי תגובה לתגובה
                    repliesHtml += `
                        <div class="reply-item" data-depth="${isNested ? '1' : '0'}">
                            ${isAdmin ? `<button class="del-btn" onclick="delMsg('replies','${r.id}')"><i class="fa fa-trash"></i></button>` : ''}
                            <span class="user-tag">${r.user}</span> 
                            <span class="time-tag">${new Date(r.created_at).toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit'})}</span>
                            <div style="margin:5px 0;">${r.content}</div>
                            <span class="action-link" onclick="openBox('${p.id}', '${r.user}', this)">השב</span>
                            <div class="reply-target"></div>
                        </div>`;
                });

                return `
                <div class="post">
                    ${isAdmin ? `<button class="del-btn" onclick="delMsg('posts','${p.id}')"><i class="fa fa-trash"></i> מחק פוסט</button>` : ''}
                    <span class="user-tag">${p.user}</span> 
                    <span class="time-tag">${new Date(p.created_at).toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit'})}</span>
                    <div style="margin:10px 0; font-size:1.1rem;">${p.content}</div>
                    <span class="action-link" onclick="openBox('${p.id}', '${p.user}', this)">השב</span>
                    <div class="reply-target"></div>
                    <div class="replies-container">${repliesHtml}</div>
                </div>`;
            }).join('');
        } catch(e) {}
    }

    function openBox(pId, toUser, el) {
        const target = el.nextElementSibling;
        if(target.innerHTML !== '') { target.innerHTML = ''; return; }
        document.querySelectorAll('.reply-target').forEach(d => d.innerHTML = '');
        target.innerHTML = `
            <div style="background:#f0f0f0; padding:10px; border-radius:8px; margin-top:10px;">
                <textarea id="in-${pId}" style="width:100%; height:50px; padding:5px;">@${toUser}: </textarea>
                <div class="btn-row"><button class="btn btn-send" onclick="sendReply('${pId}')">שלח</button></div>
            </div>`;
    }

    async function sendPost() {
        const t = document.getElementById('f-input').value;
        if(!t.trim()) return;
        await fetch(`${API}/posts`, { method:'POST', ...HEAD, body: JSON.stringify({user: user.name, content: t}) });
        document.getElementById('f-input').value = "";
        loadF();
    }

    async function sendReply(pId) {
        const t = document.querySelector(`#in-${pId}`).value;
        if(!t.trim()) return;
        await fetch(`${API}/replies`, { method:'POST', ...HEAD, body: JSON.stringify({post_id: pId, user: user.name, content: t}) });
        loadF();
    }

    // מחיקה - עכשיו כשפתחת את ה-Policy, זה יעבוד
    async function delMsg(table, id) {
        if(!confirm("למחוק?")) return;
        try {
            const res = await fetch(`${API}/${table}?id=eq.${id}`, {
                method: 'DELETE',
                headers: HEAD.headers
            });
            if(res.ok) loadF();
            else alert("שגיאה במחיקה - בדוק את ה-Policy");
        } catch(e) { alert("תקלה בתקשורת"); }
    }
</script>
</body>
</html>

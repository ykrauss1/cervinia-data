<script>
    // ... (כל שאר הפונקציות API, KEY, HEAD נשארות אותו דבר)

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            const isAdmin = user.email === 'ykrauss1@gmail.com';
            area.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    ${isAdmin ? '<span style="background: #e74c3c; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold;">ADMIN</span>' : ''}
                    <span>שלום, <b>${user.name}</b></span>
                    <button onclick="logout()" style="background:none; border:none; color:white; cursor:pointer; text-decoration:underline; font-size:0.8rem;">התנתק</button>
                </div>`;
        } else {
            area.innerHTML = `<button class="btn-send" onclick="login()">כניסה</button>`;
        }
    }

    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const currentUserIsAdmin = user && user.email === 'ykrauss1@gmail.com';

            let html = '';
            data.forEach(p => {
                // בדיקה אם כותב הפוסט הוא אדמין
                const postAuthorIsAdmin = p.user_email === 'ykrauss1@gmail.com' || p.user === 'ADMIN'; 
                
                const replies = p.replies || [];
                replies.sort((a,b) => new Date(a.created_at) - new Date(b.created_at));

                function buildTree(parentId = null, depth = 0) {
                    return replies
                        .filter(r => r.parent_id === parentId)
                        .map(r => {
                            const replyAuthorIsAdmin = r.user_email === 'ykrauss1@gmail.com' || r.user === 'ADMIN';
                            return `
                            <div class="reply-item ${depth > 0 ? 'depth-' + depth : ''}">
                                ${currentUserIsAdmin ? `<button class="del-btn" onclick="delMsg('replies','${r.id}')"><i class="fa fa-trash"></i></button>` : ''}
                                <div style="display:flex; align-items:center; gap:5px;">
                                    ${replyAuthorIsAdmin ? '<span style="color:#e74c3c; font-weight:bold; font-size:0.75rem;">[ADMIN]</span>' : ''}
                                    <span class="user-tag">${r.user}</span>
                                    <span class="time-tag">${new Date(r.created_at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</span>
                                </div>
                                <div style="margin-top:5px;">${r.content}</div>
                                <span class="action-link" onclick="openBox('${p.id}', '${r.user}', this, '${r.id}')">השב</span>
                                <div class="reply-target"></div>
                                ${buildTree(r.id, depth + 1).join('')}
                            </div>
                        `;});
                }

                html += `
                    <div class="post">
                        ${currentUserIsAdmin ? `<button class="del-btn" onclick="delMsg('posts','${p.id}')">מחק פוסט</button>` : ''}
                        <div style="display:flex; align-items:center; gap:5px;">
                            ${postAuthorIsAdmin ? '<span style="color:#e74c3c; font-weight:bold; font-size:0.8rem;">[ADMIN]</span>' : ''}
                            <span class="user-tag">${p.user}</span>
                            <span class="time-tag">${new Date(p.created_at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</span>
                        </div>
                        <div style="margin:10px 0; font-weight:bold; font-size:1.1rem;">${p.content}</div>
                        <span class="action-link" onclick="openBox('${p.id}', '${p.user}', this, null)">השב</span>
                        <div class="reply-target"></div>
                        <div class="replies-list">${buildTree(null, 0).join('')}</div>
                    </div>`;
            });
            document.getElementById('f-container').innerHTML = html;
        } catch(e) {}
    }
    // ... (שאר הקוד של sendPost, sendReply וכו')
</script>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - הכל במקום אחד</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; --warning: #f1c40f; --booking: #003580; --airbnb: #ff5a5f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        
        /* Admin & Stats */
        .admin-box { background: #fff3cd; border: 2px solid #ffeeba; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: none; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        
        /* Services Grid */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .service-btn { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .service-btn:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .service-btn i { font-size: 1.8rem; color: var(--accent); margin-bottom: 10px; }

        /* Forecast Card */
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }

        /* Forum & Replies */
        .post { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 15px; background: white; }
        .reply { margin-right: 30px; margin-top: 10px; padding: 10px; background: #f0f7ff; border-right: 3px solid var(--accent); border-radius: 8px; font-size: 0.9rem; }
        .reply-btn { color: var(--accent); cursor: pointer; font-size: 0.8rem; font-weight: bold; margin-top: 10px; display: inline-block; }
        .del-btn { color: var(--error); cursor: pointer; float: left; font-size: 0.8rem; border: 1px solid; padding: 2px 5px; border-radius: 4px; }
        
        /* Modal Hospitality */
        .modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: white; width: 90%; max-width: 500px; padding: 30px; border-radius: 20px; position: relative; }
        .booking-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin-top: 10px; box-sizing: border-box; }
        .providers { display: none; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .provider-card { border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; color: white; transition: 0.3s; }
        .p-booking { background: var(--booking); }
        .p-airbnb { background: var(--airbnb); }

        .btn-send { background: var(--accent); color: var(--dark); padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div id="admin-dashboard" class="admin-box">
        <h3><i class="fa fa-user-shield"></i> מרכז שליטה אדמין</h3>
        <button class="btn-send" style="width:auto; background:var(--dark); color:white;" onclick="updateSiteStatusManual()">עדכן מצב אתר</button>
        <span id="visit-count" style="margin-right:20px; font-weight:bold"></span>
    </div>

    <div class="stats">
        <div class="stat-card"><i class="fa fa-thermometer-half"></i><br><small>טמפ' (P. Rosa)</small><br><b id="stat-temp">--</b></div>
        <div class="stat-card"><i class="fa fa-mountain"></i><br><small>מסלולים</small><br><b id="stat-slopes">--</b></div>
        <div class="stat-card"><i class="fa fa-wind"></i><br><small>מעליות</small><br><b id="stat-lifts">--</b></div>
        <div class="stat-card"><i class="fa fa-exchange-alt"></i><br><small>צ'רמט</small><br><b id="stat-conn">--</b></div>
    </div>

    <div class="services-grid">
        <div class="service-btn" onclick="openHotels()"><i class="fa fa-hotel"></i><br><b>אירוח</b></div>
        <div class="service-btn"><i class="fa fa-skiing"></i><br><b>סקי וציוד</b></div>
        <div class="service-btn"><i class="fa fa-utensils"></i><br><b>מסעדות</b></div>
        <div class="service-btn"><i class="fa fa-map-marked-alt"></i><br><b>מפות</b></div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים (Plateau Rosà)</h3>
        <table>
            <thead><tr><th>קישור</th><th>תאריך</th><th>טמפ'</th><th>רוח</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container"></div>
        <div style="margin-top:20px;">
            <textarea id="f-input" rows="3" placeholder="כתוב פוסט חדש..." style="width:100%; border-radius:10px; padding:10px; border:1px solid #ddd;"></textarea>
            <button class="btn-send" onclick="sendPost()" style="margin-top:10px">פרסם</button>
        </div>
    </div>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content">
        <button onclick="closeHotels()" style="position:absolute; top:10px; left:10px; border:none; background:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        <h3 style="margin-top:0">חיפוש אירוח בצרביניה</h3>
        <input type="text" id="dateRange" class="booking-input" placeholder="בחר תאריכים...">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
            <select id="guests" class="booking-input"><option value="2">2 אורחים</option><option value="1">1</option><option value="3">3</option><option value="4">4</option></select>
            <select id="rooms" class="booking-input"><option value="1">1 חדר</option><option value="2">2</option></select>
        </div>
        <button class="btn-send" style="margin-top:20px" onclick="showProviders()">חפש זמינות</button>
        <div id="provider-area" class="providers">
            <div class="provider-card p-booking" onclick="goToProvider('booking')"><b>Booking.com</b></div>
            <div class="provider-card p-airbnb" onclick="goToProvider('airbnb')"><b>Airbnb</b></div>
        </div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    const ADMIN_NAME = 'ADMIN';

    flatpickr("#dateRange", { mode: "range", dateFormat: "Y-m-d", minDate: "today" });

    window.onload = () => { renderHeader(); loadLiveWeather(); loadSiteStatus(); loadF(); logVisit(); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            area.innerHTML = `<span>${user.name === ADMIN_NAME ? '🔴 ' : ''}<b>${user.name}</b> | <a href="#" onclick="logout()" style="color:white">התנתק</a></span>`;
            if(user.name === ADMIN_NAME) {
                document.getElementById('admin-dashboard').style.display='block';
                loadAdminStats();
            }
        } else {
            area.innerHTML = `<button class="btn-send" style="width:auto; padding:5px 15px" onclick="login()">כניסה</button>`;
        }
    }

    async function logVisit() { fetch(`${API}/visits`, { method:'POST', headers:HEAD.headers, body:JSON.stringify({page:'home'}) }); }
    async function loadAdminStats() {
        const res = await fetch(`${API}/visits?select=count`, { headers: {...HEAD.headers, 'Prefer': 'count=exact'} });
        const count = res.headers.get('content-range').split('/')[1];
        document.getElementById('visit-count').innerText = count + " כניסות";
    }

    async function loadLiveWeather() {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.93&longitude=7.71&current=temperature_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max&timezone=Europe%2FRome');
        const d = await res.json();
        document.getElementById('stat-temp').innerText = d.current.temperature_2m + '°C';
        let h = '';
        for(let i=0; i<4; i++){
            const w = d.daily.wind_speed_10m_max[i];
            const s = w > 50 ? 'סגור' : (w > 35 ? 'מוגבל' : 'פתוח');
            h += `<tr><td style="font-weight:bold; color:${w>50?'red':'green'}">${s}</td><td>${d.daily.time[i]}</td><td>${d.daily.temperature_2m_min[i]}/${d.daily.temperature_2m_max[i]}</td><td>${w} קמ"ש</td></tr>`;
        }
        document.getElementById('w-body').innerHTML = h;
    }

    async function loadSiteStatus() {
        const res = await fetch(`${API}/site_status?select=*&id=eq.1`, HEAD);
        const [data] = await res.json();
        if(data) {
            document.getElementById('stat-slopes').innerText = data.slopes;
            document.getElementById('stat-lifts').innerText = data.lifts;
            const c = document.getElementById('stat-conn');
            c.innerText = data.zermatt_link === 'open' ? 'פתוח' : 'סגור';
            c.style.color = data.zermatt_link === 'open' ? 'var(--success)' : 'var(--error)';
        }
    }

    async function updateSiteStatusManual() {
        const s = prompt("מסלולים:", document.getElementById('stat-slopes').innerText);
        const l = prompt("מעליות:", document.getElementById('stat-lifts').innerText);
        const z = confirm("צ'רמט פתוח?") ? 'open' : 'closed';
        if(s && l) {
            await fetch(`${API}/site_status?id=eq.1`, { method:'PATCH', headers:HEAD.headers, body:JSON.stringify({slopes:s, lifts:l, zermatt_link:z}) });
            location.reload();
        }
    }

    async function loadF() {
        const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
        const data = await res.json();
        const isAdmin = user && user.name === ADMIN_NAME;
        document.getElementById('f-container').innerHTML = data.map(p => `
            <div class="post">
                ${isAdmin ? `<span class="del-btn" onclick="deleteMsg('posts','${p.id}')">מחק פוסט</span>` : ''}
                <b>${p.user}</b>: ${p.content}
                <div id="replies-${p.id}">${(p.replies || []).map(r => `
                    <div class="reply">
                        ${isAdmin ? `<span class="del-btn" onclick="deleteMsg('replies','${r.id}')">מחק</span>` : ''}
                        <b>${r.user}</b>: ${r.content}
                    </div>`).join('')}
                </div>
                <span class="reply-btn" onclick="openReplyBox('${p.id}')">השב</span>
                <div id="box-${p.id}" style="display:none; margin-top:10px;">
                    <input type="text" id="in-${p.id}" placeholder="כתוב תגובה..." style="width:70%; padding:5px;">
                    <button onclick="sendReply('${p.id}')">שלח</button>
                </div>
            </div>
        `).join('') || 'אין הודעות';
    }

    async function sendPost() {
        const i = document.getElementById('f-input');
        if(!user || !i.value) return login();
        await fetch(`${API}/posts`, { method:'POST', headers:HEAD.headers, body:JSON.stringify({user:user.name, content:i.value}) });
        i.value=''; loadF();
    }

    function openReplyBox(id) { document.getElementById(`box-${id}`).style.display='block'; }
    async function sendReply(pId) {
        const i = document.getElementById(`in-${pId}`);
        if(!user || !i.value) return login();
        await fetch(`${API}/replies`, { method:'POST', headers:HEAD.headers, body:JSON.stringify({post_id:pId, user:user.name, content:i.value}) });
        loadF();
    }

    async function deleteMsg(table, id) { if(confirm("למחוק?")) { await fetch(`${API}/${table}?id=eq.${id}`, { method:'DELETE', headers:HEAD.headers }); loadF(); } }

    function openHotels() { document.getElementById('hotelModal').style.display='flex'; }
    function closeHotels() { document.getElementById('hotelModal').style.display='none'; }
    function showProviders() { document.getElementById('provider-area').style.display='grid'; }
    function goToProvider(type) {
        const d = document.getElementById('dateRange').value.split(' to ');
        if(d.length<2) return alert("בחר תאריכים");
        const url = type === 'booking' ? 
            `https://www.booking.com/searchresults.he.html?ss=Breuil-Cervinia&checkin=${d[0]}&checkout=${d[1]}` : 
            `https://www.airbnb.co.il/s/Breuil~Cervinia--Italy/homes?checkin=${d[0]}&checkout=${d[1]}`;
        window.open(url, '_blank');
    }

    function login() { const n = prompt("שם:"); if(n) { localStorage.setItem('skiUser', JSON.stringify({name:n})); location.reload(); } }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

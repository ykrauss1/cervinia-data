<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; --warning: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .service-btn { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; color: var(--dark); font-weight: bold; transition: 0.3s; }
        .service-btn:hover { background: var(--accent); transform: translateY(-3px); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        .prob-High { color: var(--success); font-weight: bold; }
        
        /* Forum */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; }
        .reply-item { margin-top: 10px; padding: 10px; background: #f8fbff; border-right: 4px solid #cbd5e0; border-radius: 6px; }
        .btn-send { background: var(--accent); color: var(--dark); padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; margin-top: 10px; font-family: inherit; }
        .img-preview { max-width: 250px; border-radius: 8px; margin-top: 10px; display: block; }
        .del-btn { color: var(--error); cursor: pointer; float: left; border: 1px solid var(--error); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; background: white; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 95%; max-width: 450px; padding: 25px; border-radius: 20px; }
        .counter-box { display: flex; align-items: center; justify-content: space-between; background: #f1f3f5; padding: 10px; border-radius: 10px; margin: 10px 0; }
        .counter-btn { width: 30px; height: 30px; border-radius: 50%; border: none; background: white; cursor: pointer; font-weight: bold; }
        .provider-card { border: 2px solid #eee; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
        .provider-card:hover { border-color: var(--accent); background: #f0faff; }
        .provider-card img { height: 25px; margin-bottom: 8px; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa fa-thermometer-half"></i><br><small>טמפ' כעת</small><br><b id="stat-temp">--</b></div>
        <div class="stat-card"><i class="fa fa-mountain"></i><br><small>מסלולים</small><br><b id="stat-slopes">--</b></div>
        <div class="stat-card"><i class="fa fa-wind"></i><br><small>מעליות</small><br><b id="stat-lifts">--</b></div>
        <div class="stat-card"><i class="fa fa-check-circle"></i><br><small>מצב האתר</small><br><b id="stat-conn">--</b></div>
    </div>

    <div class="services-grid">
        <div class="service-btn" onclick="openHotels()"><i class="fa fa-hotel"></i> אירוח</div>
        <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-schools', '_blank')"><i class="fa fa-person-skiing"></i> הדרכת סקי</div>
        <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-rental', '_blank')"><i class="fa fa-ski"></i> השכרת ציוד</div>
        <div class="service-btn" onclick="openMaps()"><i class="fa fa-map-marked-alt"></i> מפות האתר</div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים הקרובים</h3>
        <table>
            <thead><tr><th>צפי</th><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
            <tbody id="w-body"><tr><td colspan="5">טוען נתונים...</td></tr></tbody>
        </table>
        <div id="update-time" style="font-size: 0.8rem; color: #888; margin-top: 10px;"></div>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px;">
            <textarea id="f-input" placeholder="מה קורה בצרביניה כרגע?"></textarea>
            <div style="display:flex; justify-content:flex-start; align-items:center; margin-top:10px; gap:15px;">
                <button class="btn-send" onclick="sendPost()">פרסם פוסט</button>
                <label style="cursor:pointer; font-size:1.2rem;"><i class="fa fa-paperclip"></i><input type="file" id="f-file" hidden onchange="alert('קובץ נבחר')"></label>
            </div>
        </div>
    </div>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0">חיפוש אירוח חכם</h3>
            <button onclick="closeHotels()" style="border:none; background:none; font-size:1.5rem; cursor:pointer;">×</button>
        </div>
        <div id="search-form">
            <input type="text" id="dateRange" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; margin-bottom:10px;" placeholder="בחר תאריכי שהייה...">
            <div class="counter-box"><span>אורחים</span><div><button class="counter-btn" onclick="updateCount('guests',-1)">-</button> <b id="guests-val">2</b> <button class="counter-btn" onclick="updateCount('guests',1)">+</button></div></div>
            <div class="counter-box"><span>חדרים</span><div><button class="counter-btn" onclick="updateCount('rooms',-1)">-</button> <b id="rooms-val">1</b> <button class="counter-btn" onclick="updateCount('rooms',1)">+</button></div></div>
            <button class="btn-send" style="width:100%; padding:15px; margin-top:10px;" onclick="generateSearchLinks()">חפש</button>
        </div>
        <div id="search-results" style="display:none; grid-template-columns: 1fr 1fr; gap:15px; margin-top:10px;">
            <div class="provider-card" onclick="goToLink('booking')"><img src="https://upload.wikimedia.org/wikipedia/commons/b/be/Booking.com_logo.svg"><br>Booking</div>
            <div class="provider-card" onclick="goToLink('airbnb')"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/69/Airbnb_Logo_Belo.svg/256px-Airbnb_Logo_Belo.svg.png"><br>Airbnb</div>
            <button class="btn-send" style="grid-column: span 2; background:#eee; color:#333;" onclick="resetSearch()">חיפוש חדש</button>
        </div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    let counts = { guests: 2, rooms: 1 };
    let urls = { booking: '', airbnb: '' };

    window.onload = () => { 
        renderHeader(); 
        loadW(); 
        loadF();
        try { flatpickr("#dateRange", { mode: "range", minDate: "today" }); } catch(e) {}
    };

    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            document.getElementById('stat-temp').innerText = d.temp || '--';
            document.getElementById('stat-slopes').innerText = d.slopes || '--';
            document.getElementById('stat-lifts').innerText = d.lifts || '--';
            document.getElementById('stat-conn').innerText = d.conn === 'open' ? 'פתוח' : 'סגור';
            const today = new Date().toISOString().split('T')[0];
            const filtered = d.forecast.filter(f => f.date >= today).slice(0,4);
            document.getElementById('w-body').innerHTML = filtered.map(f => `<tr><td class="prob-High">גבוה</td><td>${f.date}</td><td>${f.temp_min}/${f.temp_max}</td><td>${f.wind}</td><td>${f.visibility}</td></tr>`).join('');
        } catch(e) { document.getElementById('w-body').innerHTML = '<tr><td colspan="5">שגיאה בטעינת נתונים</td></tr>'; }
    }

    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const isAdmin = user && user.name === 'ADMIN';
            document.getElementById('f-container').innerHTML = data.map(p => `
                <div class="post">
                    ${isAdmin ? `<button class="del-btn" onclick="deleteMsg('posts','${p.id}')">מחק</button>` : ''}
                    <b>${p.user}</b>: ${p.content}
                    ${(p.replies || []).map(r => `<div class="reply-item"><b>${r.user}:</b> ${r.content}</div>`).join('')}
                </div>`).join('') || 'אין הודעות.';
        } catch(e) { document.getElementById('f-container').innerText = 'שגיאה בטעינת הפורום.'; }
    }

    function generateSearchLinks() {
        const d = document.getElementById('dateRange').value.split(" to ");
        if(d.length < 2) return alert("בחר תאריכים");
        urls.booking = `https://www.booking.com/searchresults.he.html?ss=Breuil-Cervinia&checkin=${d[0]}&checkout=${d[1]}&group_adults=${counts.guests}`;
        urls.airbnb = `https://www.airbnb.co.il/s/Breuil-Cervinia--Italy/homes?checkin=${d[0]}&checkout=${d[1]}&adults=${counts.guests}`;
        document.getElementById('search-form').style.display = 'none';
        document.getElementById('search-results').style.display = 'grid';
    }

    function updateCount(t, delta) { counts[t] = Math.max(1, counts[t]+delta); document.getElementById(`${t}-val`).innerText = counts[t]; }
    function goToLink(p) { window.open(urls[p], '_blank'); }
    function resetSearch() { document.getElementById('search-form').style.display = 'block'; document.getElementById('search-results').style.display = 'none'; }
    function openHotels() { document.getElementById('hotelModal').style.display='flex'; }
    function closeHotels() { document.getElementById('hotelModal').style.display='none'; }
    function renderHeader() { /* לוגיקת התחברות בסיסית */ }
    function login() { const n = prompt("שם:"); if(n) { user={name:n}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); }}
</script>
</body>
</html>

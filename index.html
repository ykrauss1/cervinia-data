<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - הבית של גולשי צ'רוויניה</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #e0e6ed; --white: #ffffff; --error: #e74c3c; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }

        nav { background: var(--primary); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-text { font-size: 1.8em; font-weight: 900; color: white; text-decoration: none; }
        .logo-text span { color: var(--accent); }
        
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }

        /* Auth Modal */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .auth-card { background: white; padding: 30px; border-radius: 15px; width: 350px; position: relative; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .eye-icon { position: absolute; left: 10px; top: 12px; cursor: pointer; opacity: 0.6; }
        .tab-btn { padding: 10px; cursor: pointer; border-bottom: 2px solid transparent; flex: 1; text-align: center; }
        .tab-btn.active { border-bottom-color: var(--accent); font-weight: bold; }

        /* Forecast */
        .forecast-table { width: 100%; border-collapse: collapse; }
        .forecast-table td, .forecast-table th { padding: 12px; border-bottom: 1px solid #eee; text-align: center; }
        .status-open { color: #2ecc71; font-weight: bold; }
        .status-closed { color: var(--error); font-weight: bold; }

        /* Webcams */
        .webcams { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .cam-box { background: #000; border-radius: 10px; overflow: hidden; border: 2px solid white; position: relative; }
        .cam-box img { width: 100%; display: block; height: 180px; object-fit: cover; }

        /* Forum */
        .post { border-bottom: 1px solid #eee; padding: 20px 0; }
        .post-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .replies-container { margin-right: 25px; border-right: 3px solid #f0f0f0; padding-right: 15px; margin-top: 10px; }
        .reply-item { background: #f8f9fa; padding: 8px; border-radius: 5px; margin-top: 5px; font-size: 0.9em; }
        .reply-input-box { display: none; margin-top: 10px; }
        
        .btn { padding: 8px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--accent); color: var(--primary); }
        .btn-delete { color: var(--error); background: none; font-size: 0.8em; }
        .admin-badge { background: var(--error); color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7em; margin-right: 5px; }
    </style>
</head>
<body>

<nav>
    <div class="logo-text">Cervinia<span>Live</span></div>
    <div id="nav-controls">
        <button class="btn btn-primary" onclick="openAuth('login')">התחברות / רישום</button>
    </div>
</nav>

<div id="auth-modal" onclick="if(event.target.id === 'auth-modal') closeAuth()">
    <div class="auth-card" onclick="event.stopPropagation()">
        <span style="position:absolute; top:10px; left:15px; cursor:pointer; font-size:1.5em;" onclick="closeAuth()">&times;</span>
        <div style="display:flex; margin-bottom: 20px;">
            <div id="tab-login" class="tab-btn active" onclick="switchTab('login')">כניסה</div>
            <div id="tab-reg" class="tab-btn" onclick="switchTab('reg')">הרשמה</div>
        </div>
        <div id="reg-fields" style="display:none;">
            <div class="input-group"><input type="text" id="reg-name" placeholder="שם מלא"></div>
        </div>
        <div class="input-group"><input type="email" id="auth-email" placeholder="אימייל"></div>
        <div class="input-group">
            <input type="password" id="auth-pass" placeholder="סיסמה">
            <span class="eye-icon" onclick="togglePass('auth-pass')">👁️</span>
        </div>
        <div id="confirm-fields" style="display:none;">
            <div class="input-group">
                <input type="password" id="auth-pass-confirm" placeholder="אימות סיסמה">
                <span class="eye-icon" onclick="togglePass('auth-pass-confirm')">👁️</span>
            </div>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="processAuth()">בצע</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <h3 style="margin-top:0">צפי סטטוס קישור לשוויץ (4 ימים קדימה)</h3>
        <table class="forecast-table">
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>טמפ'</th>
                    <th>רוח (קמ"ש)</th>
                    <th>צפי קישור</th>
                </tr>
            </thead>
            <tbody id="forecast-body"></tbody>
        </table>
    </div>

    <div class="webcams">
        <div class="cam-box"><img src="https://webcam.cervinia.it/webcam/cervinia/cervinia-1.jpg"><div style="text-align:center;color:white;padding:5px">Town</div></div>
        <div class="cam-box"><img src="https://webcam.cervinia.it/webcam/cervinia/plan-maison-1.jpg"><div style="text-align:center;color:white;padding:5px">Plan Maison</div></div>
        <div class="cam-box"><img src="https://webcam.cervinia.it/webcam/cervinia/plateau-rosa-1.jpg"><div style="text-align:center;color:white;padding:5px">Plateau Rosa</div></div>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="posts-container">טוען הודעות...</div>
        <textarea id="forum-input" style="width:100%; height:80px; margin-top:15px; border-radius:10px; padding:12px; border:1px solid #ddd" placeholder="כתבו עדכון..."></textarea>
        <button class="btn btn-primary" style="margin-top:10px; width:100%" onclick="addPost()">שלח הודעה</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    // Auth
    function openAuth(mode) { document.getElementById('auth-modal').style.display = 'flex'; switchTab(mode); }
    function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }
    function togglePass(id) { const input = document.getElementById(id); input.type = input.type === 'password' ? 'text' : 'password'; }
    function switchTab(mode) {
        currentMode = mode;
        document.getElementById('reg-fields').style.display = mode === 'reg' ? 'block' : 'none';
        document.getElementById('confirm-fields').style.display = mode === 'reg' ? 'block' : 'none';
        document.getElementById('tab-reg').classList.toggle('active', mode === 'reg');
        document.getElementById('tab-login').classList.toggle('active', mode === 'login');
    }

    async function processAuth() {
        const email = document.getElementById('auth-email').value;
        const name = document.getElementById('reg-name').value || email.split('@')[0];
        user = { name, email };
        localStorage.setItem('skiUser', JSON.stringify(user));
        location.reload();
    }

    function updateUI() {
        if(user) {
            const isAdmin = user.email.toLowerCase() === 'ykrauss1@gmail.com';
            document.getElementById('nav-controls').innerHTML = `
                <span>שלום, <b>${user.name}</b> ${isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}</span>
                <button onclick="localStorage.clear();location.reload()" class="btn-delete" style="text-decoration:underline;cursor:pointer">התנתק</button>
            `;
        }
    }

    // Forum
    async function fetchPosts() {
        const { data: posts, error } = await _supabase.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
        if (error) return;
        const isAdmin = user && user.email.toLowerCase() === 'ykrauss1@gmail.com';
        const container = document.getElementById('posts-container');
        
        container.innerHTML = posts.map(p => {
            const repliesHtml = (p.replies || []).map(r => `<div class="reply-item"><b>${r.user}:</b> ${r.content}</div>`).join('');
            return `
                <div class="post">
                    <div class="post-header">
                        <div><b>${p.user}:</b> ${p.content}</div>
                        <div>
                            <button class="btn-delete" style="color:var(--accent)" onclick="showReplyInput('${p.id}')">תגובה</button>
                            ${isAdmin ? `<button class="btn-delete" onclick="deletePost('${p.id}')">מחיקה ✕</button>` : ''}
                        </div>
                    </div>
                    <div id="reply-box-${p.id}" class="reply-input-box">
                        <input type="text" id="input-${p.id}" style="width:70%;padding:5px;border-radius:5px;border:1px solid #ddd" placeholder="כתוב תגובה...">
                        <button class="btn btn-primary" style="padding:5px 10px" onclick="addReply('${p.id}')">שלח</button>
                    </div>
                    <div class="replies-container">${repliesHtml}</div>
                </div>
            `;
        }).join('');
    }

    function showReplyInput(id) {
        const box = document.getElementById(`reply-box-${id}`);
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    async function addPost() {
        if(!user) return openAuth('login');
        const content = document.getElementById('forum-input').value;
        if(!content.trim()) return;
        await _supabase.from('posts').insert([{ user: user.name, content }]);
        document.getElementById('forum-input').value = "";
        fetchPosts();
    }

    async function addReply(postId) {
        if(!user) return openAuth('login');
        const content = document.getElementById(`input-${postId}`).value;
        if(!content.trim()) return;
        await _supabase.from('replies').insert([{ post_id: postId, user: user.name, content }]);
        fetchPosts();
    }

    async function deletePost(id) {
        if(!confirm("למחוק?")) return;
        await _supabase.from('posts').delete().eq('id', id);
        fetchPosts();
    }

    // Weather
    async function loadWeather() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            document.getElementById('forecast-body').innerHTML = data.forecast.slice(0,4).map(day => {
                const wind = parseInt(day.wind);
                const status = wind > 55 ? '<span class="status-closed">סגור (רוח)</span>' : 
                               wind > 40 ? '<span class="status-closed" style="color:orange">בסיכון</span>' : 
                               '<span class="status-open">פתוח ✅</span>';
                return `<tr><td>${day.date.split('-').reverse().slice(0,2).join('/')}</td><td style="direction:ltr;font-weight:bold">${day.temp_min}/${day.temp_max}</td><td>${day.wind}</td><td>${status}</td></tr>`;
            }).join('');
        } catch (e) {}
    }

    updateUI();
    fetchPosts();
    loadWeather();
</script>
</body>
</html>

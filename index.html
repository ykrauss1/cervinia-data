<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Final Polish</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        /* טבלה נעולה */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 10px; border: 1px solid #eee; text-align: center; }

        /* פורום - עיצוב יציב והיררכי */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; }
        .reply-item { margin-right: 40px; margin-top: 10px; border-right: 3px solid var(--accent); padding: 8px 12px; background: #f8fbff; border-radius: 6px; }
        .user-tag { font-weight: 800; color: var(--dark); }
        .time-tag { font-size: 0.75rem; color: #999; margin-right: 10px; }
        .action-link { color: #3498db; cursor: pointer; font-size: 0.85rem; font-weight: bold; margin-top: 5px; display: inline-block; }
        .del-btn { color: var(--error); cursor: pointer; background: none; border: none; float: left; }

        /* מודאל כניסה/הרשמה מלא */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 360px; position: relative; }
        .f-group { margin-bottom: 12px; position: relative; }
        .f-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .eye-icon { position: absolute; left: 10px; top: 12 : 12px; cursor: pointer; color: #888; }
        
        .btn-row { display: flex; flex-direction: row-reverse; gap: 10px; margin-top: 10px; }
        .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-send { background: var(--accent); color: var(--dark); }
        .btn-cancel { background: #eee; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="card">
        <h3>תחזית (DD/MM/YYYY)</h3>
        <table style="width:100%; text-align:center; border-collapse:collapse;">
            <thead><tr style="background:#eee"><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th><th>סטטוס</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען...</div>
        <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
        <textarea id="f-input" style="width:100%; height:70px; padding:10px; border-radius:8px; border:1px solid #ddd;" placeholder="כתוב פוסט חדש..."></textarea>
        <div class="btn-row"><button class="btn btn-send" onclick="sendPost()">פרסם פוסט</button></div>
    </div>
</div>

<div id="auth-modal" class="modal">
    <div class="modal-content">
        <h2 id="m-title" style="margin-top:0">כניסה</h2>
        <div class="f-group"><input type="email" id="m-email" placeholder="אימייל"></div>
        <div class="f-group"><input type="text" id="m-name" placeholder="שם מלא (חובה לשניהם)"></div>
        <div class="f-group">
            <input type="password" id="m-pass" placeholder="סיסמה">
            <i class="fa fa-eye eye-icon" onclick="togglePass('m-pass')"></i>
        </div>
        <div class="f-group" id="m-confirm-group" style="display:none;">
            <input type="password" id="m-pass-conf" placeholder="אימות סיסמה">
            <i class="fa fa-eye eye-icon" onclick="togglePass('m-pass-conf')"></i>
        </div>
        <button class="btn btn-send" style="width:100%" onclick="doLogin()">אישור</button>
        <p id="m-switch" onclick="toggleMode()" style="text-align:center; color:blue; cursor:pointer; margin-top:15px;">אין חשבון? הירשם</p>
        <button class="btn btn-cancel" style="width:100%; margin-top:5px;" onclick="closeModal()">ביטול</button>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }};

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    let isReg = false;

    window.onload = () => { renderAuth(); loadW(); loadF(); };

    function renderAuth() {
        const area = document.getElementById('auth-area');
        if(user) {
            area.innerHTML = `שלום, <b>${user.name}</b> | <a href="#" onclick="logout()" style="color:white; text-decoration:none;">התנתק</a>`;
        } else {
            area.innerHTML = `<button class="btn btn-send" onclick="openModal()">כניסה / הרשמה</button>`;
        }
    }

    function openModal() { document.getElementById('auth-modal').style.display='flex'; }
    function closeModal() { document.getElementById('auth-modal').style.display='none'; }
    function toggleMode() {
        isReg = !isReg;
        document.getElementById('m-title').innerText = isReg ? 'הרשמה' : 'כניסה';
        document.getElementById('m-confirm-group').style.display = isReg ? 'block' : 'none';
        document.getElementById('m-switch').innerText = isReg ? 'כבר רשום? כנס' : 'אין חשבון? הירשם';
    }
    function togglePass(id) {
        const el = document.getElementById(id);
        el.type = el.type === 'password' ? 'text' : 'password';
    }

    function doLogin() {
        const email = document.getElementById('m-email').value;
        const name = document.getElementById('m-name').value;
        if(!email || !name) return alert("נא למלא אימייל ושם");
        user = { email, name };
        localStorage.setItem('skiUser', JSON.stringify(user));
        location.reload();
    }

    function logout() { localStorage.clear(); location.reload(); }
    function fmtDate(iso) {
        const d = new Date(iso);
        return d.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'}) + ' ,' + d.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit'});
    }

    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            document.getElementById('w-body').innerHTML = d.forecast.slice(0,4).map(f => `
                <tr style="border-bottom:1px solid #eee">
                    <td><b>${f.date.split('-').reverse().join('/')}</b></td>
                    <td style="color:red;direction:ltr">${f.temp_min.replace(/[^\d.-]/g,'')}°/${f.temp_max.replace(/[^\d.-]/g,'')}°C</td>
                    <td>${f.wind.replace(/[^\d.]/g,'')} קמ"ש</td>
                    <td>${f.visibility}</td><td style="color:green;font-weight:bold">פתוח</td>
                </tr>`).join('');
        } catch(e) {}
    }

    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const isAdmin = user && user.email === 'ykrauss1@gmail.com';

            document.getElementById('f-container').innerHTML = data.map(p => {
                const rs = (p.replies || []).map(r => `
                    <div class="reply-item">
                        <span class="user-tag">${r.user}</span> <span class="time-tag">${fmtDate(r.created_at)}</span>
                        <div style="margin:5px 0;">${r.content}</div>
                        <span class="action-link" onclick="openReply('${p.id}', '${r.user}')">השב</span>
                        ${isAdmin ? `<button class="del-btn" onclick="del('replies','${r.id}')"><i class="fa fa-trash"></i></button>` : ''}
                    </div>`).join('');

                return `
                    <div class="post">
                        <span class="user-tag">${p.user}</span> <span class="time-tag">${fmtDate(p.created_at)}</span>
                        <div style="margin:8px 0;">${p.content}</div>
                        <span class="action-link" onclick="openReply('${p.id}', '${p.user}')">השב</span>
                        ${isAdmin ? `<button class="del-btn" onclick="del('posts','${p.id}')"><i class="fa fa-trash"></i> מחק</button>` : ''}
                        <div id="box-${p.id}"></div>
                        <div class="replies-area">${rs}</div>
                    </div>`;
            }).join('');
        } catch(e) {}
    }

    function openReply(pId, toUser) {
        if(!user) return openModal();
        const b = document.getElementById('box-' + pId);
        b.innerHTML = `
            <div style="background:#f0f0f0; padding:10px; border-radius:8px; margin-top:10px;">
                <textarea id="in-${pId}" style="width:100%; border:1px solid #ccc; padding:5px;">@${toUser}: </textarea>
                <div class="btn-row">
                    <button class="btn btn-send" onclick="sendReply('${pId}')">שלח</button>
                    <button class="btn btn-cancel" onclick="this.parentElement.parentElement.remove()">ביטול</button>
                </div>
            </div>`;
    }

    async function sendPost() {
        const txt = document.getElementById('f-input').value;
        if(!user || !txt.trim()) return !user ? openModal() : null;
        await fetch(`${API}/posts`, { method: 'POST', ...HEAD, body: JSON.stringify({ user: user.name, content: txt }) });
        document.getElementById('f-input').value = "";
        loadF();
    }

    async function sendReply(pId) {
        const txt = document.getElementById('in-' + pId).value;
        if(!txt.trim()) return;
        await fetch(`${API}/replies`, { method: 'POST', ...HEAD, body: JSON.stringify({ post_id: pId, user: user.name, content: txt }) });
        loadF();
    }

    async function del(tbl, id) {
        if(confirm("למחוק?")) {
            await fetch(`${API}/${tbl}?id=eq.${id}`, { method: 'DELETE', ...HEAD });
            loadF();
        }
    }
</script>
</body>
</html>

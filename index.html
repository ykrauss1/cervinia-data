<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - Final Fix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #1a1a1a; --gray: #666; --accent: #f39c12; --bg: #fdfdfd; --border: #ececec; }
        body { font-family: 'Segoe UI', system-ui; background: var(--bg); margin: 0; direction: rtl; color: #333; }
        
        nav { background: white; border-bottom: 1px solid var(--border); padding: 10px 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 1.5rem; color: var(--dark); }
        .logo span { color: var(--accent); }

        .stats-bar { display: flex; justify-content: center; align-items: center; gap: 40px; padding: 25px 10px; background: white; border-bottom: 1px solid var(--border); }
        .stat-box { text-align: center; color: var(--gray); font-size: 0.9rem; }
        .stat-box i { font-size: 1.4rem; display: block; margin-bottom: 8px; color: #333; }
        .stat-box b { font-size: 1.2rem; color: #000; display: block; }

        .container { max-width: 800px; margin: 30px auto; padding: 0 15px; }
        .post-card { background: white; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 20px; padding: 20px; }
        .post-header { font-weight: 800; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .post-img { max-width: 100%; border-radius: 4px; margin: 15px 0; border: 1px solid var(--border); }

        /* שיפור תצוגת התגובות */
        .replies-container { margin-top: 15px; padding-right: 15px; border-right: 3px solid #eee; background: #fafafa; border-radius: 0 4px 4px 0; }
        .reply-item { padding: 10px; border-bottom: 1px solid #eee; }
        .reply-item:last-child { border-bottom: none; }
        
        /* כפתורי השב */
        .reply-btn { color: var(--accent); font-size: 0.8rem; font-weight: bold; cursor: pointer; margin-top: 5px; display: inline-block; border: none; background: none; padding: 0; }
        .reply-btn:hover { text-decoration: underline; }

        /* תיבת כתיבה */
        .input-wrapper { background: white; border: 1px solid #ccc; border-radius: 4px; padding: 15px; margin-top: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        textarea { width: 100%; border: none; outline: none; resize: none; font-size: 1rem; font-family: inherit; }
        .input-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        
        .upload-label { color: var(--gray); cursor: pointer; font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
        .upload-label:hover { color: var(--dark); }
        #file-status { font-size: 0.8rem; color: green; font-weight: normal; }

        .btn-post { background: var(--dark); color: white; border: none; padding: 10px 25px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        
        /* תיבת תגובה מהירה */
        .quick-reply-box { display: none; margin-top: 10px; padding: 10px; background: white; border: 1px solid #ddd; }
    </style>
</head>
<body>

<nav>
    <div class="logo">CERVINIA<span>LIVE</span></div>
    <div id="auth-area"></div>
</nav>

<div class="stats-bar">
    <div class="stat-box"><i class="fa fa-sun"></i><b id="stat-temp">--°</b>WEATHER</div>
    <div class="stat-box"><i class="fa fa-cable-car"></i><b id="stat-lifts">--</b>LIFTS</div>
    <div class="stat-box"><i class="fa fa-route"></i><b id="stat-slopes">--</b>SLOPES</div>
    <div class="stat-box" onclick="window.open('https://www.cervinia.it/en/winter/skirama','_blank')" style="cursor:pointer"><i class="fa fa-map"></i><b>VIEW</b>MAPS</div>
</div>

<div class="container">
    <div id="f-container">טוען הודעות...</div>

    <div class="input-wrapper">
        <textarea id="f-input" rows="3" placeholder="שתף משהו מהשטח..."></textarea>
        <div class="input-footer">
            <label class="upload-label">
                <i class="fa fa-paperclip"></i>
                <span id="file-status"></span>
                <input type="file" id="f-file" hidden accept="image/*" onchange="document.getElementById('file-status').innerText='קובץ נבחר'">
            </label>
            <button class="btn-post" id="post-btn" onclick="publishPost()">פרסם</button>
        </div>
    </div>
</div>

<script>
    const PROJECT = 'cdgqodtbdhsqkvcgcdlm';
    const API = `https://${PROJECT}.supabase.co/rest/v1`;
    const STORAGE = `https://${PROJECT}.supabase.co/storage/v1/object/public/images`;
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    window.onload = () => { renderAuth(); loadWeather(); loadStatus(); loadForum(); };

    function renderAuth() {
        const area = document.getElementById('auth-area');
        if(user) area.innerHTML = `<span>שלום, <b>${user.name}</b> | <a href="#" onclick="logout()">התנתק</a></span>`;
        else area.innerHTML = `<button onclick="login()">כניסה</button>`;
    }

    async function loadForum() {
        const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
        const posts = await res.json();
        
        document.getElementById('f-container').innerHTML = posts.map(p => `
            <div class="post-card">
                <div class="post-header"><b>${p.user}</b> <small>${new Date(p.created_at).toLocaleTimeString()}</small></div>
                <div>${p.content}</div>
                ${p.image_url ? `<img src="${p.image_url}" class="post-img">` : ''}
                
                <div class="replies-container">
                    ${(p.replies || []).map(r => `
                        <div class="reply-item">
                            <b>${r.user}:</b> ${r.content}
                            <br><button class="reply-btn" onclick="showReplyBox('${p.id}')">השב</button>
                        </div>
                    `).join('')}
                </div>

                <button class="reply-btn" style="margin-top:10px; font-size:0.9rem" onclick="showReplyBox('${p.id}')">
                    <i class="fa fa-comment"></i> הוסף תגובה לפוסט
                </button>

                <div id="reply-box-${p.id}" class="quick-reply-box">
                    <input type="text" id="reply-in-${p.id}" placeholder="כתוב תגובה..." style="width:70%; padding:5px;">
                    <button class="btn-post" style="padding:5px 10px; font-size:0.7rem;" onclick="submitReply('${p.id}')">שלח</button>
                </div>
            </div>
        `).join('');
    }

    function showReplyBox(id) {
        document.getElementById(`reply-box-${id}`).style.display = 'block';
        document.getElementById(`reply-in-${id}`).focus();
    }

    async function submitReply(postId) {
        const val = document.getElementById(`reply-in-${postId}`).value;
        if(!val.trim()) return;
        if(!user) return login();

        await fetch(`${API}/replies`, {
            method: 'POST',
            headers: HEAD.headers,
            body: JSON.stringify({ post_id: postId, user: user.name, content: val })
        });
        loadForum();
    }

    async function publishPost() {
        const content = document.getElementById('f-input').value;
        const fileInput = document.getElementById('f-file');
        if(!user) return login();
        if(!content.trim()) return;

        let url = null;
        if(fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const name = `${Date.now()}_${file.name}`;
            const up = await fetch(`https://${PROJECT}.supabase.co/storage/v1/object/images/${name}`, {
                method: 'POST',
                headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` },
                body: file
            });
            if(up.ok) url = `${STORAGE}/${name}`;
        }

        await fetch(`${API}/posts`, {
            method: 'POST',
            headers: HEAD.headers,
            body: JSON.stringify({ user: user.name, content, image_url: url })
        });
        location.reload();
    }

    async function loadWeather() {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.93&longitude=7.71&current=temperature_2m');
        const d = await res.json();
        document.getElementById('stat-temp').innerText = Math.round(d.current.temperature_2m) + '°';
    }

    async function loadStatus() {
        const res = await fetch(`${API}/site_status?select=*&id=eq.1`, HEAD);
        const [data] = await res.json();
        if(data) {
            document.getElementById('stat-slopes').innerText = data.slopes;
            document.getElementById('stat-lifts').innerText = data.lifts;
        }
    }

    function login() { const n = prompt("שם:"); if(n) { localStorage.setItem('skiUser', JSON.stringify({name:n})); location.reload(); } }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

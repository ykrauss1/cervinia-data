<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; --warning: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .service-btn { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; color: var(--dark); font-weight: bold; transition: all 0.3s ease; }
        .service-btn:hover { background: var(--accent); transform: translateY(-3px); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        .prob-High { color: var(--success); font-weight: bold; }
        .prob-Medium { color: var(--warning); font-weight: bold; }
        .prob-Low { color: var(--error); font-weight: bold; }
        /* Forum Styles */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; }
        .reply-item { margin-top: 10px; padding: 10px; background: #f8fbff; border-right: 4px solid #cbd5e0; border-radius: 6px; }
        .del-btn { color: var(--error); cursor: pointer; float: left; border: 1px solid var(--error); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; background: white; }
        .btn-send { background: var(--accent); color: var(--dark); padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-cancel { background: #ccc; color: #333; padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; margin-top: 10px; font-family: inherit; }
        .img-preview { max-width: 250px; border-radius: 8px; margin-top: 10px; cursor: pointer; display: block; }
        /* Modals */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .modal-content { background: white; width: 95%; max-width: 900px; padding: 25px; border-radius: 15px; position: relative; max-height: 90vh; overflow-y: auto; }
        .booking-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 10px; font-family: inherit; }
        .map-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .map-btn { padding: 8px 15px; border-radius: 5px; border: 1px solid #ddd; cursor: pointer; font-weight: bold; background: #eee; }
        .map-btn.active { background: var(--accent); color: var(--dark); border-color: var(--accent); }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa fa-thermometer-half"></i><br><small>טמפ' כעת</small><br><b id="stat-temp">--</b></div>
        <div class="stat-card"><i class="fa fa-mountain"></i><br><small>מסלולים</small><br><b id="stat-slopes">--</b></div>
        <div class="stat-card"><i class="fa fa-wind"></i><br><small>מעליות</small><br><b id="stat-lifts">--</b></div>
        <div class="stat-card"><i class="fa fa-check-circle"></i><br><small>מצב האתר</small><br><b id="stat-conn">--</b></div>
    </div>

    <div class="services-grid">
        <div class="service-btn" onclick="openHotels()"><i class="fa fa-hotel"></i>אירוח</div>
        <div class="service-btn"><i class="fa fa-person-skiing"></i>הדרכת סקי</div>
        <div class="service-btn"><i class="fa fa-tools"></i>השכרת ציוד</div>
        <div class="service-btn" onclick="openMaps()"><i class="fa fa-map-marked-alt"></i>מפות האתר</div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים הקרובים (Plateau Rosà)</h3>
        <table>
            <thead><tr><th>צפי ללינק</th><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
        <div id="update-time" style="font-size: 0.8rem; color: #888; margin-top: 10px;"></div>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px;">
            <textarea id="f-input" placeholder="כתוב פוסט חדש..."></textarea>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <input type="file" id="f-file" accept="image/*" style="font-size:0.8rem;">
                <button class="btn-send" onclick="sendPost()">פרסם פוסט</button>
            </div>
        </div>
    </div>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>חיפוש אירוח חכם</h3>
            <button onclick="closeHotels()" style="border:none; background:none; font-size:2rem; cursor:pointer;">&times;</button>
        </div>
        <div style="margin-top:15px;">
            <label>בחר טווח תאריכים:</label>
            <input type="text" id="dateRange" class="booking-input" placeholder="לחץ לבחירת תאריכים...">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
                <select id="guests" class="booking-input"><option value="2">2 אורחים</option><option value="1">אורח 1</option><option value="3">3 אורחים</option><option value="4">4 אורחים</option></select>
                <select id="rooms" class="booking-input"><option value="1">חדר 1</option><option value="2">2 חדרים</option></select>
            </div>
            <button class="btn-send" style="width:100%; margin-top:20px; padding:15px;" onclick="performSearch()">חפש ב-Booking ו-Airbnb</button>
        </div>
    </div>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3>מפות</h3>
            <button onclick="closeMaps()" style="border:none; background:none; font-size:2rem; cursor:pointer;">&times;</button>
        </div>
        <div class="map-controls">
            <button id="btn-google" class="map-btn active" onclick="showMap('google')">מפת עיירה (גוגל)</button>
            <button id="btn-slopes" class="map-btn" onclick="showMap('slopes')">מפת מסלולים</button>
            <button id="btn-my" class="map-btn" onclick="showMap('my')">הנקודות שלי</button>
        </div>
        <div id="mapView" style="border:1px solid #ddd; border-radius:8px; height:500px; overflow:auto; background:#eee;">
            <iframe id="googleFrame" width="100%" height="100%" frameborder="0" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5538.336140510123!2d7.6200257!3d45.9341492!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4788cbd26f74a955%3A0x6336e92b3a1a6797!2s11028%20Breuil-Cervinia%2C%20AO%2C%20Italy!5e0!3m2!1sen!2sil!4v1700000000000"></iframe>
            <img id="staticImg" src="" style="width:100%; display:none;">
        </div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const BUCKET_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/storage/v1/object/public/uploads';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    const ADMIN_NAME = 'ADMIN';

    flatpickr("#dateRange", { mode: "range", dateFormat: "Y-m-d", minDate: "today" });

    window.onload = () => { renderHeader(); loadW(); loadF(); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            const isAdmin = user.name === ADMIN_NAME;
            area.innerHTML = `<div>${isAdmin ? '<span style="background:red;color:white;padding:2px 5px;border-radius:4px;font-size:0.75rem;margin-left:5px;font-weight:bold;">ADMIN</span>' : ''}שלום, <b>${user.name}</b> | <a href="#" onclick="logout()" style="color:white; margin-right:5px;">התנתק</a></div>`;
        } else {
            area.innerHTML = `<button class="btn-send" onclick="login()">כניסה</button>`;
        }
    }

    async function uploadFile(file) {
        if(!file) return null;
        const fileName = `${Date.now()}_${file.name}`;
        const res = await fetch(`https://cdgqodtbdhsqkvcgcdlm.supabase.co/storage/v1/object/uploads/${fileName}`, {
            method: 'POST',
            headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` },
            body: file
        });
        return res.ok ? `${BUCKET_URL}/${fileName}` : null;
    }

    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            const today = new Date().toISOString().split('T')[0];
            
            document.getElementById('stat-temp').innerText = d.temp || '--';
            document.getElementById('stat-slopes').innerText = d.slopes || '--';
            document.getElementById('stat-lifts').innerText = d.lifts || '--';
            document.getElementById('stat-conn').innerText = d.conn === 'open' ? 'פתוח' : 'סגור';
            document.getElementById('update-time').innerText = 'עדכון: ' + (d.last_update || '--');

            const filtered = d.forecast.filter(f => f.date >= today).slice(0,4);
            document.getElementById('w-body').innerHTML = filtered.map(f => {
                const wind = parseFloat(String(f.wind).replace(/[^0-9.]/g, '')) || 0;
                let p = 'בינוני', c = 'prob-Medium';
                if(wind < 32) { p = 'גבוה'; c = 'prob-High'; }
                else if(wind > 50) { p = 'נמוך'; c = 'prob-Low'; }
                return `<tr><td class="${c}">${p}</td><td>${f.date}</td><td style="direction:ltr">${f.temp_min} / ${f.temp_max}</td><td>${f.wind}</td><td>${f.visibility}</td></tr>`;
            }).join('');
        } catch(e) {}
    }

    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const isAdmin = user && user.name === ADMIN_NAME;
            let html = '';
            data.forEach(p => {
                const buildTree = (parentId = null) => {
                    return (p.replies || []).filter(r => r.parent_id === parentId).map(r => `
                        <div class="reply-item">
                            ${isAdmin ? `<button class="del-btn" onclick="deleteMsg('replies','${r.id}')">מחק</button>` : ''}
                            <span style="font-weight:800;">${r.user === ADMIN_NAME ? '<span style="color:red">ADMIN</span>' : r.user}</span>
                            <div style="margin:5px 0;">${r.content}</div>
                            ${r.file_url ? `<img src="${r.file_url}" class="img-preview" onclick="window.open(this.src)">` : ''}
                            <span style="color:#3498db; cursor:pointer; font-size:0.8rem; font-weight:bold;" onclick="openBox('${p.id}', '${r.user}', this, '${r.id}')">השב</span>
                            <div class="reply-target"></div>
                            ${buildTree(r.id)}
                        </div>`).join('');
                };
                html += `<div class="post">
                    ${isAdmin ? `<button class="del-btn" onclick="deleteMsg('posts','${p.id}')">מחק פוסט</button>` : ''}
                    <span style="font-weight:800;">${p.user === ADMIN_NAME ? '<span style="color:red">ADMIN</span>' : p.user}</span>
                    <div style="margin:10px 0; font-weight:bold;">${p.content}</div>
                    ${p.file_url ? `<img src="${p.file_url}" class="img-preview" onclick="window.open(this.src)">` : ''}
                    <span style="color:#3498db; cursor:pointer; font-size:0.8rem; font-weight:bold;" onclick="openBox('${p.id}', '${p.user}', this, null)">השב</span>
                    <div class="reply-target"></div>
                    ${buildTree(null)}
                </div>`;
            });
            document.getElementById('f-container').innerHTML = html || 'אין הודעות.';
        } catch(e) {}
    }

    function openBox(pId, toUser, el, parentId) {
        const target = el.nextElementSibling;
        if(target.innerHTML !== '') { target.innerHTML = ''; return; }
        document.querySelectorAll('.reply-target').forEach(t => t.innerHTML = '');
        target.innerHTML = `<div style="margin-top:10px;">
            <textarea id="temp-in-${pId}">@${toUser}: </textarea>
            <input type="file" id="file-in-${pId}" style="font-size:0.75rem; margin:5px 0;"><br>
            <button class="btn-send" onclick="sendReply('${pId}', ${parentId ? `'${parentId}'` : 'null'})">שלח</button>
            <button class="btn-cancel" onclick="this.closest('.reply-target').innerHTML=''">ביטול</button>
        </div>`;
        const tx = document.getElementById(`temp-in-${pId}`);
        tx.focus(); tx.setSelectionRange(tx.value.length, tx.value.length);
    }

    async function sendPost() {
        const input = document.getElementById('f-input');
        const fileIn = document.getElementById('f-file');
        if(!user || !input.value.trim()) return;
        let fileUrl = await uploadFile(fileIn.files[0]);
        await fetch(`${API}/posts`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({user: user.name, content: input.value.trim(), file_url: fileUrl}) });
        input.value = ''; fileIn.value = ''; loadF();
    }

    async function sendReply(pId, pParentId) {
        const area = document.getElementById(`temp-in-${pId}`);
        const fileIn = document.getElementById(`file-in-${pId}`);
        if(!area || !area.value.trim()) return;
        let fileUrl = await uploadFile(fileIn.files[0]);
        await fetch(`${API}/replies`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({post_id: pId, user: user.name, content: area.value.trim(), parent_id: pParentId, file_url: fileUrl}) });
        loadF();
    }

    async function deleteMsg(table, id) { if(confirm("למחוק?")) { await fetch(`${API}/${table}?id=eq.${id}`, { method: 'DELETE', headers: HEAD.headers }); loadF(); } }

    // Logic: Hotels & Maps
    function openHotels() { document.getElementById('hotelModal').style.display='flex'; }
    function closeHotels() { document.getElementById('hotelModal').style.display='none'; }
    function performSearch() {
        const dates = document.getElementById('dateRange').value.split(" to ");
        if(dates.length < 2) return alert("בחר תאריכים");
        const g = document.getElementById('guests').value;
        window.open(`https://www.booking.com/searchresults.he.html?ss=Breuil-Cervinia&checkin=${dates[0]}&checkout=${dates[1]}&group_adults=${g}`, '_blank');
        window.open(`https://www.airbnb.co.il/s/Breuil~Cervinia--Italy/homes?checkin=${dates[0]}&checkout=${dates[1]}&adults=${g}`, '_blank');
    }

    function openMaps() { document.getElementById('mapModal').style.display='flex'; showMap('google'); }
    function closeMaps() { document.getElementById('mapModal').style.display='none'; }
    function showMap(type) {
        const gFrame = document.getElementById('googleFrame'), sImg = document.getElementById('staticImg');
        document.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + type).classList.add('active');
        if(type === 'google') { gFrame.style.display = 'block'; sImg.style.display = 'none'; }
        else { gFrame.style.display = 'none'; sImg.style.display = 'block'; sImg.src = type === 'slopes' ? 'slopesmap.jpg' : 'mymap.jpg'; }
    }

    function login() { const n = prompt("שם:"); if(n) { user = {name:n}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); } }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Deep Threading Fix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        /* עיצוב השרשור - משופר */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 20px; margin-bottom: 20px; background: white; }
        .replies-area { margin-top: 15px; }
        
        .reply-item { 
            margin-top: 10px; 
            padding: 12px; 
            background: #f8fbff; 
            border: 1px solid #edf2f7;
            border-right: 4px solid #cbd5e0;
            border-radius: 8px;
        }

        /* רמות הזחה (Indentation) */
        .reply-item.depth-1 { margin-right: 30px; border-right-color: var(--accent); background: #f0f9ff; }
        .reply-item.depth-2 { margin-right: 60px; border-right-color: #2c3e50; background: #e6f7ff; }
        .reply-item.depth-3 { margin-right: 90px; border-right-color: #34495e; background: #d6f2ff; }

        .user-tag { font-weight: 800; color: var(--dark); }
        .time-tag { font-size: 0.75rem; color: #999; margin-right: 10px; }
        .action-link { color: #3498db; cursor: pointer; font-size: 0.85rem; font-weight: bold; margin-top: 5px; display: inline-block; }
        .del-btn { color: var(--error); cursor: pointer; background: #fff1f0; border: 1px solid #error; border-radius: 4px; float: left; padding: 2px 6px; font-size: 0.75rem; }
        
        textarea { width: 100%; height: 60px; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-top: 10px; }
        .btn-send { background: var(--accent); color: var(--dark); padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <hr>
        <textarea id="f-input" placeholder="כתוב פוסט חדש..."></textarea>
        <button class="btn-send" onclick="sendPost()">פרסם פוסט</button>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }};

    const user = JSON.parse(localStorage.getItem('skiUser')) || { name: "אורח", email: "guest" };

    window.onload = loadF;

    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const isAdmin = user.email === 'ykrauss1@gmail.com';

            let html = '';
            data.forEach(p => {
                const replies = p.replies || [];
                replies.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

                let repliesHtml = '';
                
                // הפיכת מערך התגובות לעץ היררכי
                const repliesMap = new Map();
                replies.forEach(r => repliesMap.set(r.id, r));
                
                // פונקציה רקורסיבית להצגת תגובות עם עומק
                function renderReplies(parentId, depth) {
                    replies.filter(r => r.reply_id === parentId || (depth === 0 && !r.reply_id)).forEach(r => {
                        repliesHtml += `
                            <div class="reply-item depth-${depth}">
                                ${isAdmin ? `<button class="del-btn" onclick="delMsg('replies','${r.id}')"><i class="fa fa-trash"></i></button>` : ''}
                                <span class="user-tag">${r.user}</span>
                                <span class="time-tag">${new Date(r.created_at).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'})}</span>
                                <div style="margin:5px 0;">${r.content}</div>
                                <span class="action-link" onclick="openBox('${p.id}', '${r.user}', this, '${r.id}')">השב</span>
                                <div class="reply-target"></div>
                            </div>`;
                        // כאן הרקורסיה - מחפשים תגובות שקשורות לתגובה הנוכחית
                        renderReplies(r.id, depth + 1);
                    });
                }
                
                renderReplies(null, 0);

                html += `
                <div class="post">
                    ${isAdmin ? `<button class="del-btn" onclick="delMsg('posts','${p.id}')"><i class="fa fa-trash"></i> מחק פוסט</button>` : ''}
                    <span class="user-tag">${p.user}</span>
                    <span class="time-tag">${new Date(p.created_at).toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'})}</span>
                    <div style="margin:10px 0; font-size:1.1rem;">${p.content}</div>
                    <span class="action-link" onclick="openBox('${p.id}', '${p.user}', this, null)">השב</span>
                    <div class="reply-target"></div>
                    <div class="replies-area">${repliesHtml}</div>
                </div>`;
            });
            document.getElementById('f-container').innerHTML = html;
        } catch (e) { console.error(e); }
    }

    function openBox(pId, toUser, el, replyId) {
        document.querySelectorAll('.reply-target').forEach(d => d.innerHTML = '');
        const target = el.nextElementSibling;
        target.innerHTML = `
            <div style="margin-top:10px;">
                <textarea id="in-${pId}">@${toUser}: </textarea>
                <button class="btn-send" onclick="sendReply('${pId}', ${replyId ? `'${replyId}'` : 'null'})">שלח תגובה</button>
            </div>`;
    }

    async function sendPost() {
        const content = document.getElementById('f-input').value;
        if (!content.trim()) return;
        await fetch(`${API}/posts`, { method: 'POST', ...HEAD, body: JSON.stringify({ user: user.name, content }) });
        document.getElementById('f-input').value = '';
        loadF();
    }

    // הוספת ה-replyId לפונקציית השליחה כדי לדעת למי להגיב
    async function sendReply(pId, replyId) {
        const content = document.querySelector(`#in-${pId}`).value;
        if (!content.trim()) return;
        
        // יצירת האובייקט לשליחה ל-Supabase
        const payload = { post_id: pId, user: user.name, content: content };
        if (replyId) payload.reply_id = replyId; // אם יש reply_id, נשתמש בו

        await fetch(`${API}/replies`, { method: 'POST', ...HEAD, body: JSON.stringify(payload) });
        loadF();
    }

    async function delMsg(table, id) {
        if (!confirm("למחוק?")) return;
        await fetch(`${API}/${table}?id=eq.${id}`, { method: 'DELETE', headers: HEAD.headers });
        loadF();
    }
</script>
</body>
</html>

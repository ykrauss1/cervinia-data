<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - סופי ומוגן</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #e0e6ed; --white: #ffffff; --error: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        nav { background: var(--primary); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-text { font-size: 1.8em; font-weight: 900; color: white; text-decoration: none; }
        .logo-text span { color: var(--accent); }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        /* Auth */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .auth-card { background: white; padding: 30px; border-radius: 15px; width: 350px; position: relative; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        /* Forecast & Cams */
        .forecast-table { width: 100%; border-collapse: collapse; text-align: center; }
        .forecast-table td, .forecast-table th { padding: 12px; border-bottom: 1px solid #eee; }
        .webcams { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .cam-box { background: #000; border-radius: 12px; overflow: hidden; border: 2px solid white; position: relative; }
        .cam-box img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .cam-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.6); color: white; padding: 5px; text-align: center; font-size: 0.85em; }

        /* Forum */
        .post { border-bottom: 2px solid #f8f9fa; padding: 20px 0; }
        .user-name { font-weight: bold; color: var(--primary); margin-left: 5px; }
        .replies-container { margin-right: 25px; border-right: 3px solid #eef0f2; padding-right: 15px; margin-top: 10px; }
        .reply-item { background: #f8f9fa; padding: 12px; border-radius: 10px; margin-top: 8px; font-size: 0.95em; border: 1px solid #edf2f7; }
        
        textarea, .reply-input-field { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; box-sizing: border-box; display: block; margin-bottom: 10px;
        }
        .reply-input-box { display: none; margin: 15px 0; padding: 15px; background: #f1f5f9; border-radius: 10px; width: 100%; box-sizing: border-box; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--accent); color: var(--primary); }
        .btn-cancel { background: #e0e0e0; color: #666; margin-right: 10px; }
        .action-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.85em; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
        .btn-delete { color: #ccc; background: none; border: none; cursor: pointer; margin-right: 10px; }
        .btn-delete:hover { color: var(--error); }
        .admin-badge { background: var(--error); color: white; padding: 2px 7px; border-radius: 5px; font-size: 0.7em; margin-right: 5px; }
    </style>
</head>
<body>

<nav>
    <div class="logo-text">Cervinia<span>Live</span></div>
    <div id="nav-controls">
        <button class="btn btn-primary" onclick="openAuth()">התחברות</button>
    </div>
</nav>

<div id="auth-modal" onclick="if(event.target.id === 'auth-modal') closeAuth()">
    <div class="auth-card" onclick="event.stopPropagation()">
        <h3>התחברות / רישום</h3>
        <div class="input-group"><input type="text" id="auth-name" placeholder="שם משתמש (ADMIN לניהול)"></div>
        <div class="input-group"><input type="email" id="auth-email" placeholder="אימייל"></div>
        <div class="input-group"><input type="password" id="auth-pass" placeholder="סיסמה"></div>
        <button class="btn btn-primary" style="width:100%" onclick="processAuth()">אישור</button>
    </div>
</div>

<div class="container">
    <div class="card">
        <h3><i class="fa-solid fa-cloud-sun"></i> צפי סטטוס קישור</h3>
        <table class="forecast-table">
            <thead><tr><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>צפי</th></tr></thead>
            <tbody id="forecast-body"></tbody>
        </table>
    </div>

    <div class="webcams">
        <div class="cam-box"><img src="https://webcam.cervinia.it/webcam/cervinia/cervinia-1.jpg"><div class="cam-label">Town</div></div>
        <div class="cam-box"><img src="https://webcam.cervinia.it/webcam/cervinia/plan-maison-1.jpg"><div class="cam-label">Plan Maison</div></div>
        <div class="cam-box"><img src="https://webcam.cervinia.it/webcam/cervinia/plateau-rosa-1.jpg"><div class="cam-label">Plateau Rosa</div></div>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-comments"></i> פורום עדכונים</h3>
        <div id="posts-container">טוען הודעות...</div>
        <div style="margin-top:25px; border-top: 1px solid #eee; padding-top: 20px;">
            <textarea id="forum-input" rows="3" placeholder="כתוב הודעה חדשה..."></textarea>
            <button class="btn btn-primary" style="width:100%" onclick="addPost()">שלח פוסט</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    // ESC לסגירה
    window.addEventListener('keydown', (e) => { if (e.key === "Escape") { document.querySelectorAll('.reply-input-box').forEach(b => b.style.display = 'none'); closeAuth(); } });

    function openAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
    function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }

    async function processAuth() {
        const email = document.getElementById('auth-email').value;
        const name = document.getElementById('auth-name').value || email.split('@')[0];
        if(!email) return;
        user = { name, email };
        localStorage.setItem('skiUser', JSON.stringify(user));
        location.reload();
    }

    function isUserAdmin() {
        return user && user.email.toLowerCase() === 'ykrauss1@gmail.com' && user.name === 'ADMIN';
    }

    function updateUI() {
        if(user) {
            document.getElementById('nav-controls').innerHTML = `
                <span style="margin-left:15px">שלום, <b>${user.name}</b> ${isUserAdmin() ? '<span class="admin-badge">ADMIN</span>' : ''}</span>
                <button onclick="localStorage.clear();location.reload()" class="action-link" style="color:white">התנתק</button>
            `;
        }
    }

    async function fetchPosts() {
        const { data: posts } = await _supabase.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
        if (!posts) return;
        const admin = isUserAdmin();
        const container = document.getElementById('posts-container');
        
        container.innerHTML = posts.map(p => {
            const repliesHtml = (p.replies || []).map(r => `
                <div class="reply-item">
                    <b class="user-name">${r.user}:</b> ${r.content}
                    <div style="margin-top:8px">
                        <button class="action-link" onclick="showReplyInput('${p.id}', '${r.user}', '${r.id}')">השב</button>
                        ${admin ? `<button class="btn-delete" onclick="deleteReply('${r.id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                    <div id="reply-to-reply-${r.id}" class="reply-input-box">
                        <input type="text" id="input-sub-${r.id}" class="reply-input-field" placeholder="השב ל-${r.user}...">
                        <button class="btn btn-primary" style="width:auto" onclick="addReply('${p.id}', 'input-sub-${r.id}')">שלח</button>
                        <button class="btn btn-cancel" onclick="hideReplyBox('reply-to-reply-${r.id}')">ביטול</button>
                    </div>
                </div>
            `).join('');

            return `
                <div class="post">
                    <div><b class="user-name">${p.user}:</b> ${p.content}</div>
                    <div style="margin-top:10px">
                        <button class="action-link" onclick="showReplyInput('${p.id}')"><i class="fa-solid fa-comment"></i> תגובה</button>
                        ${admin ? `<button class="btn-delete" onclick="deletePost('${p.id}')"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                    <div id="reply-box-${p.id}" class="reply-input-box">
                        <input type="text" id="input-${p.id}" class="reply-input-field" placeholder="כתוב תגובה...">
                        <button class="btn btn-primary" style="width:auto" onclick="addReply('${p.id}', 'input-${p.id}')">שלח</button>
                        <button class="btn btn-cancel" onclick="hideReplyBox('reply-box-${p.id}')">ביטול</button>
                    </div>
                    <div class="replies-container">${repliesHtml}</div>
                </div>
            `;
        }).join('');
    }

    function showReplyInput(postId, mention = '', replyId = null) {
        document.querySelectorAll('.reply-input-box').forEach(b => b.style.display = 'none');
        const targetId = replyId ? `reply-to-reply-${replyId}` : `reply-box-${postId}`;
        const inputId = replyId ? `input-sub-${replyId}` : `input-${postId}`;
        document.getElementById(targetId).style.display = 'block';
        if(mention) document.getElementById(inputId).value = `@${mention} `;
        document.getElementById(inputId).focus();
    }

    function hideReplyBox(id) { document.getElementById(id).style.display = 'none'; }

    async function addPost() {
        if(!user) return openAuth();
        const content = document.getElementById('forum-input').value;
        if(content.trim()) await _supabase.from('posts').insert([{ user: user.name, content }]);
        document.getElementById('forum-input').value = ""; fetchPosts();
    }

    async function addReply(postId, inputId) {
        if(!user) return openAuth();
        const content = document.getElementById(inputId).value;
        if(content.trim()) await _supabase.from('replies').insert([{ post_id: postId, user: user.name, content }]);
        fetchPosts();
    }

    async function deletePost(id) { if(confirm("למחוק?")) { await _supabase.from('posts').delete().eq('id', id); fetchPosts(); } }
    async function deleteReply(id) { if(confirm("למחוק?")) { await _supabase.from('replies').delete().eq('id', id); fetchPosts(); } }

    async function loadWeather() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            document.getElementById('forecast-body').innerHTML = data.forecast.slice(0,4).map(day => {
                const wind = parseInt(day.wind);
                const status = wind > 55 ? 'סגור' : wind > 40 ? 'בסיכון' : 'פתוח ✅';
                return `<tr><td>${day.date.split('-').reverse().slice(0,2).join('/')}</td><td dir="ltr">${day.temp_min}/${day.temp_max}</td><td>${day.wind}</td><td>${status}</td></tr>`;
            }).join('');
        } catch(e) {}
    }

    updateUI(); fetchPosts(); loadWeather();
</script>
</body>
</html>

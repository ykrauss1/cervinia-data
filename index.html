<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Stable Forum</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; position: relative; }
        .reply-item { margin-top: 10px; padding: 10px; background: #f8fbff; border-right: 4px solid #cbd5e0; border-radius: 6px; }
        .depth-1 { margin-right: 40px; border-right-color: var(--accent); }
        .depth-2 { margin-right: 80px; border-right-color: #2c3e50; }

        .admin-badge { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-left: 8px; display: inline-block; vertical-align: middle; }
        .user-tag { font-weight: 800; color: var(--dark); }
        .time-tag { font-size: 0.75rem; color: #999; margin-right: 10px; }
        .action-link { color: #3498db; cursor: pointer; font-size: 0.85rem; font-weight: bold; margin-top: 5px; display: inline-block; }
        .del-icon { color: var(--error); cursor: pointer; float: left; border: none; background: none; font-size: 1.1rem; padding: 0; }
        
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: inherit; }
        .btn-send { background: var(--accent); color: var(--dark); padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa fa-link"></i><br><small>קישור לצ'רמט</small><br><b id="link-status">בבדיקה...</b></div>
        <div class="stat-card"><i class="fa fa-mountain"></i><br><small>מסלולים</small><br><b>109</b></div>
        <div class="stat-card"><i class="fa fa-wind"></i><br><small>מעליות</small><br><b>47</b></div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים הקרובים</h3>
        <table>
            <thead><tr><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <hr>
        <textarea id="f-input" placeholder="כתוב פוסט חדש..."></textarea>
        <button class="btn-send" onclick="sendPost()">פרסם פוסט</button>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }};

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    const ADMIN_EMAIL = 'ykrauss1@gmail.com';

    window.onload = () => { renderHeader(); loadW(); loadF(); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            const isAdmin = user.email === ADMIN_EMAIL;
            area.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px;">
                    ${isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}
                    <span>שלום, <b>${user.name}</b></span>
                    <button onclick="logout()" style="background:none; border:none; color:white; cursor:pointer; text-decoration:underline; font-size:0.8rem;">התנתק</button>
                </div>`;
        } else {
            area.innerHTML = `<button class="btn-send" onclick="login()">כניסה</button>`;
        }
    }

    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            const today = new Date().setHours(0,0,0,0);
            const future = d.forecast.filter(f => new Date(f.date) >= today).slice(0,4);
            document.getElementById('w-body').innerHTML = future.map(f => `
                <tr>
                    <td><b>${f.date.split('-').reverse().join('/')}</b></td>
                    <td dir="ltr">${f.temp_min}/${f.temp_max}</td>
                    <td>${f.wind}</td>
                    <td>${f.visibility}</td>
                </tr>`).join('');
        } catch(e) {}
    }

    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const currentUserIsAdmin = user && user.email === ADMIN_EMAIL;

            let html = '';
            data.forEach(p => {
                const isPostAdmin = p.user_email === ADMIN_EMAIL;
                
                function buildTree(parentId = null, depth = 0) {
                    return (p.replies || [])
                        .filter(r => r.parent_id === parentId)
                        .sort((a,b) => new Date(a.created_at) - new Date(b.created_at))
                        .map(r => {
                            const isReplyAdmin = r.user_email === ADMIN_EMAIL;
                            return `
                            <div class="reply-item ${depth > 0 ? 'depth-' + depth : ''}">
                                ${currentUserIsAdmin ? `<button class="del-icon" onclick="delMsg('replies','${r.id}')"><i class="fa fa-trash-can"></i></button>` : ''}
                                <span class="user-tag">${isReplyAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}${r.user}</span>
                                <span class="time-tag">${new Date(r.created_at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</span>
                                <div>${r.content}</div>
                                <span class="action-link" onclick="openBox('${p.id}', '${r.user}', this, '${r.id}')">השב</span>
                                <div class="reply-target"></div>
                                ${buildTree(r.id, depth + 1).join('')}
                            </div>`;
                        }).join('');
                }

                html += `
                    <div class="post">
                        ${currentUserIsAdmin ? `<button class="del-icon" onclick="delMsg('posts','${p.id}')"><i class="fa fa-trash-can"></i></button>` : ''}
                        <span class="user-tag">${isPostAdmin ? '<span class="admin-badge">ADMIN</span>' : ''}${p.user}</span>
                        <span class="time-tag">${new Date(p.created_at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</span>
                        <div style="margin:10px 0; font-weight:bold; font-size:1.1rem;">${p.content}</div>
                        <span class="action-link" onclick="openBox('${p.id}', '${p.user}', this, null)">השב</span>
                        <div class="reply-target"></div>
                        <div class="replies-list">${buildTree(null, 0)}</div>
                    </div>`;
            });
            document.getElementById('f-container').innerHTML = html;
        } catch(e) { console.error(e); }
    }

    async function sendPost() {
        const c = document.getElementById('f-input').value;
        if(!user) return login();
        if(!c.trim()) return;
        const res = await fetch(`${API}/posts`, { 
            method:'POST', 
            headers: HEAD.headers, 
            body: JSON.stringify({user: user.name, content: c, user_email: user.email}) 
        });
        if(res.ok) { document.getElementById('f-input').value = ''; loadF(); }
    }

    async function sendReply(pId, pParentId) {
        const c = document.querySelector(`#temp-in-${pId}`).value;
        if(!user) return login();
        if(!c.trim()) return;
        const res = await fetch(`${API}/replies`, { 
            method:'POST', 
            headers: HEAD.headers, 
            body: JSON.stringify({post_id: pId, user: user.name, content: c, parent_id: pParentId, user_email: user.email}) 
        });
        if(res.ok) loadF();
    }

    async function delMsg(table, id) {
        if(!confirm("למחוק לצמיתות?")) return;
        const r = await fetch(`${API}/${table}?id=eq.${id}`, { 
            method: 'DELETE', 
            headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}` } 
        });
        if(r.ok) loadF();
    }

    function openBox(pId, toUser, el, parentId) {
        const target = el.nextElementSibling;
        if(target.innerHTML !== '') { target.innerHTML = ''; return; }
        document.querySelectorAll('.reply-target').forEach(t => t.innerHTML = '');
        target.innerHTML = `<div style="margin:10px 0; background:#eee; padding:10px; border-radius:5px;">
            <textarea id="temp-in-${pId}">@${toUser}: </textarea>
            <button class="btn-send" onclick="sendReply('${pId}', ${parentId ? `'${parentId}'` : 'null'})">שלח</button>
        </div>`;
    }

    function login() {
        const n = prompt("שם:"); const e = prompt("אימייל:");
        if(n && e) { user = {name:n, email:e}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); }
    }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

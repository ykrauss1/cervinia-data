<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - The Original Restored</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #e0e6ed; --error: #e74c3c; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        nav { background: var(--primary); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 2000; }
        .logo-text { font-size: 1.8em; font-weight: 900; }
        .logo-text span { color: var(--accent); }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }

        /* The 3 Black Rectangles (Concrete) */
        .live-status-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .status-item { background: #0d1b3e; color: white; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .status-val { font-size: 1.5em; font-weight: bold; color: var(--error); }

        /* The Beautiful Table Restored */
        .forecast-table { width: 100%; border-collapse: collapse; }
        .forecast-table th { background: #f8fafc; padding: 12px; border-bottom: 2px solid #ddd; text-align: center; }
        .forecast-table td { padding: 15px; border-bottom: 1px solid #eee; text-align: center; }
        .ltr { direction: ltr; display: inline-block; }

        /* Forum Nesting */
        .post-box { border-bottom: 2px solid #edf2f7; padding: 20px 0; }
        .reply-item { margin-right: 40px; margin-top: 10px; padding: 12px; background: #f1f5f9; border-radius: 8px; border-right: 4px solid var(--accent); }
        .action-bar { margin-top: 10px; display: flex; gap: 15px; }
        .btn-link { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: bold; font-size: 0.85em; }
        .btn-del { color: var(--error); }

        /* Professional Auth Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 350px; position: relative; }
        .field { margin-bottom: 15px; position: relative; }
        .field label { display: block; margin-bottom: 5px; font-weight: bold; }
        .field input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .eye { position: absolute; left: 10px; top: 35px; cursor: pointer; color: #888; }
        .btn-main { width: 100%; background: var(--primary); color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Buttons Order */
        .btn-row { display: flex; flex-direction: row-reverse; gap: 10px; margin-top: 10px; justify-content: flex-end; }
        .btn-s { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-send { background: var(--accent); color: var(--primary); }
    </style>
</head>
<body>

<nav>
    <div class="logo-text">Cervinia<span>Live</span></div>
    <div id="nav-controls"><button class="btn-s btn-send" onclick="toggleModal(true)">כניסה / הרשמה</button></div>
</nav>

<div class="container">
    <div class="live-status-bar">
        <div class="status-item"><i class="fa-solid fa-link"></i><div class="status-val">פתוח</div><small>קישור לצ'רמט</small></div>
        <div class="status-item"><i class="fa-solid fa-route"></i><div class="status-val">54/72</div><small>מסלולים פתוחים</small></div>
        <div class="status-item"><i class="fa-solid fa-cable-car"></i><div class="status-val">18/22</div><small>מעליות פתוחות</small></div>
    </div>

    <div class="card">
        <h3>תחזית וסטטוס אתר</h3>
        <table class="forecast-table">
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>טמפרטורה</th>
                    <th>רוח</th>
                    <th>ראות</th>
                    <th>סטטוס</th>
                </tr>
            </thead>
            <tbody id="forecast-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="forum-display">טוען הודעות...</div>
        <div style="margin-top:20px;">
            <textarea id="main-input" rows="2" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;" placeholder="כתוב עדכון..."></textarea>
            <div class="btn-row"><button class="btn-s btn-send" onclick="addPost()">פרסם פוסט</button></div>
        </div>
    </div>
</div>

<div id="auth-modal" class="modal">
    <div class="modal-content">
        <h2 id="m-title">כניסה / הרשמה</h2>
        <div class="field">
            <label>אימייל</label>
            <input type="email" id="m-email">
        </div>
        <div class="field">
            <label>שם (חובה ל-ADMIN)</label>
            <input type="text" id="m-name">
        </div>
        <div class="field">
            <label>סיסמה</label>
            <input type="password" id="m-pass">
            <i class="fa-solid fa-eye eye" onclick="togglePass('m-pass')"></i>
        </div>
        <div class="field">
            <label>אימות סיסמה</label>
            <input type="password" id="m-confirm">
            <i class="fa-solid fa-eye eye" onclick="togglePass('m-confirm')"></i>
        </div>
        <button class="btn-main" onclick="handleLogin()">אישור</button>
        <button class="btn-s" style="width:100%; margin-top:10px;" onclick="toggleModal(false)">ביטול (ESC)</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    async function loadAll() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            document.getElementById('forecast-body').innerHTML = data.forecast.slice(0, 4).map(d => {
                // תאריך ישראלי
                const parts = d.date.split(/[-/]/);
                const isYearFirst = parts[0].length === 4;
                const formattedDate = isYearFirst ? `${parts[2]}/${parts[1]}/${parts[0]}` : d.date;

                return `<tr>
                    <td><b>${formattedDate}</b></td>
                    <td class="ltr" style="font-weight:bold; color:red;">${d.temp_min}/${d.temp_max}°C</td>
                    <td class="ltr">${d.wind.replace('km/h','')} קמ"ש</td>
                    <td>${d.visibility || 'טובה'}</td>
                    <td style="color:green; font-weight:bold">פתוח</td>
                </tr>`;
            }).join('');
        } catch(e) { console.error(e); }
        fetchPosts();
    }

    async function fetchPosts() {
        const { data: posts } = await _supabase.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
        if (!posts) return;
        const isAdmin = user && (user.email === 'ykrauss1@gmail.com' || user.name === 'ADMIN');

        document.getElementById('forum-display').innerHTML = posts.map(p => {
            const reps = (p.replies || []).map(r => `
                <div class="reply-item">
                    <b>${r.user}:</b> <div>${r.content}</div>
                    <div class="action-bar">
                        <button class="btn-link" onclick="openReply('${p.id}', '${r.id}')">השב</button>
                        ${isAdmin ? `<button class="btn-link btn-del" onclick="delItem('replies','${r.id}')">מחק</button>` : ''}
                    </div>
                    <div id="box-${r.id}"></div>
                </div>`).join('');

            return `<div class="post-box">
                <b>${p.user}:</b> <div>${p.content}</div>
                <div class="action-bar">
                    <button class="btn-link" onclick="openReply('${p.id}', '${p.id}')">השב</button>
                    ${isAdmin ? `<button class="btn-link btn-del" onclick="delItem('posts','${p.id}')">מחק פוסט</button>` : ''}
                </div>
                <div id="box-${p.id}"></div>
                <div class="replies-list">${reps}</div>
            </div>`;
        }).join('');
    }

    function toggleModal(show) { document.getElementById('auth-modal').style.display = show ? 'flex' : 'none'; }
    function togglePass(id) { const i = document.getElementById(id); i.type = i.type === 'password' ? 'text' : 'password'; }
    
    window.addEventListener('keydown', e => { 
        if(e.key === 'Escape') {
            toggleModal(false);
            document.querySelectorAll('.reply-box-inline').forEach(el => el.remove());
        }
    });

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cervinia Live - Dashboard & Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --accent: #0284c7; --bg: #f1f5f9; --white: #ffffff; --slate: #1e293b; }
        body { background: var(--bg); font-family: system-ui, sans-serif; margin: 0; color: var(--slate); direction: rtl; }
        nav { background: white; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); sticky: top; z-index: 1000; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 25px; border-radius: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .hero { background: linear-gradient(135deg, #075985 0%, #0369a1 100%); color: white; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .temp-badge { background: #e0f2fe; color: #0369a1; padding: 5px 15px; border-radius: 12px; font-weight: 800; font-size: 1.3rem; }
        .btn-auth { background: var(--slate); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        
        /* Modal Style */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
        .input-field { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border-bottom: 1px solid #f1f5f9; text-align: center; }
        .cam-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
        .cam-grid img { width: 100%; border-radius: 18px; border: 2px solid white; }
    </style>
</head>
<body>

<nav>
    <div style="font-size: 1.5rem; font-weight: 900;">Cervinia<span>Live</span></div>
    <div id="auth-section">
        <span id="user-email" style="margin-left:10px; font-weight:600;"></span>
        <button id="login-btn" class="btn-auth" onclick="toggleModal(true)">התחברות</button>
    </div>
</nav>

<div class="container">
    <div class="card hero">
        <h2 style="margin:0; opacity:0.9;">סיכוי לפתיחת קישור לזארמט</h2>
        <div id="p-link" style="font-size: 2.2rem; font-weight: 900; margin: 10px 0;">טוען...</div>
    </div>

    <div class="grid">
        <div class="card">
            <span id="d-temp" class="temp-badge">--°C</span>
            <h3>צ'רביניה (Live)</h3>
            <div id="c-lifts" style="font-size: 1.8rem; font-weight: 800; direction: ltr;">--/--</div>
        </div>
        <div class="card">
            <h3>וולטורננש</h3>
            <div id="z-status" style="font-weight:bold; font-size: 1.2rem;">בבדיקה...</div>
        </div>
    </div>

    <div class="card">
        <h3>📅 תחזית 4 ימים (Plateau Rosa)</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>תאריך</th>
                        <th>טמפ'</th>
                        <th>רוח</th>
                        <th>ראות</th>
                        <th>סיכוי</th>
                    </tr>
                </thead>
                <tbody id="forecast-body"></tbody>
            </table>
        </div>
    </div>

    <div class="cam-grid">
        <img src="https://api.skiline.cc/panodata/webcam/635/snapshot" referrerpolicy="no-referrer">
        <img src="https://api.skiline.cc/panodata/webcam/634/snapshot" referrerpolicy="no-referrer">
    </div>
</div>

<div id="authModal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title">התחברות למערכת</h2>
        <input type="email" id="email" class="input-field" placeholder="אימייל">
        <input type="password" id="password" class="input-field" placeholder="סיסמה">
        <button class="btn-auth" style="width:100%; margin-top:10px;" onclick="handleAuth()">אישור</button>
        <button onclick="toggleModal(false)" style="background:none; border:none; color:gray; margin-top:15px; cursor:pointer;">ביטול</button>
    </div>
</div>

<script>
    // הגדרות Supabase
    const SB_URL = "https://cdgqodtbdhsqkvcgcdlm.supabase.co";
    const SB_KEY = "sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g";
    const supabase = supabase.createClient(SB_URL, SB_KEY);

    // ניהול מודל
    function toggleModal(show) {
        document.getElementById('authModal').style.display = show ? 'flex' : 'none';
    }

    // פונקציית התחברות
    async function handleAuth() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
            alert("שגיאה: " + error.message);
        } else {
            toggleModal(false);
            checkUser();
        }
    }

    // בדיקת משתמש מחובר
    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            document.getElementById('user-email').innerText = user.email;
            document.getElementById('login-btn').innerText = "התנתק";
            document.getElementById('login-btn').onclick = async () => {
                await supabase.auth.signOut();
                location.reload();
            };
        }
    }

    // עדכון נתונים
    async function update() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const d = await res.json();
            
            document.getElementById('p-link').innerText = d.wind_prediction;
            document.getElementById('d-temp').innerText = d.temp;
            document.getElementById('c-lifts').innerText = d.cervinia.lifts;
            document.getElementById('z-status').innerText = d.conn === 'open' ? "קישור פתוח ✅" : "קישור סגור 🚫";
            
            if(d.forecast) {
                document.getElementById('forecast-body').innerHTML = d.forecast.map(day => `
                    <tr>
                        <td style="font-weight:bold;">${day.date}</td>
                        <td style="direction:ltr;">${day.temp_min} / ${day.temp_max}</td>
                        <td style="direction:ltr;">${day.wind}</td>
                        <td>${day.status === 'Clear' ? '☀️ בהיר' : '☁️ ערפל'}</td>
                        <td style="color:${day.link_prob === 'High' ? 'green' : 'orange'}; font-weight:bold;">${day.link_prob}</td>
                    </tr>
                `).join('');
            }
        } catch (e) { console.log("טוען נתונים..."); }
    }

    window.onload = () => {
        update();
        checkUser();
    };
</script>
</body>
</html>

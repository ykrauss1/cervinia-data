<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Bypass Version</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .nested { margin-right: 40px; margin-top: 10px; border-right: 3px solid var(--accent); padding: 10px; background: #f9f9f9; border-radius: 5px; }
        .btn-row { display: flex; flex-direction: row-reverse; gap: 10px; margin-top: 10px; }
        .btn { padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-send { background: var(--accent); color: var(--dark); }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-ui">טוען...</div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa-solid fa-link"></i><br><small>סטטוס קישור</small><br><b>פתוח</b></div>
        <div class="stat-card"><i class="fa-solid fa-person-skiing"></i><br><small>מסלולים</small><br><b>58 / 72</b></div>
        <div class="stat-card"><i class="fa-solid fa-wind"></i><br><small>רוח פסגה</small><br><b>12 קמ"ש</b></div>
    </div>

    <div class="card">
        <h3>תחזית וסטטוס (DD/MM/YYYY)</h3>
        <table>
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>טמפרטורה</th>
                    <th>רוח</th>
                    <th>ראות</th>
                    <th>סטטוס</th>
                </tr>
            </thead>
            <tbody id="w-table"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-list">מתחבר בשיטה עוקפת...</div>
        <div style="margin-top:20px; border-top: 1px solid #eee; padding-top:20px;">
            <textarea id="f-msg" style="width:100%; height:60px; padding:10px; border-radius:5px; border:1px solid #ddd;" placeholder="כתוב עדכון..."></textarea>
            <div class="btn-row"><button class="btn btn-send" onclick="postMain()">פרסם</button></div>
        </div>
    </div>
</div>

<script>
    const S_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const S_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEADERS = { 'apikey': S_KEY, 'Authorization': `Bearer ${S_KEY}`, 'Content-Type': 'application/json' };

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    window.onload = () => {
        renderAuth();
        loadW();
        loadF();
    };

    function renderAuth() {
        document.getElementById('auth-ui').innerHTML = user ? 
            `שלום, ${user.name} | <a href="#" onclick="logout()" style="color:white">התנתק</a>` :
            `<button class="btn btn-send" onclick="login()">כניסה</button>`;
    }

    function login() {
        const n = prompt("שם משתמש:");
        if(n) {
            user = { name: n };
            localStorage.setItem('skiUser', JSON.stringify(user));
            location.reload();
        }
    }

    function logout() { localStorage.clear(); location.reload(); }

    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            document.getElementById('w-table').innerHTML = d.forecast.slice(0,4).map(f => {
                let dt = f.date.includes('-') ? f.date.split('-').reverse().join('/') : f.date;
                let tMin = f.temp_min.replace(/[^\d.-]/g, '');
                let tMax = f.temp_max.replace(/[^\d.-]/g, '');
                let wind = f.wind.replace(/[^\d.]/g, '');
                return `<tr><td><b>${dt}</b></td><td style="color:red">${tMin}°/${tMax}°C</td><td>${wind} קמ"ש</td><td>${f.visibility || 'טובה'}</td><td style="color:green">פתוח</td></tr>`;
            }).join('');
        } catch(e) {}
    }

    // שימוש ב-Fetch ישיר לעקיפת חסימות
    async function loadF() {
        try {
            const res = await fetch(`${S_URL}/posts?select=*,replies(*)&order=created_at.desc`, { headers: HEADERS });
            if(!res.ok) throw new Error();
            const data = await res.json();
            document.getElementById('f-list').innerHTML = data.map(p => {
                const rs = (p.replies || []).map(r => `<div class="nested"><b>${r.user}:</b> ${r.content}</div>`).join('');
                return `<div class="post"><b>${p.user}:</b> ${p.content} <div style="font-size:0.8rem; color:blue; cursor:pointer;" onclick="openRep('${p.id}')">השב</div><div id="target-${p.id}"></div>${rs}</div>`;
            }).join('');
        } catch(e) {
            document.getElementById('f-list').innerHTML = `<div style="color:red">החיבור נחסם על ידי הדפדפן. נסה לבטל חוסם פרסומות או לגלוש מ-Incognito.</div>`;
        }
    }

    async function postMain() {
        if(!user) return login();
        const txt = document.getElementById('f-msg').value;
        if(!txt.trim()) return;
        await fetch(`${S_URL}/posts`, { method: 'POST', headers: HEADERS, body: JSON.stringify({ user: user.name, content: txt }) });
        document.getElementById('f-msg').value = "";
        loadF();
    }

    function openRep(pId) {
        if(!user) return login();
        document.getElementById('target-' + pId).innerHTML = `<div class="btn-row"><textarea id="ti-${pId}" style="width:100%"></textarea><button class="btn btn-send" onclick="sendRep('${pId}')">שלח</button></div>`;
    }

    async function sendRep(pId) {
        const val = document.getElementById('ti-' + pId).value;
        if(!val.trim()) return;
        await fetch(`${S_URL}/replies`, { method: 'POST', headers: HEADERS, body: JSON.stringify({ post_id: pId, user: user.name, content: val }) });
        loadF();
    }
</script>
</body>
</html>

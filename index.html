<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cervinia Status</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding-top: 50px; }
        .card { background: #333; border-radius: 20px; padding: 30px; display: inline-block; width: 300px; border: 2px solid #444; }
        .val { font-size: 40px; font-weight: bold; margin: 10px 0; color: #4db8ff; }
        .label { font-size: 14px; color: #aaa; text-transform: uppercase; }
        #update-time { font-size: 12px; color: #666; margin-top: 20px; }
        button { background: #4db8ff; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="label">Lifts Open</div>
        <div id="lifts" class="val">--/--</div>
        
        <div class="label">Zermatt Link</div>
        <div id="conn" class="val">Checking</div>
        
        <div id="update-time">Waiting for data...</div>
        
        <button onclick="updateData()">Refresh Now</button>
    </div>

    <script>
        async function updateData() {
            console.log("Fetching started...");
            try {
                // שימוש ב-timestamp כדי למנוע Cache מהקובץ עצמו
                const url = 'https://raw.githubusercontent.com/ykrauss1/cervinia-data/main/data.json?cb=' + Date.now();
                const res = await fetch(url);
                if (!res.ok) throw new Error("File not found on GitHub");
                
                const data = await res.json();
                console.log("Data received:", data);

                document.getElementById('lifts').innerText = data.lifts || "N/A";
                document.getElementById('conn').innerText = (data.conn || "N/A").toUpperCase();
                document.getElementById('update-time').innerText = "Last update: " + (data.lastUpdate || "Unknown");
                
                // צבע לפי סטטוס
                if(data.conn && data.conn.toLowerCase() === 'open') {
                    document.getElementById('conn').style.color = "#00ff88";
                } else {
                    document.getElementById('conn').style.color = "#ff4d4d";
                }

            } catch (err) {
                console.error("Error:", err);
                document.getElementById('update-time').innerText = "ERROR: " + err.message;
            }
        }

        // הפעלה מיידית
        updateData();
    </script>
</body>
</html>

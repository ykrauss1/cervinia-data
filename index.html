<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Admin & Replies Active</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #ff4d4d; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }

        /* שלד נעול */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }

        /* פורום וקינון */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; }
        .nested-reply { margin-right: 40px; margin-top: 10px; border-right: 4px solid var(--accent); padding: 10px; background: #f9f9f9; border-radius: 5px; }
        .user-name { font-weight: bold; color: var(--dark); }
        
        /* כפתורים וסל מחיקה */
        .btn-row { display: flex; flex-direction: row-reverse; gap: 10px; margin-top: 10px; }
        .btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-send { background: var(--accent); color: var(--dark); }
        .btn-cancel { background: #eee; color: #555; }
        .del-btn { color: var(--error); cursor: pointer; font-size: 0.9rem; margin-right: 10px; background: none; border: none; }

        /* מודאל כניסה משופר */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 340px; position: relative; }
        .field { margin-bottom: 12px; position: relative; }
        .field input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .eye { position: absolute; left: 10px; top: 12px; cursor: pointer; color: #888; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-ui"><button class="btn btn-send" onclick="openModal(true)">כניסה / הרשמה</button></div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa-solid fa-link"></i><br><small>סטטוס קישור</small><br><b>פתוח</b></div>
        <div class="stat-card"><i class="fa-solid fa-person-skiing"></i><br><small>מסלולים</small><br><b>58 / 72</b></div>
        <div class="stat-card"><i class="fa-solid fa-wind"></i><br><small>רוח פסגה</small><br><b>12 קמ"ש</b></div>
    </div>

    <div class="card">
        <h3>תחזית (DD/MM/YYYY)</h3>
        <table>
            <thead><tr><th>תאריך</th><th>טמפרטורה</th><th>רוח</th><th>ראות</th><th>סטטוס</th></tr></thead>
            <tbody id="w-table"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-list">טוען פורום...</div>
        <div style="margin-top:20px; border-top: 1px solid #eee; padding-top:20px;">
            <textarea id="f-msg" style="width:100%; height:60px; padding:10px; border-radius:5px; border:1px solid #ddd;" placeholder="כתוב עדכון..."></textarea>
            <div class="btn-row"><button class="btn btn-send" onclick="postMain()">פרסם פוסט</button></div>
        </div>
    </div>
</div>

<div id="auth-modal" class="modal">
    <div class="modal-content">
        <h2 id="m-title" style="margin-top:0">כניסה</h2>
        <div class="field"><input type="email" id="m-email" placeholder="אימייל"></div>
        <div class="field" id="m-name-group" style="display:none;"><input type="text" id="m-name" placeholder="שם מלא (יופיע בפורום)"></div>
        <div class="field">
            <input type="password" id="m-pass" placeholder="סיסמה">
            <i class="fa fa-eye eye" onclick="const p=document.getElementById('m-pass'); p.type=p.type==='password'?'text':'password'"></i>
        </div>
        <button class="btn btn-send" style="width:100%" onclick="doAuth()">אישור</button>
        <p onclick="toggleReg()" id="m-toggle" style="text-align:center; color:blue; cursor:pointer; font-size:0.9rem; margin-top:12px;">אין לך חשבון? הירשם כאן</p>
        <button class="btn btn-cancel" style="width:100%; margin-top:10px;" onclick="openModal(false)">ביטול</button>
    </div>
</div>

<script>
    const S_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const S_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEADERS = { 'apikey': S_KEY, 'Authorization': `Bearer ${S_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    let isReg = false;

    window.onload = () => {
        updateUI();
        loadW();
        loadF();
    };

    function updateUI() {
        if(user) document.getElementById('auth-ui').innerHTML = `<span>שלום, <b>${user.name}</b></span> <button class="btn btn-cancel" onclick="logout()">התנתק</button>`;
    }

    function openModal(s) { document.getElementById('auth-modal').style.display = s ? 'flex' : 'none'; }
    function toggleReg() { 
        isReg = !isReg; 
        document.getElementById('m-title').innerText = isReg ? 'הרשמה' : 'כניסה';
        document.getElementById('m-name-group').style.display = isReg ? 'block' : 'none';
        document.getElementById('m-toggle').innerText = isReg ? 'יש לך חשבון? כנס' : 'אין לך חשבון? הירשם';
    }

    function doAuth() {
        const email = document.getElementById('m-email').value;
        const nameInput = document.getElementById('m-name').value;
        if(email) {
            user = { email: email, name: isReg ? nameInput : email.split('@')[0] };
            localStorage.setItem('skiUser', JSON.stringify(user));
            location.reload();
        }
    }
    function logout() { localStorage.clear(); location.reload(); }

    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            document.getElementById('w-table').innerHTML = d.forecast.slice(0,4).map(f => {
                let dt = f.date.includes('-') ? f.date.split('-').reverse().join('/') : f.date;
                return `<tr><td><b>${dt}</b></td><td style="color:red;direction:ltr">${f.temp_min.replace(/[^\d.-]/g, '')}°/${f.temp_max.replace(/[^\d.-]/g, '')}°C</td><td style="direction:ltr">${f.wind.replace(/[^\d.]/g, '')} קמ"ש</td><td>${f.visibility || 'טובה'}</td><td style="color:green;font-weight:bold">פתוח</td></tr>`;
            }).join('');
        } catch(e) {}
    }

    async function loadF() {
        try {
            const res = await fetch(`${S_URL}/posts?select=*,replies(*)&order=created_at.desc`, { headers: HEADERS });
            const data = await res.json();
            const isAdmin = user && user.email === 'ykrauss1@gmail.com';

            document.getElementById('f-list').innerHTML = data.map(p => {
                const rs = (p.replies || []).map(r => `
                    <div class="nested-reply">
                        <span class="user-name">${r.user}:</span> ${r.content}
                        ${isAdmin ? `<button class="del-btn" onclick="del('replies','${r.id}')"><i class="fa fa-trash"></i></button>` : ''}
                    </div>`).join('');

                return `
                    <div class="post">
                        <span class="user-name">${p.user}:</span> ${p.content}
                        <div class="btn-row" style="margin-top:5px; justify-content: flex-start; flex-direction: row;">
                            <span style="color:blue; cursor:pointer; font-size:0.85rem;" onclick="openRep('${p.id}')">השב</span>
                            ${isAdmin ? `<button class="del-btn" onclick="del('posts','${p.id}')"><i class="fa fa-trash"></i> מחק פוסט</button>` : ''}
                        </div>
                        <div id="target-${p.id}"></div>
                        ${rs}
                    </div>`;
            }).join('');
        } catch(e) { document.getElementById('f-list').innerText = "שגיאת טעינה."; }
    }

    async function postMain() {
        if(!user) return openModal(true);
        const txt = document.getElementById('f-msg').value;
        if(!txt.trim()) return;
        await fetch(`${S_URL}/posts`, { method: 'POST', headers: HEADERS, body: JSON.stringify({ user: user.name, content: txt }) });
        document.getElementById('f-msg').value = "";
        loadF();
    }

    function openRep(pId) {
        if(!user) return openModal(true);
        document.getElementById('target-' + pId).innerHTML = `
            <div style="margin:10px 0">
                <textarea id="ti-${pId}" style="width:100%; border-radius:5px; border:1px solid var(--accent); padding:5px;"></textarea>
                <div class="btn-row">
                    <button class="btn btn-send" onclick="sendRep('${pId}')">שלח</button>
                    <button class="btn btn-cancel" onclick="this.parentElement.parentElement.remove()">ביטול</button>
                </div>
            </div>`;
    }

    async function sendRep(pId) {
        const val = document.getElementById('ti-' + pId).value;
        if(!val.trim()) return;
        await fetch(`${S_URL}/replies`, { method: 'POST', headers: HEADERS, body: JSON.stringify({ post_id: pId, user: user.name, content: val }) });
        loadF();
    }

    async function del(tbl, id) {
        if(confirm("למחוק?")) {
            await fetch(`${S_URL}/${tbl}?id=eq.${id}`, { method: 'DELETE', headers: HEADERS });
            loadF();
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- ספריות חיצוניות -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>

    <!-- HEADER -->
    <nav>
        <div style="font-size:1.5rem; font-weight:bold;">
            Cervinia<span style="color:var(--accent)">Live</span>
        </div>
        <div id="auth-area"></div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container">

        <!-- SERVICES -->
        <div class="services-grid">
            <div class="service-btn" onclick="openM('hotelModal')"><i class="fa-solid fa-hotel"></i> אירוח</div>
            <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-schools')"><i class="fa-solid fa-graduation-cap"></i> הדרכה</div>
            <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-rental')"><i class="fa-solid fa-person-skiing"></i> השכרת ציוד</div>
            <div class="service-btn" onclick="openM('mapModal')"><i class="fa-solid fa-map-location-dot"></i> מפות</div>
        </div>

        <!-- WEATHER -->
        <div class="card">
            <h3>תחזית וצפי (מהיום ולארבעה ימים קדימה)</h3>
            <table>
                <thead>
                    <tr>
                        <th>צפי</th>
                        <th>תאריך</th>
                        <th>טמפ'</th>
                        <th>רוח</th>
                        <th>ראות</th>
                    </tr>
                </thead>
                <tbody id="w-body"></tbody>
            </table>
        </div>

        <!-- FORUM -->
        <div class="card">
            <h3>עדכונים מהשטח</h3>
            <div id="f-container">טוען הודעות...</div>

            <div class="forum-input-box">
                <textarea id="f-input" rows="3" placeholder="מה קורה בצרביניה?"></textarea>
                <div class="forum-footer">
                    <div class="forum-icons">
                        <span onclick="document.getElementById('f-input').value=''">בטל</span>
                        <i class="fa-solid fa-paperclip"></i>
                    </div>
                    <button class="service-btn" onclick="sendPost()">פרסם</button>
                </div>
            </div>
        </div>

    </div>

    <!-- MODALS -->
    <div id="authModal" class="modal"></div>
    <div id="hotelModal" class="modal"></div>
    <div id="mapModal" class="modal"></div>

    <!-- JS FILES -->
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/forum.js"></script>
    <script src="js/maps.js"></script>
    <script src="js/main.js"></script>

</body>
</html>

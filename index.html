<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Concrete Build v9</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        /* --- GLOBAL --- */
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; --warning: #f1c40f; }
        body { font-family: 'Segoe UI', system-ui; background: var(--bg); margin: 0; direction: rtl; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        input, textarea { direction: rtl !important; text-align: right !important; unicode-bidi: plaintext !important; }

        /* --- NAV MODULE --- */
        #nav-header { background: var(--dark); color: white; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; }
        .admin-badge { background: var(--error); color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; margin-left: 10px; }

        /* --- STATS MODULE --- */
        #stats-section { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 15px; border-radius: 12px; text-align: center; }

        /* --- SERVICES MODULE --- */
        #services-section { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
        .service-btn { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* --- WEATHER MODULE --- */
        #weather-module .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #weather-module table { width: 100%; border-collapse: collapse; }
        #weather-module th, #weather-module td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }

        /* --- FORUM MODULE --- */
        #forum-module .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 25px; }
        .post { border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 15px; position: relative; background: white; }
        .reply-item { margin-top: 8px; padding: 10px; background: #f8fbff; border-right: 3px solid var(--accent); border-radius: 4px; }
        .forum-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .forum-icons { display: flex; align-items: center; gap: 15px; color: #666; }

        /* --- MODALS --- */
        .modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 20px; position: relative; }
        .close-modal { position: absolute; left: 20px; top: 20px; cursor: pointer; font-size: 1.5rem; color: #666; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
    </style>
</head>
<body>

<nav id="nav-header">
    <div style="font-size:1.5rem; font-weight:bold;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <section id="stats-section">
        <div class="stat-card"><small>טמפ'</small><br><b id="stat-temp">--</b></div>
        <div class="stat-card"><small>מסלולים</small><br><b id="stat-slopes">--</b></div>
        <div class="stat-card"><small>מעליות</small><br><b id="stat-lifts">--</b></div>
        <div class="stat-card"><small>סטטוס</small><br><b id="stat-conn">--</b></div>
    </section>

    <section id="services-section">
        <div class="service-btn" onclick="openM('hotelModal')"><i class="fa-solid fa-hotel"></i> אירוח</div>
        <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-schools')"><i class="fa-solid fa-graduation-cap"></i> הדרכה</div>
        <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-rental')"><i class="fa-solid fa-person-skiing"></i> השכרת ציוד</div>
        <div class="service-btn" onclick="openM('mapModal')"><i class="fa-solid fa-map-location-dot"></i> מפות</div>
    </section>

    <section id="weather-module">
        <div class="card">
            <h3>תחזית וצפי (4 ימים קרובים)</h3>
            <table>
                <thead><tr><th>צפי</th><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
                <tbody id="w-body"></tbody>
            </table>
        </div>
    </section>

    <section id="forum-module">
        <div class="card">
            <h3>עדכונים מהשטח</h3>
            <div id="f-container">טוען הודעות...</div>
            <div style="background: #f1f3f5; padding: 20px; border-radius: 12px; margin-top: 20px;">
                <textarea id="f-input" rows="3" placeholder="מה קורה בצרביניה?" style="width:100%; border:1px solid #ddd; border-radius:8px; padding:10px;"></textarea>
                <div class="forum-footer">
                    <div class="forum-icons">
                        <span style="cursor:pointer; font-weight:bold;" onclick="document.getElementById('f-input').value=''">בטל</span>
                        <i class="fa-solid fa-paperclip" style="cursor:pointer; font-size:1.2rem;"></i>
                    </div>
                    <button class="service-btn" style="background:var(--accent); color:white; border:none; padding:10px 30px;" onclick="sendPost()">פרסם</button>
                </div>
            </div>
        </div>
    </section>
</div>

<div id="authModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeM('authModal')">×</span>
        <h3 style="text-align:center;">כניסה למערכת</h3>
        <input type="text" id="authName" class="form-control" placeholder="שם מלא">
        <input type="email" id="authEmail" class="form-control" placeholder="אימייל">
        <input type="password" id="authPass" class="form-control" placeholder="סיסמה">
        <button class="service-btn" style="width:100%; background:var(--accent); color:white; border:none;" onclick="handleAuth()">התחברות / רישום</button>
    </div>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeM('hotelModal')">×</span>
        <h3>חיפוש אירוח</h3>
        <input type="text" id="dateRange" class="form-control" placeholder="בחר תאריכים...">
        <button class="service-btn" style="width:100%; background:var(--accent); color:white; border:none;" onclick="alert('מחפש מלונות...')">חפש ב-Booking</button>
    </div>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content" style="max-width:800px;">
        <span class="close-modal" onclick="closeM('mapModal')">×</span>
        <h3>מפות האזור</h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <button class="service-btn" onclick="window.open('https://raw.githubusercontent.com/ykrauss/Cervinia/main/slopesmap.pdf')">מפת מסלולים</button>
            <button class="service-btn" onclick="window.open('https://raw.githubusercontent.com/ykrauss/Cervinia/main/town.pdf')">מפת העיירה</button>
        </div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    window.onload = () => { renderHeader(); loadW(); loadF(); flatpickr("#dateRange", { mode: "range", minDate: "today" }); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) { 
            const isAdmin = (user.email === 'ykrauss1@gmail.com' || user.name === 'ADMIN');
            area.innerHTML = `<div>${isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''} <b>${user.name}</b> | <a href="#" onclick="logout()" style="color:#888;">התנתק</a></div>`; 
        } else { area.innerHTML = `<button onclick="openM('authModal')" class="service-btn" style="padding:8px 20px;">כניסה</button>`; }
    }

    async function loadW() {
        const r = await fetch('data.json?v=' + Date.now());
        const d = await r.json();
        document.getElementById('stat-temp').innerText = d.temp.replace('--', '-') + '°C';
        document.getElementById('stat-slopes').innerText = d.slopes;
        document.getElementById('stat-lifts').innerText = d.lifts;
        document.getElementById('stat-conn').innerText = d.conn === 'open' ? 'פתוח' : 'סגור';

        const filtered = d.forecast.filter(f => parseInt(f.date.split('.')[0]) >= 14).slice(0, 4);
        document.getElementById('w-body').innerHTML = filtered.map(f => {
            const wind = parseFloat(f.wind);
            const prob = wind < 32 ? {c:'var(--success)', t:'גבוה'} : (wind > 50 ? {c:'var(--error)', t:'נמוך'} : {c:'var(--warning)', t:'בינוני'});
            return `<tr><td style="color:${prob.c}; font-weight:bold;">${prob.t}</td><td>${f.date}</td><td style="direction:ltr;">${f.temp_min.replace('--','-')}/${f.temp_max.replace('--','-')}</td><td>${f.wind}</td><td>${f.visibility}</td></tr>`;
        }).join('');
    }

    async function loadF() {
        const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
        const data = await res.json();
        const isAdmin = user && (user.email === 'ykrauss1@gmail.com' || user.name === 'ADMIN');
        
        document.getElementById('f-container').innerHTML = data.map(p => `
            <div class="post">
                ${isAdmin ? `<span style="color:red; cursor:pointer; float:left;" onclick="del('posts','${p.id}')"><i class="fa-solid fa-trash"></i></span>` : ''}
                <b>${p.user}</b>
                <div style="margin:10px 0;">${p.content}</div>
                <span style="color:var(--accent); cursor:pointer; font-size:0.85rem; font-weight:bold;" onclick="openRBox('${p.id}', '${p.user}', this)">השב</span>
                <div class="r-target"></div>
                ${(p.replies || []).map(r => `<div class="reply-item"><b>${r.user}:</b> ${r.content}</div>`).join('')}
            </div>`).join('');
    }

    async function sendPost() {
        const v = document.getElementById('f-input').value;
        if(!user) return openM('authModal');
        if(!v.trim()) return;
        await fetch(`${API}/posts`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({user:user.name, content:v}) });
        document.getElementById('f-input').value = '';
        loadF();
    }

    function openRBox(pId, toUser, el) {
        const target = el.nextElementSibling;
        if(target.innerHTML) return target.innerHTML = '';
        target.innerHTML = `<div style="margin-top:10px;"><textarea id="in-${pId}" rows="2" style="width:100%; border:1px solid #ddd; border-radius:8px; padding:8px;">@${toUser}: </textarea>
        <button class="service-btn" style="padding:5px 15px; font-size:0.8rem; background:var(--accent); color:white; border:none; margin-top:5px;" onclick="sendR('${pId}')">שלח</button></div>`;
        setTimeout(() => { 
            const tx = document.getElementById(`in-${pId}`);
            tx.focus();
            tx.setSelectionRange(tx.value.length, tx.value.length);
        }, 50);
    }

    async function sendR(pId) {
        const v = document.getElementById(`in-${pId}`).value;
        if(!v.trim()) return;
        await fetch(`${API}/replies`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({post_id:pId, user:user.name, content:v}) });
        loadF();
    }

    async function del(tbl, id) {
        if(!confirm('למחוק?')) return;
        await fetch(`${API}/${tbl}?id=eq.${id}`, { method:'DELETE', headers: HEAD.headers });
        loadF();
    }

    function handleAuth() {
        const n = document.getElementById('authName').value;
        const e = document.getElementById('authEmail').value;
        if(n && e) { user = {name:n, email:e}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); }
    }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
    function openM(id) { document.getElementById(id).style.display='flex'; }
    function closeM(id) { document.getElementById(id).style.display='none'; }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cervinia Live 2026 - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --accent: #0284c7; --bg: #f8fafc; --success: #22c55e; --danger: #ef4444; }
        body { background: var(--bg); font-family: system-ui, sans-serif; margin: 0; direction: rtl; }
        
        /* --- Navbar & Menus (Hover Effect) --- */
        nav { background: white; border-bottom: 2px solid #e2e8f0; position: sticky; top: 0; z-index: 1000; }
        .nav-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; }
        
        .logo-wrapper { display: flex; align-items: center; gap: 12px; }
        .mountain-container { position: relative; display: inline-block; line-height: 0; }
        .fa-mountain-sun { font-size: 2rem; color: var(--accent); }
        #status-dot { position: absolute; top: -2px; right: -2px; font-size: 0.75rem; background: white; border-radius: 50%; border: 2px solid white; transition: 0.4s; color: var(--success); }

        .nav-menu { display: flex; justify-content: center; gap: 30px; padding: 10px 0; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
        .menu-item { position: relative; cursor: pointer; font-weight: bold; color: #475569; font-size: 0.95rem; padding: 5px 15px; }
        .menu-item:hover { color: var(--accent); }
        
        .dropdown { 
            position: absolute; top: 100%; right: 0; background: white; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); border-radius: 8px; 
            min-width: 200px; display: none; z-index: 100; padding: 10px 0; border: 1px solid #e2e8f0;
        }
        .menu-item:hover .dropdown { display: block; }
        .dropdown a { display: block; padding: 10px 15px; text-decoration: none; color: #334155; font-size: 0.9rem; border-bottom: 1px solid #f1f5f9; }
        .dropdown a:last-child { border: none; }
        .dropdown a:hover { background: #f8fafc; color: var(--accent); }

        /* --- Forum UI (As requested in your example) --- */
        .forum-actions { display: flex; align-items: stretch; gap: 8px; margin-top: 15px; }
        .clip-box { display: flex; align-items: center; justify-content: center; background: white; padding: 0 15px; border-radius: 10px; border: 1px solid #ddd; cursor: pointer; color: #64748b; font-size: 1.2rem; }
        .btn-publish-main { flex-grow: 1; background: var(--accent); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.1rem; }

        /* --- Layout & Cards --- */
        .live-banner { background: #1e293b; color: white; padding: 12px; display: flex; justify-content: center; gap: 20px; font-weight: bold; font-size: 0.9rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; padding: 20px; max-width: 1100px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border: 1px solid #e2e8f0; }
        .weather-val { font-size: 1.2rem; font-weight: bold; color: #1e293b; }
        
        #forum { max-width: 900px; margin: 30px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: right; }
        .post { background: #f1f5f9; padding: 15px; border-radius: 10px; margin-top: 10px; position: relative; border-right: 4px solid var(--accent); }
    </style>
</head>
<body>

    <nav>
        <div class="nav-top">
            <div class="logo-wrapper">
                <div class="mountain-container">
                    <i class="fa-solid fa-mountain-sun"></i>
                    <i id="status-dot" class="fa-solid fa-circle"></i>
                </div>
                <strong>Cervinia Live</strong>
            </div>
            <div id="update-tag" style="font-size: 0.7rem; color: #94a3b8;">מעדכן נתונים...</div>
        </div>
        
        <div class="nav-menu">
            <div class="menu-item">
                <i class="fa-solid fa-snowflake"></i> מצב ההר
                <div class="dropdown">
                    <a href="#"><i class="fa-solid fa-check-double"></i> מעליות ומסלולים</a>
                    <a href="#"><i class="fa-solid fa-mound"></i> דו"ח שלג עדכני</a>
                    <a href="#"><i class="fa-solid fa-arrows-left-right"></i> מעבר לזארמט</a>
                </div>
            </div>
            <div class="menu-item">
                <i class="fa-solid fa-info-circle"></i> מידע לגולש
                <div class="dropdown">
                    <a href="https://www.cervinia.it/en/ski-area/piste-map" target="_blank">מפת מסלולים PDF</a>
                    <a href="#">השכרת ציוד</a>
                    <a href="#">בתי ספר לסקי</a>
                </div>
            </div>
            <div class="menu-item">
                <i class="fa-solid fa-video"></i> מדיה ולייב
                <div class="dropdown">
                    <a href="https://www.cervinia.it/en/webcam" target="_blank">מצלמות לייב</a>
                    <a href="#">תחזית מורחבת</a>
                    <a href="#">גלריית גולשים</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="live-banner">
        <span>סטטוס: <span id="v-lifts">טוען...</span></span>
        <span>זארמט: <span id="v-conn">בדיקה...</span></span>
    </div>

    <div class="grid">
        <div class="card">
            <i class="fa-solid fa-cloud-sun" style="color:var(--accent); font-size: 1.5rem;"></i>
            <h4>מזג אוויר</h4>
            <div id="w-temp" class="weather-val">--°C</div>
        </div>
        <div class="card"><h4>שלג עיירה</h4><p id="s-town" class="weather-val">--</p></div>
        <div class="card"><h4>שלג פסגה</h4><p id="s-peak" class="weather-val">--</p></div>
    </div>

    <section id="forum">
        <h3>💬 עדכונים מהשטח</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input id="un" placeholder="שם" style="width:25%; padding:12px; border:1px solid #ddd; border-radius:8px;"> 
            <input id="um" placeholder="מה המצב בהר?" style="width:75%; padding:12px; border:1px solid #ddd; border-radius:8px;">
        </div>
        
        <div class="forum-actions">
            <label for="file-upload" class="clip-box"><i class="fa-solid fa-paperclip"></i></label>
            <input type="file" id="file-upload" style="display:none" accept="image/*">
            
            <button onclick="addMainPost()" class="btn-publish-main">
                <i class="fa-solid fa-paper-plane"></i> פרסם הודעה לעדכון
            </button>
        </div>
        <div id="plist"></div>
    </section>

    <script>
        // פונקציית טעינת הנתונים מה-GitHub Action
        async function loadLiveData() {
            try {
                // המערכת מנסה למשוך את הקובץ שהרובוט יצר
                const response = await fetch('data.json');
                const data = await response.json();
                
                document.getElementById('v-lifts').innerText = data.lifts;
                document.getElementById('s-town').innerText = data.town + " ס\"מ";
                document.getElementById('s-peak').innerText = data.peak + " ס\"מ";
                
                const isOpen = data.conn === 'open';
                document.getElementById('v-conn').innerText = isOpen ? "פתוח ✅" : "סגור 🚫";
                document.getElementById('status-dot').style.color = isOpen ? "var(--success)" : "var(--danger)";
                document.getElementById('update-tag').innerText = "עודכן אוטומטית";
            } catch (e) {
                console.log("Waiting for robot data...");
            }
        }

        async function fetchWeather() {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.9338&longitude=7.6311&current=temperature_2m');
            const data = await res.json();
            document.getElementById('w-temp').innerText = Math.round(data.current.temperature_2m) + "°C";
        }

        // פונקציות פורום בסיסיות (לוקאליות בינתיים)
        function renderPosts() { /* כאן יופיע הקוד המקורי של הפורום ששמרת */ }

        window.onload = () => {
            loadLiveData();
            fetchWeather();
            // כאן אפשר להוסיף את שאר הלוגיקה של הפורום מהקבצים הקודמים
        };
    </script>
</body>
</html>

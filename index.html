<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Concrete Build v11</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; }
        body { font-family: 'Segoe UI', system-ui; background: var(--bg); margin: 0; direction: rtl; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        /* יישור טקסט וסמן לימין */
        input, textarea { 
            direction: rtl !important; 
            text-align: right !important; 
            unicode-bidi: plaintext !important; 
            box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;
        }

        nav { background: var(--dark); color: white; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        /* פריסת הפורום */
        .post { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 10px; background: white; }
        .reply-item { margin: 8px 20px 0 0; padding: 10px; background: #f8fbff; border-right: 3px solid var(--accent); border-radius: 4px; }
        .forum-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .forum-icons { display: flex; align-items: center; gap: 15px; color: #666; font-size: 1.1rem; }
        
        .service-btn { background: white; border: 1px solid #ddd; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:bold;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="card">
        <h3>תחזית וצפי (מהיום - 15.02 והלאה)</h3>
        <table>
            <thead><tr><th>צפי</th><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען...</div>
        
        <div style="background: #f1f3f5; padding: 15px; border-radius: 12px; margin-top: 20px;">
            <textarea id="f-input" rows="3" placeholder="מה קורה בצרביניה?"></textarea>
            <div class="forum-footer">
                <div class="forum-icons">
                    <span style="cursor:pointer; font-weight:bold; font-size:0.9rem;" onclick="document.getElementById('f-input').value=''">בטל</span>
                    <i class="fa-solid fa-paperclip" style="cursor:pointer;"></i>
                </div>
                <button class="service-btn" style="background:var(--accent); color:white; border:none;" onclick="sendPost()">פרסם</button>
            </div>
        </div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    window.onload = () => { renderHeader(); loadW(); loadF(); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            area.innerHTML = `<b>${user.name}</b> | <a href="#" onclick="logout()">התנתק</a>`;
        } else {
            area.innerHTML = `<button onclick="mockLogin()" class="service-btn">כניסה</button>`;
        }
    }

    async function loadW() {
        const r = await fetch('data.json?v=' + Date.now());
        const d = await r.json();
        // סינון מה-15 בחודש (היום)
        const filtered = d.forecast.filter(f => parseInt(f.date.split('.')[0]) >= 15).slice(0, 4);
        document.getElementById('w-body').innerHTML = filtered.map(f => {
            const wind = parseFloat(f.wind);
            const prob = wind < 32 ? {c:'#2ecc71', t:'גבוה'} : (wind > 50 ? {c:'#e74c3c', t:'נמוך'} : {c:'#f1c40f', t:'בינוני'});
            return `<tr><td style="color:${prob.c}; font-weight:bold;">${prob.t}</td><td>${f.date}</td><td style="direction:ltr;">${f.temp_min}/${f.temp_max}</td><td>${f.wind}</td><td>${f.visibility}</td></tr>`;
        }).join('');
    }

    async function loadF() {
        const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
        const data = await res.json();
        
        document.getElementById('f-container').innerHTML = data.map(p => `
            <div class="post">
                <b>${p.user}</b>
                <div style="margin:8px 0;">${p.content}</div>
                <span style="color:var(--accent); cursor:pointer; font-size:0.85rem; font-weight:bold;" onclick="openRBox('${p.id}', '${p.user}', this)">השב</span>
                <div class="r-target"></div>
                <div class="replies-list">
                    ${(p.replies || []).map(r => `
                        <div class="reply-item">
                            <b>${r.user}:</b> ${r.content}
                            <div style="margin-top:4px;">
                                <span style="color:var(--accent); cursor:pointer; font-size:0.75rem;" onclick="openRBox('${p.id}', '${r.user}', this)">השב</span>
                                <div class="r-target"></div>
                            </div>
                        </div>`).join('')}
                </div>
            </div>`).join('');
    }

    function openRBox(pId, toUser, el) {
        const target = el.nextElementSibling;
        if(target.innerHTML) { target.innerHTML = ''; return; }
        
        const prefix = `@${toUser}: `;
        target.innerHTML = `
            <div style="margin-top:10px; background:#fff; padding:10px; border:1px solid #ddd; border-radius:8px;">
                <textarea id="in-${pId}" rows="2">${prefix}</textarea>
                <div class="forum-footer">
                    <div class="forum-icons">
                        <span style="cursor:pointer; font-size:0.8rem;" onclick="this.parentElement.parentElement.parentElement.innerHTML=''">בטל</span>
                        <i class="fa-solid fa-paperclip"></i>
                    </div>
                    <button class="service-btn" style="padding:4px 10px; font-size:0.8rem; background:var(--accent); color:white; border:none;" onclick="sendR('${pId}')">שלח</button>
                </div>
            </div>`;
            
        const tx = document.getElementById(`in-${pId}`);
        setTimeout(() => {
            tx.focus();
            // מציב את הסמן בסוף ה-prefix
            tx.setSelectionRange(prefix.length, prefix.length);
        }, 50);
    }

    async function sendPost() {
        const v = document.getElementById('f-input').value;
        if(!user) return alert("אנא התחבר");
        await fetch(`${API}/posts`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({user:user.name, content:v}) });
        document.getElementById('f-input').value = ''; loadF();
    }

    async function sendR(pId) {
        const v = document.querySelector(`#in-${pId}`).value;
        if(!user) return alert("אנא התחבר");
        await fetch(`${API}/replies`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({post_id:pId, user:user.name, content:v}) });
        loadF();
    }

    function mockLogin() { user = {name:"משתמש בדיקה", email:"test@test.com"}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

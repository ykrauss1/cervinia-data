<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Final Stable</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        /* טבלת תחזית */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        th { background: #f8f9fa; }

        /* פורום */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; position: relative; }
        .reply-item { margin-top: 10px; padding: 10px; background: #f8fbff; border-right: 4px solid #cbd5e0; border-radius: 6px; }
        .depth-1 { margin-right: 20px; border-right-color: var(--accent); }
        
        .admin-badge { background: #e74c3c; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin-left: 8px; vertical-align: middle; }
        .user-tag { font-weight: 800; color: var(--dark); font-size: 1rem; }
        .action-link { color: #3498db; cursor: pointer; font-size: 0.85rem; font-weight: bold; margin-top: 5px; display: inline-block; }
        .del-btn { color: var(--error); cursor: pointer; float: left; border: 1px solid var(--error); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; background: white; }
        
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: inherit; margin-top: 10px; }
        .btn-send { background: var(--accent); color: var(--dark); padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa fa-link"></i><br><small>סטטוס קישור</small><br><b id="link-status">בבדיקה...</b></div>
        <div class="stat-card"><i class="fa fa-mountain"></i><br><small>מסלולים</small><br><b>109</b></div>
        <div class="stat-card"><i class="fa fa-wind"></i><br><small>מעליות</small><br><b>47</b></div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים הקרובים</h3>
        <table>
            <thead><tr><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
            <tbody id="w-body"><tr><td colspan="4">טוען נתונים...</td></tr></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <hr>
        <textarea id="f-input" placeholder="כתוב פוסט חדש..."></textarea>
        <button class="btn-send" onclick="sendPost()">פרסם פוסט</button>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }};

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    const ADMIN_NAME = 'ADMIN';

    window.onload = () => { renderHeader(); loadW(); loadF(); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            area.innerHTML = `<div>${user.name === ADMIN_NAME ? '<span class="admin-badge">ADMIN</span>' : ''} שלום, <b>${user.name}</b> | <a href="#" onclick="logout()" style="color:white; font-size:0.8rem;">התנתק</a></div>`;
        } else {
            area.innerHTML = `<button class="btn-send" onclick="login()">כניסה</button>`;
        }
    }

    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            const today = new Date().setHours(0,0,0,0);
            const future = d.forecast.filter(f => new Date(f.date) >= today).slice(0,4);
            document.getElementById('w-body').innerHTML = future.map(f => `
                <tr>
                    <td><b>${f.date.split('-').reverse().join('/')}</b></td>
                    <td dir="ltr">${f.temp_min}/${f.temp_max}</td>
                    <td>${f.wind}</td>
                    <td>${f.visibility}</td>
                </tr>`).join('');
        } catch(e) { document.getElementById('w-body').innerHTML = 'שגיאה בטעינת תחזית'; }
    }

    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
            const data = await res.json();
            const isAdmin = user && user.name === ADMIN_NAME;

            let html = '';
            data.forEach(p => {
                const renderReplies = (parentId = null, depth = 0) => {
                    return (p.replies || [])
                        .filter(r => r.parent_id === parentId)
                        .map(r => `
                            <div class="reply-item ${depth > 0 ? 'depth-1' : ''}">
                                ${isAdmin ? `<button class="del-btn" onclick="smartDelete('replies','${r.id}')">מחק</button>` : ''}
                                <span class="user-tag">${r.user === ADMIN_NAME ? '<span class="admin-badge">ADMIN</span>' : ''}${r.user !== ADMIN_NAME ? r.user : ''}</span>
                                <div style="margin-top:5px;">${r.content}</div>
                                <span class="action-link" onclick="openBox('${p.id}', '${r.user}', this, '${r.id}')">השב</span>
                                <div class="reply-target"></div>
                                ${renderReplies(r.id, depth + 1)}
                            </div>`).join('');
                };

                html += `
                    <div class="post">
                        ${isAdmin ? `<button class="del-btn" onclick="smartDelete('posts','${p.id}')">מחק פוסט</button>` : ''}
                        <span class="user-tag">${p.user === ADMIN_NAME ? '<span class="admin-badge">ADMIN</span>' : ''}${p.user !== ADMIN_NAME ? p.user : ''}</span>
                        <div style="margin:10px 0; font-weight:bold; font-size:1.1rem;">${p.content}</div>
                        <span class="action-link" onclick="openBox('${p.id}', '${p.user}', this, null)">השב</span>
                        <div class="reply-target"></div>
                        <div class="replies-list">${renderReplies(null)}</div>
                    </div>`;
            });
            document.getElementById('f-container').innerHTML = html || 'אין הודעות.';
        } catch(e) { console.error(e); }
    }

    // מחיקה חכמה - פותר את השגיאה שראית
    async function smartDelete(table, id) {
        if(!confirm("למחוק לצמיתות?")) return;
        
        try {
            // אם זו תגובה, נמחק קודם כל תגובות שקשורות אליה כדי לא לשבור את השרת
            if (table === 'replies') {
                await fetch(`${API}/replies?parent_id=eq.${id}`, { method: 'DELETE', headers: HEAD.headers });
            }
            // עכשיו מוחקים את ההודעה עצמה
            const res = await fetch(`${API}/${table}?id=eq.${id}`, { method: 'DELETE', headers: HEAD.headers });
            
            if(res.ok) {
                setTimeout(loadF, 400); // רענון קצר אחרי שהשרת מעדכן
            } else {
                alert("שגיאת שרת במחיקה.");
            }
        } catch (e) { alert("תקלה בחיבור לשרת."); }
    }

    async function sendPost() {
        const input = document.getElementById('f-input');
        if(!user) return login();
        if(!input.value.trim()) return;
        const res = await fetch(`${API}/posts`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({user: user.name, content: input.value.trim()}) });
        if(res.ok) { input.value = ''; loadF(); }
    }

    async function sendReply(pId, pParentId) {
        const area = document.querySelector(`#temp-in-${pId}`);
        if(!user) return login();
        if(!area.value.trim()) return;
        const res = await fetch(`${API}/replies`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({post_id: pId, user: user.name, content: area.value.trim(), parent_id: pParentId}) });
        if(res.ok) loadF();
    }

    function openBox(pId, toUser, el, parentId) {
        const target = el.nextElementSibling;
        if(target.innerHTML !== '') { target.innerHTML = ''; return; }
        document.querySelectorAll('.reply-target').forEach(t => t.innerHTML = '');
        target.innerHTML = `<div style="margin:10px 0; background:#f0f2f5; padding:10px; border-radius:8px;">
            <textarea id="temp-in-${pId}">@${toUser}: </textarea>
            <button class="btn-send" onclick="sendReply('${pId}', ${parentId ? `'${parentId}'` : 'null'})">שלח</button>
        </div>`;
    }

    function login() {
        const n = prompt("שם משתמש (הכנס ADMIN למחיקה):");
        if(n) { user = {name:n}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); }
    }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

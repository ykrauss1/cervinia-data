<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #e0e6ed; --white: #ffffff; --error: #e74c3c; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        nav { background: var(--primary); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-text { font-size: 1.8em; font-weight: 900; }
        .logo-text span { color: var(--accent); }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        /* Quick Links / Live Stats */
        .live-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .link-btn { padding: 15px; border-radius: 12px; text-decoration: none; color: white; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .link-it { background: #008c45; } /* דגל איטליה */
        .link-ch { background: #d52b1e; } /* דגל שוויץ */
        .link-btn:hover { transform: translateY(-3px); opacity: 0.9; }

        /* Forecast Widget */
        .widget-box { background: white; border-radius: 15px; overflow: hidden; border: 2px solid var(--accent); margin-bottom: 25px; text-align: center; }

        /* Forum */
        .post { border-bottom: 2px solid #f8f9fa; padding: 15px 0; position: relative; }
        textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; resize: none; font-family: inherit; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--accent); color: var(--primary); }
        
        /* Auth Modal */
        #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .auth-card { background: white; padding: 30px; border-radius: 15px; width: 320px; text-align: center; }
        .auth-card input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .auth-toggle { font-size: 0.85em; color: var(--accent); cursor: pointer; text-decoration: underline; margin-top: 10px; display: block; }
        .admin-badge { background: var(--error); color: white; padding: 2px 7px; border-radius: 5px; font-size: 0.7em; margin-right: 5px; }
    </style>
</head>
<body>

<nav>
    <div class="logo-text">Cervinia<span>Live</span></div>
    <div id="nav-controls">
        <button class="btn btn-primary" onclick="openAuth()">כניסה / הרשמה</button>
    </div>
</nav>

<div class="container">
    
    <div class="live-links">
        <a href="https://www.cervinia.it/en/מצב-מעליות" target="_blank" class="link-btn link-it">
            <i class="fa-solid fa-person-skiing"></i> מעליות איטליה (Live)
        </a>
        <a href="https://www.matterhornparadise.ch/en/Live/Lifts-and-Pistes" target="_blank" class="link-btn link-ch">
            <i class="fa-solid fa-mountain"></i> מעליות זנרמט (Live)
        </a>
    </div>

    <div class="widget-box">
        <div style="padding:10px; background:var(--accent); color:var(--primary); font-weight:bold;">תחזית ומצב שלג מעודכן</div>
        <iframe src="https://www.snow-forecast.com/resorts/Cervinia/forecasts/feed/m/mid" width="100%" height="250" frameborder="0" scrolling="no"></iframe>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-link"></i> האם הקישור הבינלאומי ייפתח?</h3>
        <table style="width:100%; border-collapse: collapse; text-align:center;">
            <thead><tr style="border-bottom:2px solid #eee;"><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>סטטוס</th></tr></thead>
            <tbody id="forecast-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3><i class="fa-solid fa-comments"></i> עדכונים מהשטח</h3>
        <div id="posts-container">טוען הודעות...</div>
        <div style="margin-top:20px;">
            <textarea id="forum-input" rows="3" placeholder="ראית משהו מעניין? דווח כאן..."></textarea>
            <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="addPost()">שלח עדכון</button>
        </div>
    </div>
</div>

<div id="auth-modal" onclick="closeAuth()">
    <div class="auth-card" onclick="event.stopPropagation()">
        <h3 id="auth-title">כניסה למערכת</h3>
        <input type="text" id="a-name" placeholder="שם משתמש">
        <input type="email" id="a-email" placeholder="אימייל">
        <button class="btn btn-primary" style="width:100%" onclick="processAuth()">אישור</button>
        <span class="auth-toggle" onclick="toggleAuth()">אין לך חשבון? הירשם כאן</span>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    let isRegMode = false;

    function openAuth() { document.getElementById('auth-modal').style.display = 'flex'; }
    function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; }
    
    function toggleAuth() {
        isRegMode = !isRegMode;
        document.getElementById('auth-title').innerText = isRegMode ? 'הרשמה למערכת' : 'כניסה למערכת';
        document.getElementById('a-name').placeholder = isRegMode ? 'בחר שם משתמש' : 'שם משתמש (ADMIN לניהול)';
        event.target.innerText = isRegMode ? 'כבר רשום? היכנס כאן' : 'אין לך חשבון? הירשם כאן';
    }

    async function processAuth() {
        const name = document.getElementById('a-name').value;
        const email = document.getElementById('a-email').value;
        if(!name || !email) return alert("מלא את כל הפרטים");
        user = { name, email };
        localStorage.setItem('skiUser', JSON.stringify(user));
        location.reload();
    }

    function isUserAdmin() { return user && user.email.toLowerCase() === 'ykrauss1@gmail.com' && user.name === 'ADMIN'; }

    function updateUI() {
        if(user) {
            document.getElementById('nav-controls').innerHTML = `
                <span style="margin-left:10px">שלום, <b>${user.name}</b> ${isUserAdmin() ? '<span class="admin-badge">ADMIN</span>' : ''}</span>
                <button onclick="localStorage.clear();location.reload()" style="background:none; border:1px solid white; color:white; padding:5px 10px; border-radius:5px; cursor:pointer;">התנתק</button>
            `;
        }
    }

    async function fetchPosts() {
        const { data: posts } = await _supabase.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
        if (!posts) return;
        const admin = isUserAdmin();
        document.getElementById('posts-container').innerHTML = posts.map(p => `
            <div class="post">
                <b>${p.user}:</b> ${p.content}
                ${admin ? `<button onclick="delP('${p.id}')" style="float:left; color:red; background:none; border:none; cursor:pointer;">מחק</button>` : ''}
            </div>
        `).join('');
    }

    async function addPost() {
        if(!user) return openAuth();
        const content = document.getElementById('forum-input').value;
        if(content.trim()) await _supabase.from('posts').insert([{ user: user.name, content }]);
        location.reload();
    }

    async function delP(id) { if(confirm("למחוק?")) { await _supabase.from('posts').delete().eq('id', id); fetchPosts(); } }

    async function loadWeather() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            document.getElementById('forecast-body').innerHTML = data.forecast.slice(0,4).map(day => {
                const wind = parseInt(day.wind);
                const status = wind > 55 ? '<span style="color:red">סגור</span>' : wind > 40 ? '<span style="color:orange">בסיכון</span>' : '<span style="color:green">פתוח ✅</span>';
                return `<tr style="border-bottom:1px solid #eee; height:40px;"><td>${day.date.split('-').reverse().slice(0,2).join('/')}</td><td>${day.temp_min}/${day.temp_max}</td><td>${day.wind}</td><td>${status}</td></tr>`;
            }).join('');
        } catch(e) {}
    }

    updateUI(); fetchPosts(); loadWeather();
</script>
</body>
</html>

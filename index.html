<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Stable & Locked</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }

        /* מלבנים שחורים - נעול */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 20px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .stat-card i { font-size: 1.4rem; color: var(--accent); margin-bottom: 5px; }

        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }

        /* טבלה יציבה - נעול */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: #f8fafc; padding: 12px; border: 1px solid #eee; text-align: center; }
        td { padding: 12px; border: 1px solid #eee; text-align: center; font-weight: 500; }
        .val-temp { color: #d63031; direction: ltr; }
        .val-wind { color: #2d3436; direction: ltr; }

        /* פורום עם הזחה */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; }
        .nested { margin-right: 40px; margin-top: 10px; border-right: 3px solid var(--accent); padding-right: 15px; background: #f9f9f9; padding: 10px; border-radius: 5px; }
        
        /* כפתורים */
        .btn-row { display: flex; flex-direction: row-reverse; gap: 10px; margin-top: 10px; }
        .btn { padding: 8px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-send { background: var(--accent); color: var(--dark); }
        .btn-cancel { background: #ddd; }

        /* מודאל */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; width: 340px; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-ui"><button class="btn btn-send" onclick="openAuth(true)">כניסה</button></div>
</nav>

<div class="container">
    <div class="stats">
        <div class="stat-card"><i class="fa-solid fa-link"></i><br><small>סטטוס קישור</small><br><b>פתוח</b></div>
        <div class="stat-card"><i class="fa-solid fa-person-skiing"></i><br><small>מסלולים</small><br><b>58 / 72</b></div>
        <div class="stat-card"><i class="fa-solid fa-wind"></i><br><small>רוח פסגה</small><br><b>12 קמ"ש</b></div>
    </div>

    <div class="card">
        <h3>תחזית וסטטוס (DD/MM/YYYY)</h3>
        <table>
            <thead>
                <tr>
                    <th style="width:20%">תאריך</th>
                    <th style="width:25%">טמפרטורה</th>
                    <th style="width:20%">רוח</th>
                    <th style="width:15%">ראות</th>
                    <th style="width:20%">סטטוס</th>
                </tr>
            </thead>
            <tbody id="w-table"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-list">מחבר לפורום...</div>
        <div style="margin-top:20px; border-top: 1px solid #eee; padding-top:20px;">
            <textarea id="f-msg" style="width:100%; height:60px; padding:10px; border-radius:5px; border:1px solid #ddd;" placeholder="כתוב עדכון חדש..."></textarea>
            <div class="btn-row"><button class="btn btn-send" onclick="postMain()">פרסם פוסט</button></div>
        </div>
    </div>
</div>

<div id="auth-modal" class="modal">
    <div class="modal-content">
        <h2>כניסה</h2>
        <input type="email" id="at-email" style="width:100%; padding:10px; margin-bottom:10px;" placeholder="אימייל">
        <button class="btn btn-send" style="width:100%" onclick="doAuth()">אישור</button>
        <button class="btn btn-cancel" style="width:100%; margin-top:10px;" onclick="openAuth(false)">ביטול</button>
    </div>
</div>

<script>
    const S_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const S_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _s = supabase.createClient(S_URL, S_KEY);
    
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    window.onload = () => {
        if(user) document.getElementById('auth-ui').innerHTML = `שלום, ${user.name} | <a href="#" onclick="localStorage.clear();location.reload()" style="color:white">התנתק</a>`;
        loadW();
        loadF();
    };

    // לוגיקת טבלה - נעולה
    async function loadW() {
        try {
            const r = await fetch('data.json?v=' + Date.now());
            const d = await r.json();
            document.getElementById('w-table').innerHTML = d.forecast.slice(0,4).map(f => {
                let dt = f.date.includes('-') ? f.date.split('-').reverse().join('/') : f.date;
                let tMin = f.temp_min.replace(/[^\d.-]/g, '');
                let tMax = f.temp_max.replace(/[^\d.-]/g, '');
                let wind = f.wind.replace(/[^\d.]/g, '');
                return `<tr><td><b>${dt}</b></td><td class="val-temp">${tMin}° / ${tMax}°C</td><td class="val-wind">${wind} קמ"ש</td><td>${f.visibility || 'טובה'}</td><td style="color:green; font-weight:bold">פתוח</td></tr>`;
            }).join('');
        } catch(e) {}
    }

    // לוגיקת פורום - מעקף לחסימות
    async function loadF() {
        try {
            const { data, error } = await _s.from('posts').select('*, replies(*)').order('created_at', {ascending: false});
            if(error) throw error;
            document.getElementById('f-list').innerHTML = data.map(p => {
                const rs = (p.replies || []).map(r => `<div class="nested"><b>${r.user}:</b> ${r.content}</div>`).join('');
                return `<div class="post"><b>${p.user}:</b> ${p.content} <div style="font-size:0.8rem; color:blue; cursor:pointer;" onclick="openRep('${p.id}')">השב</div><div id="target-${p.id}"></div>${rs}</div>`;
            }).join('');
        } catch(e) {
            document.getElementById('f-list').innerHTML = `<div style="color:red">שגיאת חיבור לפורום. נסה לרענן או לבדוק חוסם פרסומות.</div>`;
        }
    }

    function openAuth(s) { document.getElementById('auth-modal').style.display = s ? 'flex' : 'none'; }
    function doAuth() {
        const email = document.getElementById('at-email').value;
        if(email) {
            user = { name: email.split('@')[0], email };
            localStorage.setItem('skiUser', JSON.stringify(user));
            location.reload();
        }
    }

    async function postMain() {
        if(!user) return openAuth(true);
        const txt = document.getElementById('f-msg').value;
        if(txt.trim()) {
            await _s.from('posts').insert([{ user: user.name, content: txt }]);
            document.getElementById('f-msg').value = "";
            loadF();
        }
    }

    function openRep(pId) {
        if(!user) return openAuth(true);
        document.getElementById('target-' + pId).innerHTML = `<div class="btn-row"><textarea id="ti-${pId}" style="width:100%"></textarea><button class="btn btn-send" onclick="sendRep('${pId}')">שלח</button></div>`;
    }

    async function sendRep(pId) {
        const val = document.getElementById('ti-' + pId).value;
        if(val.trim()) {
            await _s.from('replies').insert([{ post_id: pId, user: user.name, content: val }]);
            loadF();
        }
    }
</script>
</body>
</html>

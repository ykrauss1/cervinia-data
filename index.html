<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - Stable Final</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #e0e6ed; --error: #e74c3c; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #333; }
        nav { background: var(--primary); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-text { font-size: 1.8em; font-weight: 900; cursor: pointer; }
        .logo-text span { color: var(--accent); }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }

        /* Status & Weather */
        .live-status-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .status-item { background: #0d1b3e; color: white; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .status-val { font-size: 1.5em; font-weight: bold; color: var(--error); }
        .weather-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .weather-card { background: #d9e2ec; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #c0cbd9; }
        .ltr { direction: ltr; display: inline-block; }

        /* Table */
        .forecast-table { width: 100%; border-collapse: collapse; text-align: center; }
        .forecast-table th { background: #f1f5f9; padding: 12px; border-bottom: 2px solid #ddd; }
        .forecast-table td { padding: 12px; border-bottom: 1px solid #eee; }

        /* Forum & Indented Replies */
        .forum-window { max-height: 450px; overflow-y: auto; background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 15px; }
        .post { border-bottom: 2px solid #f0f0f0; padding: 15px 0; }
        .replies-container { margin-top: 10px; margin-right: 30px; border-right: 3px solid #dee2e6; padding-right: 15px; }
        .reply-item { background: #f1f4f9; padding: 10px; border-radius: 8px; margin-top: 8px; border: 1px solid #e2e8f0; }
        .post-meta { font-weight: bold; font-size: 0.9em; }
        .action-link { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: bold; font-size: 0.8em; margin-left: 10px; padding: 0; }
        
        .btn { padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--accent); color: var(--primary); }
        .btn-logout { background: var(--error); color: white; margin-right: 10px; }
        .reply-input-box { display: none; margin-top: 10px; }
    </style>
</head>
<body>

<nav>
    <div class="logo-text" onclick="location.reload()">Cervinia<span>Live</span></div>
    <div id="nav-controls"><button class="btn btn-primary" onclick="openAuth()">כניסה</button></div>
</nav>

<div class="container">
    <div class="live-status-bar">
        <div class="status-item"><i class="fa-solid fa-link"></i><div class="status-val">N/A</div><small>קישור לצ'רמט</small></div>
        <div class="status-item"><i class="fa-solid fa-route"></i><div class="status-val">N/A</div><small>מסלולים פתוחים</small></div>
        <div class="status-item"><i class="fa-solid fa-cable-car"></i><div class="status-val">N/A</div><small>מעליות פתוחות</small></div>
    </div>

    <div class="weather-grid">
        <div class="weather-card"><h4>Plateau Rosa (3480m)</h4><div class="ltr"><b id="p-temp">--</b>° | <b id="p-snow">--</b>cm</div></div>
        <div class="weather-card"><h4>Plan Maison (2550m)</h4><div class="ltr"><b id="m-temp">--</b>° | <b id="m-snow">--</b>cm</div></div>
        <div class="weather-card"><h4>עיירה (2050m)</h4><div class="ltr"><b id="t-temp">--</b>° | <b id="t-snow">--</b>cm</div></div>
    </div>

    <div class="card">
        <h3>תחזית וסטטוס</h3>
        <table class="forecast-table">
            <thead><tr><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th><th>ממטרים</th><th>סטטוס</th></tr></thead>
            <tbody id="forecast-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="posts-container" class="forum-window">טוען...</div>
        <div style="margin-top:15px;">
            <textarea id="forum-input" rows="2" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;" placeholder="כתוב משהו..."></textarea>
            <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="addPost()">שלח פוסט</button>
        </div>
    </div>
</div>

<div id="auth-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:3000;" onclick="if(event.target.id === 'auth-modal') this.style.display='none'">
    <div class="card" style="width:300px;" onclick="event.stopPropagation()">
        <h3>התחברות</h3>
        <input type="text" id="a-name" placeholder="שם" style="width:100%; margin-bottom:10px; padding:8px;">
        <input type="email" id="a-email" placeholder="אימייל" style="width:100%; margin-bottom:10px; padding:8px;">
        <button class="btn btn-primary" style="width:100%" onclick="processAuth()">אישור</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    function openAuth() { document.getElementById('auth-modal').style.display='flex'; }
    function processAuth() {
        const n = document.getElementById('a-name').value, e = document.getElementById('a-email').value;
        if(n && e) { localStorage.setItem('skiUser', JSON.stringify({name:n, email:e})); location.reload(); }
    }

    async function loadData() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            ['p','m','t'].forEach((k,i) => {
                const lvl = ['plateau','plan','town'][i];
                document.getElementById(k+'-temp').innerText = data.levels[lvl].temp;
                document.getElementById(k+'-snow').innerText = data.levels[lvl].snow;
            });

            // FIXED DATE LOGIC & 4 DAYS
            const today = new Date(); today.setHours(0,0,0,0);
            const toDisplay = data.forecast.filter(d => {
                const p = d.date.split(/[/-]/);
                const dObj = new Date(p[2] || 2026, p[1]-1, p[0]);
                return dObj >= today;
            }).slice(0, 4);

            document.getElementById('forecast-body').innerHTML = toDisplay.map(d => `
                <tr>
                    <td><b>${d.date}</b></td>
                    <td class="ltr">${d.temp_min}/${d.temp_max}°C</td>
                    <td class="ltr">${d.wind} km/h</td>
                    <td>${d.visibility || 'טובה'}</td>
                    <td>${d.humidity || 'N/A'}</td>
                    <td style="color:${parseInt(d.wind)>45?'orange':'green'}; font-weight:bold">${parseInt(d.wind)>45?'בסיכון':'פתוח'}</td>
                </tr>`).join('');
        } catch(e) { console.error(e); }
    }

    async function fetchPosts() {
        const { data: posts } = await _supabase.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
        if (!posts) return;
        const isAdmin = user && user.email === 'ykrauss1@gmail.com';

        document.getElementById('posts-container').innerHTML = posts.map(p => `
            <div class="post">
                <div class="post-meta">${p.user} <small style="color:#888; font-weight:normal;">${new Date(p.created_at).toLocaleString('he-IL')}</small></div>
                <div>${p.content}</div>
                <button class="action-link" onclick="toggleR('${p.id}')">השב</button>
                ${isAdmin ? `<button class="action-link" style="color:red" onclick="delP('${p.id}')">מחק</button>` : ''}
                <div id="box-${p.id}" class="reply-input-box">
                    <input type="text" id="in-${p.id}" style="width:70%; padding:5px; border-radius:4px; border:1px solid #ddd;">
                    <button class="btn btn-primary" style="padding:4px 10px;" onclick="addR('${p.id}')">שלח</button>
                </div>
                <div class="replies-container">
                    ${(p.replies || []).map(r => `
                        <div class="reply-item">
                            <div class="post-meta">${r.user}</div>
                            <div>${r.content}</div>
                            <button class="action-link" onclick="toggleR('${p.id}')">השב</button>
                            ${isAdmin ? `<button class="action-link" style="color:red" onclick="delR('${r.id}')">מחק</button>` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>`).join('');
    }

    function toggleR(id) { const b = document.getElementById('box-'+id); b.style.display = b.style.display==='block'?'none':'block'; }
    async function addR(pId) { if(!user) return openAuth(); const v = document.getElementById('in-'+pId).value; if(v.trim()){ await _supabase.from('replies').insert([{post_id:pId, user:user.name, content:v}]); fetchPosts(); }}
    async function addPost() { if(!user) return openAuth(); const c = document.getElementById('forum-input').value; if(c.trim()){ await _supabase.from('posts').insert([{user:user.name, content:c}]); document.getElementById('forum-input').value=""; fetchPosts(); }}
    async function delP(id) { if(confirm("מחק?")) { await _supabase.from('posts').delete().eq('id', id); fetchPosts(); } }
    async function delR(id) { if(confirm("מחק?")) { await _supabase.from('replies').delete().eq('id', id); fetchPosts(); } }

    if(user) { document.getElementById('nav-controls').innerHTML = `<span>שלום, <b>${user.name}</b></span> <button class="btn btn-logout" onclick="localStorage.clear();location.reload()">התנתק</button>`; }
    loadData(); fetchPosts();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - הכל במקום אחד</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; --warning: #f1c40f; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        nav { background: var(--dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        
        /* Admin Dashboard */
        .admin-box { background: #fff3cd; border: 2px solid #ffeeba; padding: 20px; border-radius: 12px; margin-bottom: 25px; display: none; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }

        /* Stats & Cards */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 25px; }
        .stat-card { background: var(--dark); color: white; padding: 15px; border-radius: 12px; text-align: center; border-bottom: 4px solid var(--accent); }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #eee; text-align: center; }
        th { background: #f8f9fa; }

        /* Forum */
        .post { border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 15px; background: white; position: relative; }
        .btn-send { background: var(--accent); color: var(--dark); padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; margin-top: 10px; font-family: inherit; resize: none; }
        .del-btn { color: var(--error); cursor: pointer; float: left; border: 1px solid var(--error); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; background: white; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:900;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div id="admin-dashboard" class="admin-box">
        <h3><i class="fa fa-user-shield"></i> מרכז שליטה אדמין</h3>
        <div class="admin-grid">
            <div class="card" style="margin:0">
                <h4><i class="fa fa-chart-line"></i> כניסות לאתר</h4>
                <div id="visit-count" style="font-size:1.5rem; font-weight:bold">טוען...</div>
            </div>
            <div class="card" style="margin:0">
                <h4><i class="fa fa-edit"></i> עדכון מצב אתר</h4>
                <button class="btn-send" style="background:var(--dark); color:white" onclick="updateSiteStatusManual()">עדכן מסלולים ומעליות</button>
            </div>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card"><i class="fa fa-thermometer-half"></i><br><small>טמפ' (P. Rosa)</small><br><b id="stat-temp">--</b></div>
        <div class="stat-card"><i class="fa fa-mountain"></i><br><small>מסלולים פתוחים</small><br><b id="stat-slopes">--</b></div>
        <div class="stat-card"><i class="fa fa-wind"></i><br><small>מעליות פתוחות</small><br><b id="stat-lifts">--</b></div>
        <div class="stat-card"><i class="fa fa-exchange-alt"></i><br><small>קישור לצ'רמט</small><br><b id="stat-conn">--</b></div>
    </div>

    <div class="card">
        <h3>תחזית ל-4 ימים הקרובים (Plateau Rosà)</h3>
        <table>
            <thead><tr><th>סטטוס קישור</th><th>תאריך</th><th>טמפ'</th><th>רוח</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-top: 15px;">
            <textarea id="f-input" rows="3" placeholder="יש לכם עדכון מהשטח? שתפו אותנו..."></textarea>
            <button class="btn-send" style="margin-top:10px" onclick="sendPost()">פרסם הודעה</button>
        </div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};

    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    const ADMIN_NAME = 'ADMIN';

    window.onload = () => { 
        renderHeader(); 
        loadLiveWeather(); 
        loadSiteStatus(); 
        loadF(); 
        logVisit(); 
    };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) {
            area.innerHTML = `<span>${user.name === ADMIN_NAME ? '🔴 ' : ''}שלום, <b>${user.name}</b> | <a href="#" onclick="logout()" style="color:white; text-decoration:none; border-bottom:1px solid">התנתק</a></span>`;
            if(user.name === ADMIN_NAME) {
                document.getElementById('admin-dashboard').style.display = 'block';
                loadAdminStats();
            }
        } else {
            area.innerHTML = `<button class="btn-send" style="width:auto; padding:5px 15px" onclick="login()">כניסה</button>`;
        }
    }

    // מונה כניסות
    async function logVisit() {
        try { await fetch(`${API}/visits`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({ page: 'home' }) }); } catch(e) {}
    }

    async function loadAdminStats() {
        try {
            const res = await fetch(`${API}/visits?select=count`, { headers: { ...HEAD.headers, 'Prefer': 'count=exact' } });
            const count = res.headers.get('content-range').split('/')[1];
            document.getElementById('visit-count').innerText = count + ' כניסות';
        } catch(e) { document.getElementById('visit-count').innerText = 'שגיאה בטעינה'; }
    }

    // מזג אוויר חי מ-API (Open-Meteo)
    async function loadLiveWeather() {
        try {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.93&longitude=7.71&current=temperature_2m,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max&timezone=Europe%2FRome');
            const d = await res.json();
            document.getElementById('stat-temp').innerText = d.current.temperature_2m + '°C';
            
            let html = '';
            for(let i=0; i<4; i++) {
                const wind = d.daily.wind_speed_10m_max[i];
                const status = wind > 50 ? 'סגור' : (wind > 35 ? 'מוגבל' : 'פתוח');
                const color = wind > 50 ? 'var(--error)' : (wind > 35 ? 'var(--warning)' : 'var(--success)');
                html += `<tr><td style="color:${color}; font-weight:bold">${status}</td><td>${d.daily.time[i]}</td><td>${d.daily.temperature_2m_min[i]} / ${d.daily.temperature_2m_max[i]}</td><td>${wind} קמ"ש</td></tr>`;
            }
            document.getElementById('w-body').innerHTML = html;
        } catch(e) { console.error("Weather error", e); }
    }

    // טעינת סטטוס אתר מ-Supabase
    async function loadSiteStatus() {
        try {
            const res = await fetch(`${API}/site_status?select=*&id=eq.1`, HEAD);
            const data = await res.json();
            if(data && data[0]) {
                const s = data[0];
                document.getElementById('stat-slopes').innerText = s.slopes;
                document.getElementById('stat-lifts').innerText = s.lifts;
                const conn = document.getElementById('stat-conn');
                conn.innerText = s.zermatt_link === 'open' ? 'פתוח' : 'סגור';
                conn.style.color = s.zermatt_link === 'open' ? 'var(--success)' : 'var(--error)';
            }
        } catch(e) {}
    }

    // עדכון ידני לאדמין
    async function updateSiteStatusManual() {
        const s = prompt("מסלולים פתוחים (למשל 12/72):", document.getElementById('stat-slopes').innerText);
        const l = prompt("מעליות פתוחות (למשל 8/20):", document.getElementById('stat-lifts').innerText);
        const z = confirm("האם הקישור לצ'רמט פתוח? (אישור=פתוח, ביטול=סגור)") ? 'open' : 'closed';
        
        if(s !== null && l !== null) {
            const res = await fetch(`${API}/site_status?id=eq.1`, {
                method: 'PATCH',
                headers: HEAD.headers,
                body: JSON.stringify({ slopes: s, lifts: l, zermatt_link: z })
            });
            if(res.ok) location.reload();
        }
    }

    // פורום
    async function loadF() {
        try {
            const res = await fetch(`${API}/posts?select=*&order=created_at.desc`, HEAD);
            const data = await res.json();
            const isAdmin = user && user.name === ADMIN_NAME;
            document.getElementById('f-container').innerHTML = data.map(p => `
                <div class="post">
                    ${isAdmin ? `<button class="del-btn" onclick="deleteMsg('${p.id}')">מחק</button>` : ''}
                    <b>${p.user}</b>: ${p.content}
                    <div style="font-size:0.7rem; color:#888; margin-top:5px;">${new Date(p.created_at).toLocaleString('he-IL')}</div>
                </div>
            `).join('') || 'אין הודעות בפורום.';
        } catch(e) {}
    }

    async function sendPost() {
        const input = document.getElementById('f-input');
        if(!user) return login();
        if(!input.value.trim()) return;
        
        const res = await fetch(`${API}/posts`, { 
            method:'POST', 
            headers: HEAD.headers, 
            body: JSON.stringify({ user: user.name, content: input.value.trim() }) 
        });
        if(res.ok) { input.value = ''; loadF(); }
    }

    async function deleteMsg(id) {
        if(confirm("למחוק את ההודעה?")) {
            await fetch(`${API}/posts?id=eq.${id}`, { method: 'DELETE', headers: HEAD.headers });
            loadF();
        }
    }

    function login() { 
        const n = prompt("איך קוראים לך?"); 
        if(n) { 
            user = {name: n}; 
            localStorage.setItem('skiUser', JSON.stringify(user)); 
            location.reload(); 
        } 
    }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
</script>
</body>
</html>

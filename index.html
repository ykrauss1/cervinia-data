<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CerviniaLive - Stable Version</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #0a192f; --accent: #4cc9f0; --bg: #e0e6ed; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        
        /* Navbar */
        nav { background: var(--primary); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.8em; font-weight: 900; }
        .logo span { color: var(--accent); }
        
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }

        /* Top Status (The Concrete Part) */
        .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .status-box { background: #0d1b3e; color: white; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--accent); }
        .status-box b { display: block; font-size: 1.4em; color: var(--error); }

        /* Table Alignment */
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f1f5f9; padding: 12px; border: 1px solid #ddd; }
        td { padding: 12px; border: 1px solid #eee; text-align: center; }
        .ltr { direction: ltr; display: inline-block; }

        /* Forum & Nesting */
        .post { border: 1px solid #e2e8f0; padding: 15px; border-radius: 10px; margin-bottom: 15px; background: #fff; }
        .reply-node { 
            margin-right: 40px; /* הזחה לימין ב-RTL = הזחה שמאלה ויזואלית */
            margin-top: 10px; 
            padding: 10px; 
            background: #f8fafc; 
            border-right: 3px solid var(--accent); 
            border-radius: 6px; 
        }
        
        /* Action Links */
        .action-bar { margin-top: 8px; display: flex; gap: 15px; }
        .action-link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.85em; font-weight: bold; padding: 0; }
        .btn-del { color: var(--error); }

        /* Reply Input Box */
        .reply-box { background: white; border: 2px solid var(--accent); padding: 10px; border-radius: 8px; margin-top: 10px; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 5px; padding: 8px; font-family: inherit; box-sizing: border-box; }
        
        /* Button Order Fix */
        .btn-group { display: flex; justify-content: flex-start; gap: 10px; margin-top: 10px; }
        .btn { padding: 6px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-send { background: var(--accent); color: var(--primary); } /* מופיע ראשון מימין */
        .btn-cancel { background: #cbd5e0; color: #333; }
    </style>
</head>
<body>

<nav>
    <div class="logo">Cervinia<span>Live</span></div>
    <div id="auth-zone"><button class="btn btn-send" onclick="login()">כניסה</button></div>
</nav>

<div class="container">
    <div class="status-grid">
        <div class="status-box"><small>קישור לצ'רמט</small><b id="link-val">פתוח</b></div>
        <div class="status-box"><small>מסלולים פתוחים</small><b id="slopes-val">54/72</b></div>
        <div class="status-box"><small>מעליות פתוחות</small><b id="lifts-val">18/22</b></div>
    </div>

    <div class="card">
        <h3>תחזית וסטטוס (4 ימים)</h3>
        <table id="weather-table">
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>טמפ'</th>
                    <th>רוח</th>
                    <th>ראות</th>
                    <th>סטטוס</th>
                </tr>
            </thead>
            <tbody id="forecast-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="forum-root">טוען הודעות...</div>
        <div style="margin-top:20px;">
            <textarea id="main-post-input" rows="2" placeholder="כתוב עדכון חדש..."></textarea>
            <div class="btn-group">
                <button class="btn btn-send" onclick="sendMainPost()">פרסם פוסט</button>
            </div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;

    // --- טעינת נתונים ---
    async function loadWeather() {
        try {
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            const tbody = document.getElementById('forecast-body');
            tbody.innerHTML = data.forecast.slice(0, 4).map(d => `
                <tr>
                    <td><b>${d.date}</b></td>
                    <td class="ltr">${d.temp_min}/${d.temp_max}°C</td>
                    <td class="ltr">${d.wind} km/h</td>
                    <td>${d.visibility || 'טובה'}</td>
                    <td style="color:green; font-weight:bold">פתוח</td>
                </tr>
            `).join('');
        } catch (e) { console.error("Table Error:", e); }
    }

    // --- פורום וקינון ---
    async function loadForum() {
        const { data: posts } = await _supabase.from('posts').select('*, replies(*)').order('created_at', { ascending: false });
        if (!posts) return;

        const isAdmin = user && user.email === 'ykrauss1@gmail.com';
        const root = document.getElementById('forum-root');
        
        root.innerHTML = posts.map(p => `
            <div class="post">
                <div style="font-weight:bold; color:var(--primary)">${p.user}:</div>
                <div>${p.content}</div>
                <div class="action-bar">
                    <button class="action-link" onclick="openReplyBox('${p.id}', '${p.id}')">השב</button>
                    ${isAdmin ? `<button class="action-link btn-del" onclick="deleteItem('posts','${p.id}')">מחק פוסט</button>` : ''}
                </div>
                <div id="box-${p.id}"></div>
                <div class="replies-container">
                    ${(p.replies || []).map(r => `
                        <div class="reply-node">
                            <div style="font-weight:bold">${r.user}:</div>
                            <div>${r.content}</div>
                            <div class="action-bar">
                                <button class="action-link" onclick="openReplyBox('${p.id}', '${r.id}')">השב</button>
                                ${isAdmin ? `<button class="action-link btn-del" onclick="deleteItem('replies','${r.id}')">מחק</button>` : ''}
                            </div>
                            <div id="box-${r.id}"></div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    function openReplyBox(postId, targetId) {
        document.querySelectorAll('.reply-box').forEach(el => el.remove());
        const div = document.getElementById('box-' + targetId);
        div.innerHTML = `
            <div class="reply-box">
                <textarea id="input-${targetId}" placeholder="כתוב תגובה..."></textarea>
                <div class="btn-group">
                    <button class="btn btn-send" onclick="submitReply('${postId}', '${targetId}')">שלח</button>
                    <button class="btn btn-cancel" onclick="this.parentElement.parentElement.remove()">ביטול</button>
                </div>
            </div>`;
    }

    async function submitReply(pId, tId) {
        if(!user) return login();
        const val = document.getElementById('input-' + tId).value;
        if(!val.trim()) return;
        await _supabase.from('replies').insert([{ post_id: pId, user: user.name, content: val }]);
        loadForum();
    }

    async function sendMainPost() {
        if(!user) return login();
        const val = document.getElementById('main-post-input').value;
        if(!val.trim()) return;
        await _supabase.from('posts').insert([{ user: user.name, content: val }]);
        document.getElementById('main-post-input').value = "";
        loadForum();
    }

    async function deleteItem(table, id) {
        if(confirm("למחוק?")) {
            await _supabase.from(table).delete().eq('id', id);
            loadForum();
        }
    }

    function login() {
        const n = prompt("שם:"), e = prompt("אימייל:");
        if(n && e) {
            localStorage.setItem('skiUser', JSON.stringify({name:n, email:e}));
            location.reload();
        }
    }

    if(user) {
        document.getElementById('auth-zone').innerHTML = `
            <span>שלום, <b>${user.name}</b></span>
            <button class="btn btn-cancel" style="margin-right:10px" onclick="localStorage.clear();location.reload()">התנתק</button>
        `;
    }

    // Escape לסגירת תיבות
    window.addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelectorAll('.reply-box').forEach(el => el.remove()); });

    loadWeather();
    loadForum();
</script>
</body>
</html>

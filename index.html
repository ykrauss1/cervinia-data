<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Cervinia 2026 - Final Test</title>
    <style>
        /* עיצוב שונה לחלוטין כדי לדעת שזה עבד */
        body { background: #1a1a1a; color: #fff; font-family: Arial; text-align: center; padding-top: 100px; }
        .data-card { border: 5px solid yellow; display: inline-block; padding: 30px; border-radius: 20px; }
        h1 { color: yellow; }
        .val { font-size: 50px; color: #00ff00; }
    </style>
</head>
<body>

    <div class="data-card">
        <h1>בדיקת נתונים סופית</h1>
        <p>מעליות:</p>
        <div id="lifts" class="val">טוען...</div>
        <p>חיבור לצמרט:</p>
        <div id="conn" class="val" style="font-size: 30px;">--</div>
        <div id="msg" style="margin-top:20px; color: #888;"></div>
    </div>

    <script>
        async function getData() {
            // הכתובת ה-RAW הנכונה שבדקנו קודם
            const url = 'https://raw.githubusercontent.com/ykrauss1/cervinia-data/main/data.json';
            
            try {
                // הוספת סימן שאלה וזמן כדי למנוע Cache ב-100%
                const response = await fetch(url + '?nocache=' + new Date().getTime());
                const data = await response.json();
                
                document.getElementById('lifts').innerText = data.lifts;
                document.getElementById('conn').innerText = data.conn.toUpperCase();
                document.getElementById('msg').innerText = "עודכן ב: " + data.lastUpdate;
            } catch (e) {
                document.getElementById('msg').innerText = "שגיאת חיבור (CORS) - פועל רק בגיטהאב";
                // נתונים ידניים כדי לראות שהסקריפט רץ
                document.getElementById('lifts').innerText = "שגיאה";
            }
        }
        getData();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>CerviniaLive - Restoration Build v12</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        :root { --dark: #0a192f; --accent: #4cc9f0; --bg: #f4f7f9; --error: #e74c3c; --success: #2ecc71; --warning: #f1c40f; }
        body { font-family: 'Segoe UI', system-ui; background: var(--bg); margin: 0; direction: rtl; }
        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        /* תיקון סמן ימני מוחלט */
        input, textarea { 
            direction: rtl !important; 
            text-align: right !important; 
            unicode-bidi: plaintext !important; 
            box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
        }

        nav { background: var(--dark); color: white; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; }
        .admin-badge { background: var(--error); color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; margin-left: 10px; }

        .services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 25px; }
        .service-btn { background: white; border: 1px solid #ddd; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #eee; }

        /* פורום */
        .post { border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 10px; background: white; position: relative; }
        .reply-item { margin: 8px 25px 0 0; padding: 10px; background: #f8fbff; border-right: 3px solid var(--accent); border-radius: 4px; }
        .forum-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .forum-icons { display: flex; align-items: center; gap: 15px; color: #666; font-size: 1.2rem; }

        /* מודלים */
        .modal { display: none; position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; }
        .modal-content { background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 20px; position: relative; }
        .close-btn { position: absolute; left: 20px; top: 20px; cursor: pointer; font-size: 1.5rem; }
        .counter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 8px; }
        .c-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--accent); background: white; cursor: pointer; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<nav>
    <div style="font-size:1.5rem; font-weight:bold;">Cervinia<span style="color:var(--accent)">Live</span></div>
    <div id="auth-area"></div>
</nav>

<div class="container">
    <div class="services-grid">
        <div class="service-btn" onclick="openM('hotelModal')"><i class="fa-solid fa-hotel"></i> אירוח</div>
        <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-schools')"><i class="fa-solid fa-graduation-cap"></i> הדרכה</div>
        <div class="service-btn" onclick="window.open('https://www.cervinia.it/en/winter/ski-rental')"><i class="fa-solid fa-person-skiing"></i> השכרת ציוד</div>
        <div class="service-btn" onclick="openM('mapModal')"><i class="fa-solid fa-map-location-dot"></i> מפות</div>
    </div>

    <div class="card">
        <h3>תחזית וצפי (מהיום 15.02)</h3>
        <table>
            <thead><tr><th>צפי</th><th>תאריך</th><th>טמפ'</th><th>רוח</th><th>ראות</th></tr></thead>
            <tbody id="w-body"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>עדכונים מהשטח</h3>
        <div id="f-container">טוען הודעות...</div>
        <div style="background: #f1f3f5; padding: 20px; border-radius: 12px; margin-top: 20px;">
            <textarea id="f-input" rows="3" placeholder="מה קורה בצרביניה?"></textarea>
            <div class="forum-footer">
                <div class="forum-icons">
                    <span style="cursor:pointer; font-weight:bold; font-size:0.9rem;" onclick="document.getElementById('f-input').value=''">בטל</span>
                    <i class="fa-solid fa-paperclip" style="cursor:pointer;"></i>
                </div>
                <button class="service-btn" style="background:var(--accent); color:white; border:none; padding:10px 30px;" onclick="sendPost()">פרסם</button>
            </div>
        </div>
    </div>
</div>

<div id="authModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeM('authModal')">×</span>
        <h3 style="text-align:center;">כניסה / רישום</h3>
        <input type="text" id="authName" placeholder="שם מלא" style="margin-bottom:10px;">
        <input type="email" id="authEmail" placeholder="אימייל" style="margin-bottom:10px;">
        <input type="password" id="authPass" placeholder="סיסמה" style="margin-bottom:20px;">
        <button class="service-btn" style="width:100%; background:var(--accent); color:white; border:none;" onclick="handleAuth()">התחברות</button>
    </div>
</div>

<div id="hotelModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeM('hotelModal')">×</span>
        <h3>חיפוש אירוח</h3>
        <input type="text" id="dateRange" placeholder="בחר תאריכים...">
        <div class="counter-row" style="margin-top:15px;"><span>מבוגרים</span><div><button class="c-btn" onclick="upCount('adults',-1)">-</button> <b id="val-adults">2</b> <button class="c-btn" onclick="upCount('adults',1)">+</button></div></div>
        <div class="counter-row"><span>חדרים</span><div><button class="c-btn" onclick="upCount('rooms',-1)">-</button> <b id="val-rooms">1</b> <button class="c-btn" onclick="upCount('rooms',1)">+</button></div></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">
            <button class="service-btn" onclick="doSearch('booking')">Booking</button>
            <button class="service-btn" onclick="doSearch('airbnb')">Airbnb</button>
        </div>
    </div>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content" style="max-width:850px; height:80vh;">
        <span class="close-btn" onclick="closeM('mapModal')">×</span>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="service-btn" style="flex:1" onclick="loadMap('slopes')">מסלולים</button>
            <button class="service-btn" style="flex:1" onclick="loadMap('town')">העיירה</button>
            <button class="service-btn" style="flex:1" onclick="loadMap('mymap')">המפה שלי</button>
        </div>
        <div style="height:80%; border:1px solid #eee; border-radius:10px; overflow:hidden;">
            <img id="map-img" src="" style="width:100%; height:100%; object-fit:contain; display:none;">
            <iframe id="map-frame" src="" width="100%" height="100%" style="border:none;"></iframe>
        </div>
    </div>
</div>

<script>
    const API = 'https://cdgqodtbdhsqkvcgcdlm.supabase.co/rest/v1';
    const KEY = 'sb_publishable_B4HOCQF3IxN_6Ojz1_ctnA_k6JEAR4g';
    const HEAD = { headers: { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' }};
    let user = JSON.parse(localStorage.getItem('skiUser')) || null;
    let counts = { adults: 2, rooms: 1 };

    window.onload = () => { renderHeader(); loadW(); loadF(); flatpickr("#dateRange", { mode: "range", minDate: "today" }); };

    function renderHeader() {
        const area = document.getElementById('auth-area');
        if(user) { 
            const isAdmin = (user.email === 'ykrauss1@gmail.com');
            area.innerHTML = `<div>${isAdmin ? '<span class="admin-badge">ADMIN</span>' : ''} <b>${user.name}</b> | <a href="#" onclick="logout()" style="color:#888;">התנתק</a></div>`; 
        } else { area.innerHTML = `<button onclick="openM('authModal')" class="service-btn">כניסה</button>`; }
    }

    async function loadW() {
        const r = await fetch('data.json?v=' + Date.now());
        const d = await r.json();
        const filtered = d.forecast.filter(f => parseInt(f.date.split('.')[0]) >= 15).slice(0, 4);
        document.getElementById('w-body').innerHTML = filtered.map(f => {
            const wind = parseFloat(f.wind);
            const prob = wind < 32 ? {c:'var(--success)', t:'גבוה'} : (wind > 50 ? {c:'var(--error)', t:'נמוך'} : {c:'var(--warning)', t:'בינוני'});
            return `<tr><td style="color:${prob.c}; font-weight:bold;">${prob.t}</td><td>${f.date}</td><td style="direction:ltr;">${f.temp_min}/${f.temp_max}</td><td>${f.wind}</td><td>${f.visibility}</td></tr>`;
        }).join('');
    }

    async function loadF() {
        const res = await fetch(`${API}/posts?select=*,replies(*)&order=created_at.desc`, HEAD);
        const data = await res.json();
        const isAdmin = user && user.email === 'ykrauss1@gmail.com';
        document.getElementById('f-container').innerHTML = data.map(p => `
            <div class="post">
                ${isAdmin ? `<span style="color:red; cursor:pointer; float:left;" onclick="del('posts','${p.id}')"><i class="fa-solid fa-trash-can"></i></span>` : ''}
                <b>${p.user}</b> <div style="margin:8px 0;">${p.content}</div>
                <span style="color:var(--accent); cursor:pointer; font-size:0.85rem; font-weight:bold;" onclick="openRBox('${p.id}', '${p.user}', this)">השב</span>
                <div class="r-target"></div>
                ${(p.replies || []).map(r => `
                    <div class="reply-item">
                        <b>${r.user}:</b> ${r.content}
                        <div style="margin-top:5px;"><span style="color:var(--accent); cursor:pointer; font-size:0.75rem;" onclick="openRBox('${p.id}', '${r.user}', this)">השב</span><div class="r-target"></div></div>
                    </div>`).join('')}
            </div>`).join('');
    }

    function openRBox(pId, toUser, el) {
        const target = el.nextElementSibling;
        if(target.innerHTML) { target.innerHTML = ''; return; }
        const prefix = `@${toUser}: `;
        target.innerHTML = `<div style="margin-top:10px; background:#f9f9f9; padding:10px; border-radius:8px; border:1px solid #ddd;">
            <textarea id="in-${pId}" rows="2">${prefix}</textarea>
            <div class="forum-footer">
                <div class="forum-icons"><span style="cursor:pointer; font-size:0.8rem;" onclick="this.parentElement.parentElement.parentElement.innerHTML=''">בטל</span><i class="fa-solid fa-paperclip"></i></div>
                <button class="service-btn" style="padding:4px 10px; font-size:0.8rem; background:var(--accent); color:white; border:none;" onclick="sendR('${pId}')">שלח</button>
            </div></div>`;
        const tx = document.getElementById(`in-${pId}`);
        setTimeout(() => { tx.focus(); tx.setSelectionRange(prefix.length, prefix.length); }, 50);
    }

    async function sendPost() {
        const v = document.getElementById('f-input').value;
        if(!user) return openM('authModal');
        await fetch(`${API}/posts`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({user:user.name, content:v.trim()}) });
        document.getElementById('f-input').value = ''; loadF();
    }

    async function sendR(pId) {
        const v = document.getElementById(`in-${pId}`).value;
        if(!user) return openM('authModal');
        await fetch(`${API}/replies`, { method:'POST', headers: HEAD.headers, body: JSON.stringify({post_id:pId, user:user.name, content:v.trim()}) });
        loadF();
    }

    async function del(tbl, id) { if(confirm('למחוק לצמיתות?')) { await fetch(`${API}/${tbl}?id=eq.${id}`, { method:'DELETE', headers: HEAD.headers }); loadF(); } }

    function upCount(t,v) { counts[t] = Math.max(1, counts[t]+v); document.getElementById(`val-${t}`).innerText = counts[t]; }
    function doSearch(site) {
        const d = document.getElementById('dateRange').value.split(" to ");
        if(d.length < 2) return alert("בחר תאריכים");
        window.open(site === 'booking' ? `https://www.booking.com/searchresults.he.html?ss=Breuil-Cervinia&checkin=${d[0]}&checkout=${d[1]}&group_adults=${counts.adults}` : `https://www.airbnb.co.il/s/Breuil-Cervinia/homes?checkin=${d[0]}&checkout=${d[1]}`);
    }

    function loadMap(type) {
        const f = document.getElementById('map-frame'); const i = document.getElementById('map-img');
        if(type === 'mymap') { f.style.display='none'; i.style.display='block'; i.src='mymap.jpg'; }
        else { i.style.display='none'; f.style.display='block'; f.src = type === 'slopes' ? 'https://raw.githubusercontent.com/ykrauss/Cervinia/main/slopesmap.pdf' : 'https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2777.6!2d7.6!3d45.9!'; }
    }

    function handleAuth() {
        const n = document.getElementById('authName').value; const e = document.getElementById('authEmail').value;
        if(n && e) { user = {name:n, email:e}; localStorage.setItem('skiUser', JSON.stringify(user)); location.reload(); }
    }
    function logout() { localStorage.removeItem('skiUser'); location.reload(); }
    function openM(id) { document.getElementById(id).style.display='flex'; }
    function closeM(id) { document.getElementById(id).style.display='none'; }
</script>
</body>
</html>
